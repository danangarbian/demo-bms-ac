function getCityHub(city) {
  return CITY_HUBS.find((h) => h.id === city) || CITY_HUBS[2];
}
function getCityStock(part, city) {
  const hub = getCityHub(city);
  return Number(part && part[hub.stockKey]) || 0;
}
function adjustCityStock(part, city, delta) {
  if (!part) return 0;
  const hub = getCityHub(city);
  const nextVal = Math.max(0, (Number(part[hub.stockKey]) || 0) + Number(delta || 0));
  part[hub.stockKey] = nextVal;
  return nextVal;
}

  return CITY_HUBS.reduce((s, h) => s + (Number(part && part[h.stockKey]) || 0), 0);

function nextSeqId(items, prefix, padLen = 3, fields = ['id', 'invNumber', 'poNumber', 'bastNumber']) {
  const re = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '-(\\d+)$');
  let maxNum = 0;
  (items || []).forEach((item) => {
    fields.forEach((f) => {
      const val = item && item[f];
      if (typeof val === 'string') {
        const m = val.match(re);
        if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10) || 0);
      }
    });
  });
  return `${prefix}-${String(maxNum + 1).padStart(padLen, '0')}`;
}

function computePmStatus(nextPmDate) {
  if (!nextPmDate) return 'Terjadwal Aman';
  const target = new Date(nextPmDate + 'T00:00:00').getTime();
  if (isNaN(target)) return 'Terjadwal Aman';
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const diffDays = Math.ceil((target - todayMid) / 86400000);
  if (diffDays <= 0) return 'Jatuh Tempo';
  if (diffDays <= 7) return 'Segera (H-7)';
  return 'Terjadwal Aman';
}

function formatBuildingTitlePrefix(buildingName) {
  const name = String(buildingName || '').trim();
  return /^gedung\b/i.test(name) ? name : `Gedung ${name}`;
}

function updateFilterAndRender(filterKey, value, inputId) {
  uiFilters[filterKey] = value;
  const el = inputId ? document.getElementById(inputId) : null;
  const selStart = el && typeof el.selectionStart === 'number' ? el.selectionStart : null;
  const selEnd = el && typeof el.selectionEnd === 'number' ? el.selectionEnd : null;
  renderDashboard();
  if (inputId) {
    const newEl = document.getElementById(inputId);
    if (newEl) {
      newEl.focus();
      if (selStart !== null && selEnd !== null && typeof newEl.setSelectionRange === 'function') {
        try { newEl.setSelectionRange(selStart, selEnd); } catch (_) {}
      }
    }
  }
}

function downloadTextFile(filename, content, mimeType = 'text/plain;charset=utf-8') {
  try {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`Berkas ${filename} berhasil diunduh.`, 'success');
  } catch (err) {
    copyToClipboard(content, filename);
  }
}

function getTicketSlaInfo(ticket) {
  const targetMin = ticket.slaTargetMinutes || 120;
  const endTs = ticket.completedAt ? new Date(ticket.completedAt).getTime() : Date.now();
  const startTs = ticket.createdAt ? new Date(ticket.createdAt).getTime() : endTs;
  const elapsedMin = Math.max(1, Math.round((endTs - startTs) / 60000));
  const breached = ticket.status !== 'Selesai' ? elapsedMin > targetMin : elapsedMin > targetMin * 2;
  const remainingMin = targetMin - elapsedMin;
  return {
    targetMin,
    elapsedMin,
    breached,
    remainingMin,
    label: ticket.status === 'Selesai'
      ? `Selesai ${elapsedMin} mnt`
      : breached
        ? `Melewati SLA (+${Math.abs(remainingMin)} mnt)`
        : `Sisa SLA ${remainingMin} mnt (Target <${targetMin} mnt)`
  };
}

function computeSlaAndMttrMetrics(ticketsList) {
  const list = ticketsList || state.tickets || [];
  const done = list.filter((t) => t.status === 'Selesai' && t.completedAt && t.createdAt);
  const totalMttrMin = done.reduce((s, t) => s + Math.max(1, Math.round((new Date(t.completedAt).getTime() - new Date(t.createdAt).getTime()) / 60000)), 0);
  const avgMttrMin = done.length > 0 ? Math.round(totalMttrMin / done.length) : 0;
  const correctiveOrActive = list.filter((t) => t.ticketType !== 'Preventive');
  const breachedCount = correctiveOrActive.filter((t) => getTicketSlaInfo(t).breached).length;
  const compliancePct = correctiveOrActive.length > 0
    ? Math.max(0, Math.round(((correctiveOrActive.length - breachedCount) / correctiveOrActive.length) * 100))
    : 100;
  return { compliancePct, avgMttrMin, doneCount: done.length, breachedCount };
}

function syncBuildingKwhFromRooms(building) {
  if (!building || !Array.isArray(building.rooms)) return 0;
  let deltaKw = 0;
  building.rooms.forEach((r) => {
    const prev = r._lastSyncedPowerKw !== undefined ? Number(r._lastSyncedPowerKw) : Number(r.powerKw) || 0;
    const curr = Number(r.powerKw) || 0;
    deltaKw += (curr - prev);
    r._lastSyncedPowerKw = curr;
  });
  if (Math.abs(deltaKw) < 0.05) return 0;
  const deltaDailyKwh = Math.round(deltaKw * 10);
  const deltaMonthlyKwh = Math.round(deltaKw * 10 * 30);
  if (Array.isArray(building.kwh7Days) && building.kwh7Days.length > 0) {
    const lastIdx = building.kwh7Days.length - 1;
    building.kwh7Days[lastIdx] = Math.max(120, building.kwh7Days[lastIdx] + deltaDailyKwh);
  }
  building.kwhMonthly = Math.max(3000, (building.kwhMonthly || 30000) + deltaMonthlyKwh);
  return deltaDailyKwh;
}

/* =========================================================
   SMART IOT SCHEDULING & ROI ENGINE (KHUSUS AC CENTRAL)
   ========================================================= */
function computeBuildingSavings(building, simOverride) {
  const sim = simOverride || state.roiSim || { setpointBoostC: 2.0, cutHoursPerDay: 3.0, wbpMode: true };
  const z = building.zones || {
    critical24: { mode: '24 Jam Non-Stop', setpoint: 19.0, locked: true },
    officeOpd: { autoCutoff: true, onTime: '06:30', offTime: '16:30', setpoint: 23.0, weekendAutoOff: true },
    publicWbp: { setpointGuard: true, minSetpoint: 23.5, wbpLimiter: true }
  };

  const baselineKwhMonth = building.baselineMonthlyKwh || Math.round((building.kwhMonthly || 35000) / 0.75);
  const baselineEnergyRpMonth = baselineKwhMonth * ELECTRIC_TARIFF_RP;
  const baselineMaintRpMonth = building.baselineMonthlyMaintRp || 28000000;
  const baselineTotalOverheadMonth = baselineEnergyRpMonth + baselineMaintRpMonth;

  const weekendBonus = (z.officeOpd.autoCutoff && z.officeOpd.weekendAutoOff) ? 0.015 : 0;
  const autoCutoffPct = z.officeOpd.autoCutoff ? (0.038 + 0.019 * sim.cutHoursPerDay + weekendBonus) : 0;
  const minSpBonus = Math.max(0, ((z.publicWbp.minSetpoint || 23.5) - 23.5) * 0.015);
  const setpointGuardPct = z.publicWbp.setpointGuard ? (0.030 + 0.030 * sim.setpointBoostC + minSpBonus) : 0;
  const wbpPct = (z.publicWbp.wbpLimiter && sim.wbpMode) ? 0.060 : 0;

  const totalEnergyReductionRatio = Math.min(0.36, autoCutoffPct + setpointGuardPct + wbpPct);
  const kwhReductionRatio = Math.min(0.32, autoCutoffPct + setpointGuardPct + wbpPct * 0.72);

  const savedKwhMonth = Math.round(baselineKwhMonth * kwhReductionRatio);
  const actualKwhMonth = Math.max(0, baselineKwhMonth - savedKwhMonth);
  const energySavedRpMonth = Math.round(baselineEnergyRpMonth * totalEnergyReductionRatio);

  const preventiveFactor = 0.115 + (z.officeOpd.autoCutoff ? 0.04 : 0) + (z.officeOpd.weekendAutoOff ? 0.01 : 0) + (z.publicWbp.setpointGuard ? 0.035 : 0) + (z.publicWbp.wbpLimiter ? 0.015 : 0);
  const avoidedCompressorOverhaulRpMonth = Math.round(baselineMaintRpMonth * preventiveFactor);
  const pmContractEfficiencyRpMonth = Math.round(baselineMaintRpMonth * 0.11);

  const totalSavedRpMonth = energySavedRpMonth + avoidedCompressorOverhaulRpMonth + pmContractEfficiencyRpMonth;
  const totalSavedRpYear = totalSavedRpMonth * 12;
  const overheadReductionPct = baselineTotalOverheadMonth > 0 ? Number(((totalSavedRpMonth / baselineTotalOverheadMonth) * 100).toFixed(1)) : 0;

  return {
    baselineKwhMonth,
    actualKwhMonth,
    savedKwhMonth,
    savedKwhYear: savedKwhMonth * 12,
    baselineEnergyRpMonth,
    baselineMaintRpMonth,
    baselineTotalOverheadMonth,
    energySavedRpMonth,
    avoidedCompressorOverhaulRpMonth,
    pmContractEfficiencyRpMonth,
    totalSavedRpMonth,
    totalSavedRpYear,
    postBmsOverheadMonth: Math.max(0, baselineTotalOverheadMonth - totalSavedRpMonth),
    overheadReductionPct,
    kwhReductionPct: Number((kwhReductionRatio * 100).toFixed(1))
  };
}

function computeScopeROI(buildings) {
  let baselineKwhMonth = 0, actualKwhMonth = 0, savedKwhMonth = 0;
  let baselineEnergyRpMonth = 0, baselineMaintRpMonth = 0, baselineTotalOverheadMonth = 0;
  let energySavedRpMonth = 0, avoidedCompressorOverhaulRpMonth = 0, pmContractEfficiencyRpMonth = 0;

  buildings.forEach((b) => {
    const s = computeBuildingSavings(b);
    baselineKwhMonth += s.baselineKwhMonth;
    actualKwhMonth += s.actualKwhMonth;
    savedKwhMonth += s.savedKwhMonth;
    baselineEnergyRpMonth += s.baselineEnergyRpMonth;
    baselineMaintRpMonth += s.baselineMaintRpMonth;
    baselineTotalOverheadMonth += s.baselineTotalOverheadMonth;
    energySavedRpMonth += s.energySavedRpMonth;
    avoidedCompressorOverhaulRpMonth += s.avoidedCompressorOverhaulRpMonth;
    pmContractEfficiencyRpMonth += s.pmContractEfficiencyRpMonth;
  });

  const totalSavedRpMonth = energySavedRpMonth + avoidedCompressorOverhaulRpMonth + pmContractEfficiencyRpMonth;
  const totalSavedRpYear = totalSavedRpMonth * 12;
  const overheadReductionPct = baselineTotalOverheadMonth > 0 ? Number(((totalSavedRpMonth / baselineTotalOverheadMonth) * 100).toFixed(1)) : 0;
  const capexPerBldJuta = Number((state.roiSim && state.roiSim.capexPerBuildingJuta) || 42);
  const estCapexRp = Math.max(1, buildings.length) * capexPerBldJuta * 1000000;
  const paybackMonths = totalSavedRpMonth > 0 ? Number((estCapexRp / totalSavedRpMonth).toFixed(1)) : 0;

  return {
    buildingCount: buildings.length,
    baselineKwhMonth,
    actualKwhMonth,
    savedKwhMonth,
    savedKwhYear: savedKwhMonth * 12,
    baselineEnergyRpMonth,
    baselineMaintRpMonth,
    baselineTotalOverheadMonth,
    energySavedRpMonth,
    avoidedCompressorOverhaulRpMonth,
    pmContractEfficiencyRpMonth,
    totalSavedRpMonth,
    totalSavedRpYear,
    postBmsOverheadMonth: Math.max(0, baselineTotalOverheadMonth - totalSavedRpMonth),
    overheadReductionPct,
    capexPerBldJuta,
    estCapexRp,
    paybackMonths
  };
}

function formatTimeAgo(iso) {
  if (!iso) return '-';
  const diffSec = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (diffSec < 60) return 'Baru saja';
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + ' mnt lalu';
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return diffHour + ' jam lalu';
  return Math.floor(diffHour / 24) + ' hari lalu';
}

function formatDateTime(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const id = 'toast_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const styles = {
    success: 'bg-emerald-900 text-white border-emerald-700',
    error: 'bg-rose-900 text-white border-rose-700',
    warning: 'bg-amber-900 text-white border-amber-700',
    info: 'bg-slate-900 text-white border-slate-700'
  };
  const icons = { success: 'check-circle-2', error: 'alert-octagon', warning: 'alert-triangle', info: 'info' };
  const el = document.createElement('div');
  el.id = id;
  el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl border shadow-xl text-xs font-medium animate-slide-up ${styles[type] || styles.info}`;
  el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i><span class="flex-1 leading-relaxed">${escapeHtml(message)}</span><button type="button" onclick="const t=document.getElementById('${id}');if(t)t.remove();" aria-label="Tutup notifikasi" class="p-0.5 rounded hover:bg-white/15 text-white/80 hover:text-white shrink-0 leading-none text-sm font-bold">&times;</button>`;
  container.appendChild(el);
  if (window.lucide) lucide.createIcons({ root: el });
  setTimeout(() => { const t = document.getElementById(id); if (t) t.remove(); }, 4200);
}

function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}

function destroyAllCharts() {
  Object.keys(chartInstances).forEach((k) => { if (chartInstances[k]) chartInstances[k].destroy(); });
  chartInstances = {};
}

function renderChart(canvasId, config) {
  destroyChart(canvasId);
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return null;
  chartInstances[canvasId] = new Chart(canvas.getContext('2d'), config);
  return chartInstances[canvasId];
}

function copyToClipboard(text, label = 'Teks') {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(`${label} berhasil disalin ke clipboard.`, 'success')).catch(() => fallbackCopy(text, label));
  } else {
    fallbackCopy(text, label);
  }
}

function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  showToast(`${label} berhasil disalin.`, 'success');
}

function toggleNotifDropdown(e) {
  if (e) e.stopPropagation();

}

document.addEventListener('click', (e) => {
  const wrapper = document.getElementById('notif-wrapper');
  const dd = document.getElementById('notif-dropdown');
  if (wrapper && dd && !wrapper.contains(e.target)) dd.classList.add('hidden');
});

function renderNotifications() {
  const acc = getCurrentAccount();
  if (!acc) return;
  const userNotifs = state.notifications.filter((n) => n.targetUser === acc.username);
  const unreadCount = userNotifs.filter((n) => !n.read).length;
  const badge = document.getElementById('notif-badge');
  if (unreadCount > 0) { badge.textContent = unreadCount > 99 ? '99+' : unreadCount; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
  document.getElementById('notif-owner-label').textContent = `Khusus akun @${acc.username} (${unreadCount} belum dibaca)`;
  const listEl = document.getElementById('notif-list');
  if (userNotifs.length === 0) {
    listEl.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">Belum ada notifikasi untuk akun ini.</div>';
    return;
  }
  const sevDot = { error: 'bg-rose-500', warning: 'bg-amber-500', success: 'bg-emerald-500', info: 'bg-sky-500' };
  listEl.innerHTML = userNotifs.map((n) => `
    <button type="button" onclick="handleNotificationClick('${n.id}')" class="w-full text-left px-4 py-3 hover:bg-slate-50 transition flex items-start gap-2.5 ${n.read ? 'opacity-65' : 'bg-teal-50/40'}">
      <span class="w-2 h-2 rounded-full mt-1.5 shrink-0 ${sevDot[n.severity] || 'bg-slate-400'}"></span>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-bold text-slate-900 truncate">${escapeHtml(n.title)}</span>
          ${!n.read ? '<span class="w-1.5 h-1.5 rounded-full bg-teal-600 shrink-0"></span>' : ''}
        </div>
        <p class="text-[11px] text-slate-600 mt-0.5 leading-relaxed">${escapeHtml(n.message)}</p>
        <div class="text-[10px] text-slate-400 mt-1">${formatTimeAgo(n.createdAt)}</div>
      </div>
    </button>
  `).join('');
}

function markAllNotificationsRead() {
  const acc = getCurrentAccount();
  if (!acc) return;
  state.notifications.forEach((n) => { if (n.targetUser === acc.username) n.read = true; });
  saveState();
  renderNotifications();
  showToast('Semua notifikasi akun ini ditandai sudah dibaca.', 'success');
}

function handleNotificationClick(notifId) {
  const acc = getCurrentAccount();
  if (!acc) return;
  const notif = state.notifications.find((n) => n.id === notifId && n.targetUser === acc.username);
  if (!notif) return;
  notif.read = true;
  saveState();
  document.getElementById('notif-dropdown').classList.add('hidden');
  if (notif.targetTab) switchTab(notif.targetTab);
  else renderNotifications();

  const ref = notif.targetRef;
  if (ref && ref.type === 'invoice' && ref.id) {
    openInvoiceBastModal(ref.id);
  } else if (ref && ref.type === 'room' && ref.clientId && ref.buildingId && ref.roomId) {
    openRoomDetailModal(ref.clientId, ref.buildingId, ref.roomId);
  } else if (ref && ref.type === 'ticket' && ref.id) {
    const t = state.tickets.find((x) => x.id === ref.id);
    if (t) {
      if (acc.role === 'technician') openTechFloorplanModal(t.id);
      else if (acc.role === 'client') showToast(`Menampilkan tiket ${t.id} (${t.roomName}) — ${t.status}.`, 'info');
      else showToast(`Menuju tiket ${t.id} (${t.clientName} - ${t.roomName}).`, 'info');
    }
  } else if (notif.title && notif.title.includes('QT-')) {
    const m = notif.title.match(/QT-\d{4}-\d{3}/);
    if (m) openInvoiceBastModal(m[0]);
  }
}

function toggleSimModeFields() {
  const mode = document.querySelector('input[name="sim-mode"]:checked')?.value || 'targeted_error';
  const bldWrap = document.getElementById('sim-building-wrap');
  const rrWrap = document.getElementById('sim-room-rule-wrap');
  const ruleWrap = document.getElementById('sim-rule-wrap');
  const btn = document.getElementById('sim-submit-btn');
  if (mode === 'random') {
    if (bldWrap) bldWrap.classList.add('hidden');
    if (rrWrap) rrWrap.classList.add('hidden');
    if (btn) btn.innerHTML = '<i data-lucide="zap" class="w-3.5 h-3.5"></i><span>Picu Error Acak</span>';
  } else {
    if (bldWrap) bldWrap.classList.remove('hidden');
    if (rrWrap) rrWrap.classList.remove('hidden');
    if (ruleWrap) ruleWrap.classList.toggle('hidden', mode === 'overusage');
    if (btn) {
      btn.innerHTML = mode === 'overusage'
        ? '<i data-lucide="flame" class="w-3.5 h-3.5"></i><span>Picu Over-Usage 18.5°C</span>'
        : '<i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i><span>Picu Error Terarah</span>';
    }
  }
  if (window.lucide) lucide.createIcons();
}

function updateSimModalCascade() {
  const clientSel = document.getElementById('sim-client-select');
  const bldSel = document.getElementById('sim-building-select');
  if (!clientSel || !bldSel) return;
  const cid = clientSel.value;
  if (cid === 'random') {
    bldSel.innerHTML = '<option value="random">Acak (Semua Gedung)</option>';
  } else {
    const c = state.clients.find((x) => x.id === cid);
    bldSel.innerHTML = '<option value="random">Acak di Klien Ini</option>' + (c ? c.buildings.map((b) => `<option value="${b.id}">${escapeHtml(b.name)} (${escapeHtml(b.brand)})</option>`).join('') : '');
  }
  updateSimRoomAndRuleOptions();
}

function updateSimRoomAndRuleOptions() {
  const cid = document.getElementById('sim-client-select')?.value;
  const bid = document.getElementById('sim-building-select')?.value;
  const roomSel = document.getElementById('sim-room-select');
  const ruleSel = document.getElementById('sim-rule-select');
  if (!roomSel || !ruleSel) return;

  let rooms = [];
  let brandFilter = null;
  state.clients.forEach((c) => {
    if (cid !== 'random' && c.id !== cid) return;
    c.buildings.forEach((b) => {
      if (bid !== 'random' && b.id !== bid) return;
      if (bid !== 'random') brandFilter = b.brand;
      (b.rooms || []).forEach((r) => {
        if (r.status !== 'Error') rooms.push({ c, b, r });
      });
    });
  });
  roomSel.innerHTML = '<option value="random">Acak (Pilih Ruangan Normal)</option>' + rooms.map((x) => `<option value="${x.r.id}">${escapeHtml(x.r.unitId)} &mdash; ${escapeHtml(x.r.name)} (${escapeHtml(x.b.name)})</option>`).join('');
  const rules = brandFilter ? state.errorDictionary.filter((d) => d.brand === brandFilter) : state.errorDictionary;

function quickRandomSimulateError() {
  const randomRadio = document.querySelector('input[name="sim-mode"][value="random"]');
  if (randomRadio) randomRadio.checked = true;

  if (clientSel) clientSel.value = 'random';

}

function submitSimulateError(e, opts = {}) {
  if (e) e.preventDefault();
  const mode = opts.forceMode || document.querySelector('input[name="sim-mode"]:checked')?.value || 'targeted_error';
  const targetClientId = document.getElementById('sim-client-select')?.value || 'random';
  const targetBldId = document.getElementById('sim-building-select')?.value || 'random';
  const targetRoomId = document.getElementById('sim-room-select')?.value || 'random';
  const targetRuleId = document.getElementById('sim-rule-select')?.value || 'random';

  let candidates = [];
  state.clients.forEach((c) => {
    if (targetClientId !== 'random' && c.id !== targetClientId) return;
    c.buildings.forEach((b) => {
      if (mode !== 'random' && targetBldId !== 'random' && b.id !== targetBldId) return;
      b.rooms.forEach((r) => {
        if (mode !== 'random' && targetRoomId !== 'random' && r.id !== targetRoomId) return;
        if (mode === 'overusage') {
          if (r.status !== 'Error' && r.zoneType !== 'critical24') candidates.push({ client: c, building: b, room: r });
        } else if (r.status !== 'Error') {
          candidates.push({ client: c, building: b, room: r });
        }
      });
    });
  });

  if (candidates.length === 0) {
    showToast(mode === 'overusage' ? 'Tidak ada ruangan non-kritis yang tersedia untuk simulasi Over-Usage.' : 'Semua ruangan pada target yang dipilih sudah berstatus Error.', 'warning');
    return;
  }

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const actorAcc = getCurrentAccount();

  if (mode === 'overusage') {
    const oldKw = Number(pick.room.powerKw) || 4.8;
    pick.room.status = 'Normal';
    pick.room.errorCode = null;
    pick.room.mode = 'Cool';
    pick.room.targetTemp = 18.5;
    pick.room.temp = 18.7;
    pick.room.isOverusage = true;
    pick.room.powerKw = computeRoomRemotePowerKw(pick.room, 'Cool', 18.5);
    if (pick.room.powerKw <= oldKw) pick.room.powerKw = Number((oldKw * 1.38).toFixed(1));
    syncBuildingKwhFromRooms(pick.building);
    pushNotification(pick.client.ownerUsername, `Deteksi Over-Usage: ${pick.room.name} (${pick.building.name})`, `Unit ${pick.room.unitId} disetel terlalu dingin (18.5°C, ${pick.room.powerKw} kW). Klik untuk optimasi Eco 23.5°C.`, 'warning', 'units', { type: 'room', clientId: pick.client.id, buildingId: pick.building.id, roomId: pick.room.id });
    pushNotification('admin_eka', `Alert Over-Usage [${pick.client.city}]: ${pick.client.name}`, `${pick.building.name} - ${pick.room.name} (${pick.room.unitId}) boros energi di 18.5°C (${pick.room.powerKw} kW).`, 'warning', 'floorplan');
    addAuditLog(actorAcc ? actorAcc.username : 'system', actorAcc ? actorAcc.role : 'System', pick.client.city, `Simulasi Over-Usage energi: ${pick.client.name} (${pick.building.name} - ${pick.room.name} ${pick.room.unitId}) disetel 18.5°C.`);
    saveState();
    closeModal();
    renderDashboard();
    showToast(`Simulasi Over-Usage dipicu di ${pick.room.name} (${pick.room.unitId})!`, 'warning');
    return;
  }

  let rule = (mode !== 'random' && targetRuleId !== 'random') ? state.errorDictionary.find((d) => d.id === targetRuleId) : null;
  if (!rule) {
    const brandRules = state.errorDictionary.filter((d) => d.brand === pick.building.brand);
    rule = brandRules.length > 0 ? brandRules[Math.floor(Math.random() * brandRules.length)] : state.errorDictionary[0];
  }

  pick.room.status = 'Error';
  pick.room.errorCode = rule.code;
  pick.room.mode = 'Cool';
  pick.room.temp = Number((pick.room.targetTemp + 5.8 + Math.random() * 2.2).toFixed(1));
  pick.room.tempHistory6h = [
    pick.room.targetTemp,
    Number((pick.room.targetTemp + 0.8).toFixed(1)),
    Number((pick.room.targetTemp + 2.1).toFixed(1)),
    Number((pick.room.targetTemp + 3.6).toFixed(1)),
    Number((pick.room.targetTemp + 4.9).toFixed(1)),
    pick.room.temp
  ];

  const woNum = nextSeqId(state.tickets, 'WO-2026', 3, ['id']);
  const nowIso = new Date().toISOString();
  state.tickets.unshift({
    id: woNum, ticketType: 'Corrective', slaTargetMinutes: pick.room.zoneType === 'critical24' ? 30 : 120,
    clientId: pick.client.id, clientName: pick.client.name, clientUsername: pick.client.ownerUsername,
    city: pick.client.city, buildingId: pick.building.id, buildingName: pick.building.name, roomId: pick.room.id,
    roomName: pick.room.name, floor: pick.room.floor, unitId: pick.room.unitId, brand: pick.building.brand,
    errorCode: rule.code, status: 'Menunggu Penugasan', assignedTo: null, techAccepted: false, checklistDone: {},
    createdAt: nowIso, updatedAt: nowIso, completedAt: null, repairNotes: '', partsUsed: ''
  });

  pushNotification(pick.client.ownerUsername, `Gangguan Pendinginan ${pick.room.name} (${pick.building.name} ${pick.room.floor})`, `${rule.humanTranslation} Tiket ${woNum} otomatis dikirim ke distributor.`, 'error', 'tickets', { type: 'ticket', id: woNum });
  pushNotification('admin_eka', `Error Baru [${pick.client.city}]: ${pick.client.name} (${rule.code})`, `${pick.building.name} - ${pick.room.name} mengalami ${rule.factoryMeaning}. Siap ditugaskan ke teknisi ${pick.client.city}.`, 'error', 'errors', { type: 'ticket', id: woNum });
  pushNotification('superadmin', `Alert Gateway ${pick.building.gatewayId} (${pick.building.brand})`, `Kode error ${rule.code} terdeteksi di ${pick.client.name} (${pick.client.city}).`, 'warning', 'overview');

  addAuditLog(actorAcc ? actorAcc.username : 'system', actorAcc ? actorAcc.role : 'System', pick.client.city, `Simulasi error baru ${woNum}: ${pick.client.name} (${pick.building.name} - ${pick.room.name}) [${pick.building.brand} ${rule.code}].`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Simulasi Error ${woNum} (${rule.code}) berhasil dipicu di ${pick.client.name}!`, 'error');
}

function submitGatewayForm(e, editClientId, editBuildingId) {
  e.preventDefault();
  const cid = editClientId || document.getElementById('gw-client').value;
  const client = state.clients.find((c) => c.id === cid);
  if (!client) return;
  const gatewayId = document.getElementById('gw-id').value.trim().toUpperCase();
  const name = document.getElementById('gw-name').value.trim();
  const fullName = document.getElementById('gw-fullname').value.trim();
  const brand = document.getElementById('gw-brand').value;
  const protocol = document.getElementById('gw-proto').value;
  const iduCount = Math.max(1, parseInt(document.getElementById('gw-idu').value, 10) || 24);

  if (editBuildingId) {
    const bld = client.buildings.find((b) => b.id === editBuildingId);
    if (!bld) return;
    bld.gatewayId = gatewayId;
    bld.name = name;
    bld.fullName = fullName;
    bld.brand = brand;
    bld.protocol = protocol;
    bld.iduCount = iduCount;
    if (!client.brands.includes(brand)) client.brands.push(brand);
    addAuditLog('superadmin', 'superadmin', client.city, `Memperbarui konfigurasi Gateway ${gatewayId} (${client.name} - ${name}).`);
    showToast(`Gateway ${gatewayId} berhasil diperbarui.`, 'success');
  } else {
    const newBldId = 'bld_' + Date.now();
    const apiKey = 'cs_live_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36).slice(-4);
    const nextPm = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
    client.buildings.push({
      id: newBldId, name, fullName, brand, gatewayId, protocol, apiKey,
      gatewayStatus: 'Online', latencyMs: 32, iduCount,
      pmFrequency: 'Bulanan', lastPmDate: new Date().toISOString().slice(0, 10), nextPmDate: nextPm, pmStatus: computePmStatus(nextPm),
      baselineMonthlyKwh: iduCount * 520, kwh7Days: [920, 940, 935, 950, 960, 945, 955], kwhMonthly: iduCount * 380, baselineMonthlyMaintRp: 24000000,
      zones: {
        critical24: { label: 'Zona 1 — Kritis / Operasional 24/7', mode: '24 Jam Non-Stop', setpoint: 19.0, locked: true },
        officeOpd: { label: 'Zona 2 — Jam Kerja / Kantor', autoCutoff: true, onTime: '06:30', offTime: '16:30', setpoint: 23.0, weekendAutoOff: true },
        publicWbp: { label: 'Zona 3 — Area Publik & Komersial', setpointGuard: true, minSetpoint: 23.5, wbpLimiter: true }
      },
      rooms: [
        { id: 'rm_' + Date.now() + '_1', unitId: 'IDU-' + name.replace(/\W+/g, '').slice(0, 4).toUpperCase() + '-101', floor: 'Lt. 1', name: 'Lobby & Panel Utama', temp: 23.2, targetTemp: 23.5, mode: 'Cool', powerKw: 4.5, _lastSyncedPowerKw: 4.5, status: 'Normal', errorCode: null, zoneType: 'publicWbp', tempHistory6h: [23.1, 23.2, 23.2, 23.1, 23.2, 23.2] }
      ]
    });
    if (!client.brands.includes(brand)) client.brands.push(brand);
    addAuditLog('superadmin', 'superadmin', client.city, `Menambahkan Edge Gateway baru ${gatewayId} (${client.name} - ${name}).`);
    showToast(`Edge Gateway baru ${gatewayId} berhasil didaftarkan!`, 'success');
  }
  saveState();
  closeModal();
  renderDashboard();
}

function rotateGatewayApiKey(clientId, buildingId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!bld) return;
  const suffix = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  bld.apiKey = `cs_live_${client.city.slice(0, 3).toLowerCase()}_${suffix}`;
  revealedApiKeys[bld.id] = true;
  addAuditLog('superadmin', 'superadmin', client.city, `Merotasi API Key Edge Gateway ${bld.gatewayId} (${bld.name}).`);
  saveState();
  renderDashboard();
  showToast(`API Key ${bld.gatewayId} berhasil dirotasi.`, 'success');
}

function toggleApiKeyReveal(buildingId) {
  revealedApiKeys[buildingId] = !revealedApiKeys[buildingId];
  renderDashboard();
}

function pingAllGateways() {
  let onlineCount = 0;
  let totalCount = 0;
  state.clients.forEach((c) => c.buildings.forEach((b) => {
    totalCount++;
    if (b.gatewayStatus === 'Online') {
      b.latencyMs = 24 + Math.floor(Math.random() * 35);
      onlineCount++;
    }
  }));
  addAuditLog('superadmin', 'superadmin', 'Global', `Melakukan Refresh Ping ke ${totalCount} Edge Gateway (${onlineCount}/${totalCount} merespons).`);
  saveState();
  renderDashboard();
  showToast(`Ping selesai: ${onlineCount}/${totalCount} Edge Gateway Online.`, 'success');
}

function toggleGatewayStatus(clientId, buildingId) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const bld = client.buildings.find((b) => b.id === buildingId);
  if (!bld) return;
  if (bld.gatewayStatus === 'Online') {
    bld.gatewayStatus = 'Offline';
    bld.latencyMs = 0;
    addAuditLog('superadmin', 'superadmin', client.city, `Simulasi gateway ${bld.gatewayId} (${client.name} - ${bld.name}) menjadi Offline.`);
    showToast(`${bld.gatewayId} disimulasikan Offline.`, 'warning');
  } else {
    bld.gatewayStatus = 'Online';
    bld.latencyMs = 28 + Math.floor(Math.random() * 25);
    addAuditLog('superadmin', 'superadmin', client.city, `Gateway ${bld.gatewayId} (${client.name} - ${bld.name}) kembali Online (${bld.latencyMs} ms).`);
    showToast(`${bld.gatewayId} kembali Online.`, 'success');
  }
  saveState();
  renderDashboard();
}

function submitAddErrorRule(e, editRuleId = null) {
  e.preventDefault();
  const brand = document.getElementById('rule-brand').value;
  const code = document.getElementById('rule-code').value.trim().toUpperCase();
  const severity = document.getElementById('rule-severity').value;
  const factoryMeaning = document.getElementById('rule-factory').value.trim();
  const category = document.getElementById('rule-category').value.trim();
  const humanTranslation = document.getElementById('rule-human').value.trim();
  const recommendedPart = document.getElementById('rule-part').value.trim();
  const estDuration = document.getElementById('rule-duration').value.trim();
  const checklistRaw = document.getElementById('rule-checklist').value.trim();
  const checklist = checklistRaw ? checklistRaw.split(',').map((s) => s.trim()).filter(Boolean) : [recommendedPart, 'Multimeter Digital', 'Tool Kit Standar'];

  if (state.errorDictionary.some((d) => d.id !== editRuleId && d.brand === brand && d.code === code)) {
    showToast(`Kode ${code} untuk ${brand} sudah ada di kamus.`, 'warning');
    return;
  }

  if (editRuleId) {
    const existing = state.errorDictionary.find((d) => d.id === editRuleId);
    if (!existing) return;
    existing.brand = brand;
    existing.code = code;
    existing.severity = severity;
    existing.factoryMeaning = factoryMeaning;
    existing.category = category;
    existing.humanTranslation = humanTranslation;
    existing.recommendedPart = recommendedPart;
    existing.estDuration = estDuration;
    existing.checklist = checklist;
    addAuditLog('superadmin', 'superadmin', 'Global', `Memperbarui aturan kamus error ${brand} [${code}] (${factoryMeaning}).`);
    showToast(`Aturan kode error ${brand} [${code}] berhasil diperbarui.`, 'success');
  } else {
    state.errorDictionary.unshift({
      id: 'err_' + Date.now(),
      brand, code, factoryMeaning, category, humanTranslation, recommendedPart, estDuration, severity, checklist
    });
    addAuditLog('superadmin', 'superadmin', 'Global', `Menambahkan aturan kamus error ${brand} [${code}] (${factoryMeaning}).`);
    showToast(`Aturan kode error ${brand} [${code}] berhasil ditambahkan.`, 'success');
  }
  saveState();
  closeModal();
  renderDashboard();
}

function deleteErrorRule(ruleId) {
  const idx = state.errorDictionary.findIndex((d) => d.id === ruleId);
  if (idx === -1) return;
  const removed = state.errorDictionary[idx];
  state.errorDictionary.splice(idx, 1);
  addAuditLog('superadmin', 'superadmin', 'Global', `Menghapus aturan kamus error ${removed.brand} [${removed.code}].`);
  saveState();
  renderDashboard();
  showToast(`Aturan ${removed.brand} [${removed.code}] dihapus.`, 'info');
}

function getScopedBuildingsForCurrentRole() {
  const acc = getCurrentAccount();
  if (!acc) return [];
  if (acc.role === 'admin' || acc.role === 'superadmin') {
    return getFilteredClientsForAdmin().flatMap((c) => c.buildings);
  }
  const client = getClientRecordForAccount(acc);
  return client ? client.buildings : [];

function computeActualLoadArray(z) {
  const baseLoad = [58, 56, 72, 94, 100, 96, 88, 84, 78, 65];
  const sim = state.roiSim || { setpointBoostC: 2.0, cutHoursPerDay: 3.0, wbpMode: true };
  return baseLoad.map((v, idx) => {
    let mult = 1.0;
    if (z.officeOpd.autoCutoff && (idx <= 1 || idx >= 6)) {
      const cutBoost = Math.max(0, (sim.cutHoursPerDay - 3.0) * 0.015);
      mult -= ((z.officeOpd.weekendAutoOff ? 0.16 : 0.13) + cutBoost);
    }
    if (z.publicWbp.setpointGuard && idx >= 2) {
      const spBoost = Math.max(0, (sim.setpointBoostC - 2.0) * 0.02);
      mult -= (0.11 + spBoost);
    }
    if (z.publicWbp.wbpLimiter && sim.wbpMode && idx >= 7 && idx <= 8) mult -= 0.16;
    return Math.max(32, Math.round(v * mult));
  });
}

function updateRoiSimParam(key, val, isLiveInput = false) {
  if (!state.roiSim) state.roiSim = { setpointBoostC: 2.0, cutHoursPerDay: 3.0, wbpMode: true, capexPerBuildingJuta: 42 };
  if (key === 'wbpMode') {
    state.roiSim.wbpMode = !state.roiSim.wbpMode;
    saveState();
    renderDashboard();
    return;
  }
  state.roiSim[key] = Number(val);
  saveState();

  if (isLiveInput) {
    const sim = state.roiSim;
    const setElText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
    setElText('sim-lbl-setpoint', `+${Number(sim.setpointBoostC).toFixed(1)}°C`);
    setElText('sim-lbl-cutHours', `${Number(sim.cutHoursPerDay).toFixed(1)} jam/hari`);
    setElText('sim-lbl-capex', `Rp ${Number(sim.capexPerBuildingJuta || 42)} Jt/gdg`);

    const buildings = getScopedBuildingsForCurrentRole();
    const roi = computeScopeROI(buildings);

    setElText('roi-kpi-overhead-pct', `${roi.overheadReductionPct}%`);
    setElText('roi-kpi-total-year', formatRpShort(roi.totalSavedRpYear));
    setElText('roi-kpi-total-sub', `${formatRp(roi.totalSavedRpMonth)} / bulan • ${roi.savedKwhMonth.toLocaleString('id-ID')} kWh/bln`);
    setElText('roi-kpi-energy-year', `${formatRpShort(roi.energySavedRpMonth * 12)}/thn`);
    setElText('roi-kpi-overhaul-year', `${formatRpShort(roi.avoidedCompressorOverhaulRpMonth * 12)}/thn`);
    setElText('roi-kpi-pm-year', `${formatRpShort(roi.pmContractEfficiencyRpMonth * 12)}/thn`);
    setElText('roi-kpi-payback', `${roi.paybackMonths} bulan`);
    setElText('roi-kpi-postbms', formatRp(roi.postBmsOverheadMonth));

    if (chartInstances.roiBeforeAfterChart) {
      chartInstances.roiBeforeAfterChart.data.datasets[1].data = buildings.map((b) => Number((computeBuildingSavings(b).postBmsOverheadMonth / 1000000).toFixed(1)));
      chartInstances.roiBeforeAfterChart.update('none');
    }
    if (chartInstances.roiBreakdownChart) {
      chartInstances.roiBreakdownChart.data.datasets[0].data = [roi.energySavedRpMonth, roi.avoidedCompressorOverhaulRpMonth, roi.pmContractEfficiencyRpMonth];
      chartInstances.roiBreakdownChart.update('none');
    }

    const activeBld = buildings.find((b) => b.id === schedulingSelectedBuildingId) || buildings[0];
    if (activeBld) {
      const bSav = computeBuildingSavings(activeBld);
      setElText('sched-kpi-kwh', `${bSav.savedKwhMonth.toLocaleString('id-ID')} kWh/bln`);
      setElText('sched-kpi-kwh-sub', `Turun ${bSav.kwhReductionPct}% dari baseline ${bSav.baselineKwhMonth.toLocaleString('id-ID')} kWh`);
      setElText('sched-kpi-rp', formatRpShort(bSav.totalSavedRpMonth));
      setElText('sched-kpi-rp-year', `${formatRp(bSav.totalSavedRpYear)} / tahun`);
      setElText('sched-kpi-pct', `${bSav.overheadReductionPct}%`);
      setElText('sched-kpi-scope-year', `${formatRpShort(roi.totalSavedRpYear)}/thn`);
      setElText('sched-chart-badge', `Hemat ${bSav.savedKwhMonth.toLocaleString('id-ID')} kWh/bln`);
      if (chartInstances.smartScheduleBaselineChart) {
        chartInstances.smartScheduleBaselineChart.data.datasets[1].data = computeActualLoadArray(activeBld.zones);
        chartInstances.smartScheduleBaselineChart.update('none');
      }
    }
    return;
  }
  renderDashboard();
}

function applyAllSmartZones(isAdminScope, enableAll) {
  const buildings = isAdminScope
    ? getFilteredClientsForAdmin().flatMap((c) => c.buildings)
    : (getClientRecordForAccount(getCurrentAccount())?.buildings || []);
  buildings.forEach((b) => {
    if (!b.zones) return;
    b.zones.officeOpd.autoCutoff = enableAll;
    b.zones.officeOpd.weekendAutoOff = enableAll;
    b.zones.publicWbp.setpointGuard = enableAll;
    b.zones.publicWbp.wbpLimiter = enableAll;
  });
  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', acc ? acc.city : 'Global', `${enableAll ? 'Mengaktifkan' : 'Menonaktifkan'} seluruh mode hemat Smart IoT Scheduling pada ${buildings.length} gedung.`);
  saveState();
  renderDashboard();
  showToast(enableAll ? 'Seluruh fitur Smart IoT Scheduling AC diaktifkan!' : 'Mode Smart IoT dinonaktifkan untuk perbandingan baseline.', enableAll ? 'success' : 'warning');
}

function openTicketDetailModal(ticketId) {

  const rule = lookupErrorRule(t.brand, t.errorCode);
  const tech = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
  const relInv = (state.invoices || []).find((inv) => inv.ticketId === t.id);
  const sla = getTicketSlaInfo(t);
  openModal(`
    <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-300">Detail SPK / Work Order &amp; Audit SLA</div>

        <div class="rounded-xl bg-slate-50 border border-slate-200 p-2.5"><span class="text-[10px] text-slate-400 block">Tipe Tiket</span><strong>${escapeHtml(t.ticketType || 'Corrective')}</strong></div>
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-2.5"><span class="text-[10px] text-slate-400 block">Status</span><strong>${escapeHtml(t.status)}</strong></div>
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-2.5"><span class="text-[10px] text-slate-400 block">SLA / Durasi</span><strong class="${sla.breached ? 'text-rose-600' : 'text-emerald-700'}">${escapeHtml(sla.label)}</strong></div>
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-2.5"><span class="text-[10px] text-slate-400 block">Teknisi</span><strong>${tech ? escapeHtml(tech.name) : '-'}</strong></div>

      <div class="rounded-xl bg-slate-50 border border-slate-200 p-3.5 space-y-1">
        <div class="font-bold text-slate-900">${escapeHtml(t.buildingName)} (${escapeHtml(t.floor)}) &bull; ${escapeHtml(t.roomName)} (${escapeHtml(t.unitId)})</div>
        <div class="text-slate-600">Merek: <strong>${escapeHtml(t.brand)}</strong> &bull; Kode: <strong class="font-mono">${escapeHtml(t.errorCode)}</strong> (${escapeHtml(rule.factoryMeaning)})</div>
        <div class="text-slate-600">Dibuat: ${formatDateTime(t.createdAt)} ${t.completedAt ? ' &bull; Selesai: ' + formatDateTime(t.completedAt) : ''}</div>
      </div>
      ${t.repairNotes ? `<div class="rounded-xl bg-emerald-50 border border-emerald-200 p-3.5 space-y-1"><div class="font-bold text-emerald-900">Catatan Penyelesaian Lapangan</div><p class="text-slate-700">${escapeHtml(t.repairNotes)}</p><div class="text-teal-800 font-semibold">Sparepart/Material: ${escapeHtml(t.partsUsed || '-')}</div></div>` : ''}
      <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">
        ${relInv ? `<button type="button" onclick="openInvoiceBastModal('${relInv.id}')" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">Lihat RAB / Invoice &amp; BAST</button>` : ''}

function renderAdminErrors(container) {

  const cityTickets = state.tickets.filter((t) => adminCityFilter === 'all' || t.city === adminCityFilter);
  const slaMetrics = computeSlaAndMttrMetrics(cityTickets);

  const filtered = cityTickets.filter((t) => {
    const rule = lookupErrorRule(t.brand, t.errorCode);
    const tType = t.ticketType || 'Corrective';
    const isDone = t.status === 'Selesai';
    const stMatch = stFilter === 'all' || (stFilter === 'active' ? !isDone : isDone);
    const tyMatch = typeFilter === 'all' || tType === typeFilter;
    const svMatch = sevFilter === 'all' || (rule.severity || 'Tinggi') === sevFilter;
    const qMatch = !q || `${t.id} ${t.clientName} ${t.buildingName} ${t.roomName} ${t.unitId} ${t.errorCode} ${t.brand}`.toLowerCase().includes(q);
    return stMatch && tyMatch && svMatch && qMatch;

  const activeTickets = filtered.filter((t) => t.status !== 'Selesai');
  const completedTickets = filtered.filter((t) => t.status === 'Selesai');

                  ${getCityBadge(t.city)}

  container.innerHTML = `

function assignTechnician(ticketId, forcedTechUsername = null) {
  const t = state.tickets.find((x) => x.id === ticketId);
  if (!t) return;
  const selectEl = document.getElementById('dispatch-select-' + ticketId);
  const techUsername = forcedTechUsername || (selectEl ? selectEl.value : null);
  if (!techUsername) return;
  const tech = state.accounts.find((a) => a.username === techUsername && a.role === 'technician');
  if (!tech) return;

  if (tech.city !== t.city) {
    showToast(`Penugasan ditolak: Teknisi ${tech.name} berada di ${tech.city}, sedangkan klien berada di ${t.city}.`, 'error');
    return;
  }

  t.assignedTo = tech.username;
  t.status = 'Teknisi Ditugaskan';
  t.techAccepted = false;
  t.updatedAt = new Date().toISOString();
  tech.techStatus = 'On-Duty';

  const rule = lookupErrorRule(t.brand, t.errorCode);
  pushNotification(tech.username, `Tugas Baru [${t.id}]: ${t.clientName}`, `${t.buildingName} ${t.floor} - ${t.roomName} (${t.brand} ${t.errorCode}). Segera konfirmasi Terima Tugas.`, 'warning', 'workorders', { type: 'ticket', id: t.id });
  pushNotification(t.clientUsername, `Teknisi Ditugaskan untuk ${t.roomName}`, `Teknisi ${tech.name} (${tech.phone}) telah ditugaskan menangani (${rule.estDuration}).`, 'info', 'tickets', { type: 'ticket', id: t.id });
  addAuditLog('admin_eka', 'admin', t.city, `Menugaskan ${tech.name} (${tech.username}) untuk ${t.id} di ${t.clientName}.`);

  saveState();
  renderDashboard();
  showToast(`${tech.name} berhasil ditugaskan untuk ${t.id}!`, 'success');
}

function createPmWorkOrder(clientId, buildingId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!client || !bld) return;

  const existingOpen = state.tickets.find((t) => t.buildingId === bld.id && t.ticketType === 'Preventive' && t.status !== 'Selesai');
  if (existingOpen) {
    showToast(`SPK Preventive Maintenance ${existingOpen.id} untuk ${bld.name} sudah aktif di antrean.`, 'warning');
    switchTab('errors');
    return;
  }

  const pmNum = nextSeqId(state.tickets, 'PM-2026', 3, ['id']);
  const nowIso = new Date().toISOString();
  const sampleRoom = (bld.rooms && bld.rooms[0]) || { id: 'pm_rooftop', unitId: bld.gatewayId, floor: 'Rooftop & IDU', name: 'Seluruh Unit & ODU Master' };
  const sameCityAvail = state.accounts.find((a) => a.role === 'technician' && a.city === client.city && a.techStatus === 'Available')
    || state.accounts.find((a) => a.role === 'technician' && a.city === client.city);

  state.tickets.unshift({
    id: pmNum, ticketType: 'Preventive', slaTargetMinutes: 1440,
    clientId: client.id, clientName: client.name, clientUsername: client.ownerUsername,
    city: client.city, buildingId: bld.id, buildingName: bld.name, roomId: sampleRoom.id,
    roomName: `Preventive AMC (${bld.iduCount} IDU & ODU)`, floor: 'Seluruh Lantai', unitId: bld.gatewayId, brand: bld.brand,
    errorCode: 'PM', status: sameCityAvail ? 'Teknisi Ditugaskan' : 'Menunggu Penugasan',
    assignedTo: sameCityAvail ? sameCityAvail.username : null, techAccepted: false, checklistDone: {},
    createdAt: nowIso, updatedAt: nowIso, completedAt: null, repairNotes: '', partsUsed: ''
  });

  if (sameCityAvail) {
    sameCityAvail.techStatus = 'On-Duty';
    pushNotification(sameCityAvail.username, `SPK Preventive Maintenance [${pmNum}]`, `Jadwal PM ${bld.pmFrequency || 'Bulanan'} untuk ${client.name} (${bld.name} - ${bld.iduCount} IDU).`, 'info', 'workorders', { type: 'ticket', id: pmNum });
  }
  pushNotification(client.ownerUsername, `SPK Preventive Maintenance ${bld.name} Terbit (${pmNum})`, `Kunjungan pemeliharaan berkala AMC (${client.amcContractNo}) telah dijadwalkan oleh distributor.`, 'info', 'tickets', { type: 'ticket', id: pmNum });
  addAuditLog('admin_eka', 'admin', client.city, `Menerbitkan SPK Preventive Maintenance ${pmNum} untuk ${client.name} - ${bld.name}.`);

  saveState();
  renderDashboard();
  showToast(`SPK Preventive Maintenance ${pmNum} untuk ${bld.name} berhasil diterbitkan!`, 'success');
}

function submitTechCrud(e, editUsername = null) {
  e.preventDefault();
  const name = document.getElementById('tech-crud-name').value.trim();
  const username = document.getElementById('tech-crud-user').value.trim().toLowerCase();
  const city = document.getElementById('tech-crud-city').value;
  const phone = document.getElementById('tech-crud-phone').value.trim();
  const techStatus = document.getElementById('tech-crud-status').value;
  const brands = Array.from(document.querySelectorAll('.tech-brand-chk:checked')).map((el) => el.value);
  const finalBrands = brands.length > 0 ? brands : ['Gree GMV'];

  if (editUsername) {
    const tech = state.accounts.find((a) => a.username === editUsername);
    if (!tech) return;
    tech.name = name;
    tech.city = city;
    tech.phone = phone;
    tech.techStatus = techStatus;
    tech.brands = finalBrands;
    tech.scope = `Area ${city} Raya`;
    addAuditLog('admin_eka', 'admin', city, `Memperbarui profil teknisi ${name} (@${username}).`);
    showToast(`Profil teknisi ${name} diperbarui.`, 'success');
  } else {
    if (state.accounts.some((a) => a.username === username)) {
      showToast(`Username @${username} sudah digunakan.`, 'warning');
      return;
    }
    state.accounts.push({
      username, password: 'tek123', name, title: `Teknisi HVAC Area ${city}`,
      role: 'technician', city, scope: `Area ${city} Raya`, brands: finalBrands, techStatus, phone
    });
    addAuditLog('admin_eka', 'admin', city, `Menambahkan teknisi baru ${name} (@${username}) di area ${city}.`);
    showToast(`Teknisi baru ${name} (@${username}) berhasil ditambahkan!`, 'success');
  }
  saveState();
  closeModal();
  renderDashboard();
}

}

function renderClientOverview(container, acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const errRooms = getClientErrorRooms(client);
  const totalIdu = client.buildings.reduce((s, b) => s + b.iduCount, 0);
  const totalRooms = client.buildings.reduce((s, b) => s + b.rooms.length, 0);
  const normalRooms = client.buildings.reduce((s, b) => s + b.rooms.filter((r) => r.status === 'Normal').length, 0);

  const clientRoi = computeScopeROI(client.buildings);

  container.innerHTML = `

function setClientBuildingFilter(bldId) { clientSelectedBuildingId = bldId; floorplanSelectedBuildingId = bldId; floorplanSelectedFloor = ''; uiFilters.clientUnitsFloor = 'all'; renderDashboard(); }
function setClientRoomStatusFilter(st) { clientRoomStatusFilter = st; renderDashboard(); }
function setClientUnitsViewMode(mode) { clientUnitsViewMode = mode; renderDashboard(); }
function goToClientFloorplan() { clientUnitsViewMode = 'blueprint'; switchTab('units'); }

function renderClientUnits(container, acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  if (!clientSelectedBuildingId || !client.buildings.some((b) => b.id === clientSelectedBuildingId)) {
    clientSelectedBuildingId = client.buildings[0].id;
  }
  const activeBld = client.buildings.find((b) => b.id === clientSelectedBuildingId);
  const floors = Array.from(new Set(activeBld.rooms.map((r) => r.floor || 'Lt. 1')));
  if (uiFilters.clientUnitsFloor !== 'all' && !floors.includes(uiFilters.clientUnitsFloor)) {
    uiFilters.clientUnitsFloor = 'all';
  }
  const q = (uiFilters.clientUnitsQuery || '').toLowerCase();
  const rooms = activeBld.rooms.filter((r) => {
    const stOk = clientRoomStatusFilter === 'all' || getRoomVisualStatus(r) === clientRoomStatusFilter;
    const flOk = uiFilters.clientUnitsFloor === 'all' || (r.floor || 'Lt. 1') === uiFilters.clientUnitsFloor;
    const qOk = !q || r.name.toLowerCase().includes(q) || r.unitId.toLowerCase().includes(q) || (r.floor || '').toLowerCase().includes(q);
    return stOk && flOk && qOk;
  });
  const overCountBld = activeBld.rooms.filter((r) => getRoomVisualStatus(r) === 'Over-Usage' && (uiFilters.clientUnitsFloor === 'all' || r.floor === uiFilters.clientUnitsFloor)).length;

  const bldTabs = client.buildings.map((b) => `
    <button type="button" onclick="setClientBuildingFilter('${b.id}')"
      class="px-3.5 py-2 rounded-xl text-xs font-semibold border transition ${b.id === activeBld.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}">
      ${escapeHtml(b.name)} (${escapeHtml(b.brand)})
    </button>
  `).join('');

  const statusTabs = [
    { id: 'all', label: 'Semua' },
    { id: 'Error', label: '🔴 Error' },
    { id: 'Over-Usage', label: '🟠 Over-Usage' },
    { id: 'Normal', label: '🟢 Normal' },
    { id: 'Standby', label: '⚪ Standby' }
  ].map((st) => `
    <button type="button" onclick="setClientRoomStatusFilter('${st.id}')"
      class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${clientRoomStatusFilter === st.id ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
      ${st.label}
    </button>
  `).join('');

  const roomCards = rooms.length === 0
    ? '<div class="col-span-full bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-500">Tidak ada ruangan yang cocok dengan filter / kata kunci saat ini.</div>'
    : rooms.map((r) => {
        const vis = getRoomVisualStatus(r);
        const badgeCls = vis === 'Error'
          ? 'bg-rose-100 text-rose-700 border-rose-200'
          : vis === 'Over-Usage'
            ? 'bg-amber-100 text-amber-800 border-amber-300'
            : vis === 'Standby'
              ? 'bg-slate-100 text-slate-600 border-slate-200'
              : 'bg-emerald-100 text-emerald-700 border-emerald-200';
        const cardBorder = vis === 'Error'
          ? 'border-rose-300 bg-rose-50/30'
          : vis === 'Over-Usage'
            ? 'border-amber-300 bg-amber-50/30'
            : 'border-slate-200 bg-white';
        const overPct = vis === 'Over-Usage' ? getRoomOverusagePct(r) : 0;
        return `
          <div onclick="openRoomDetailModal('${client.id}', '${activeBld.id}', '${r.id}')"

            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <span class="font-mono text-[10px] font-semibold text-slate-500">${escapeHtml(r.unitId)} &bull; ${escapeHtml(r.floor)}</span>

              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${badgeCls} shrink-0">${vis === 'Over-Usage' ? `Boros +${overPct}%` : escapeHtml(vis)}</span>
            </div>

              <div><span class="text-[10px] text-slate-400 block">Mode / Daya</span><span class="text-xs font-semibold text-slate-700">${escapeHtml(r.mode)} &bull; ${r.powerKw} kW</span></div>
            </div>
            ${vis === 'Over-Usage' ? `
              <div class="flex items-center justify-between gap-2 pt-1">

              </div>
            `}

        `;
      }).join('');

  const myInstallReqs = (state.installRequests || []).filter((r) => r.clientId === client.id && r.status === 'Menunggu Pemasangan');
  const reqNotice = myInstallReqs.length === 0 ? '' : `
    <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-2 text-xs text-sky-900">
      <div><strong>${myInstallReqs.length} Permohonan Pemasangan AC Baru</strong> sedang diproses Admin Distributor (${myInstallReqs.map((r) => escapeHtml(r.roomName)).join(', ')}).</div>
      <span class="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 font-semibold text-[11px]">Menunggu Instalasi</span>
    </div>
  `;

  const blueprintPanelHtml = clientUnitsViewMode === 'blueprint'
    ? renderFloorPlanPanel(client, activeBld, acc, { isClientMode: true })
    : '';
  const floorScopeArg = uiFilters.clientUnitsFloor === 'all' ? '' : uiFilters.clientUnitsFloor;

  container.innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div class="flex flex-wrap gap-2">${bldTabs}</div>

function computeRoomRemotePowerKw(room, newMode, newTargetTemp) {
  if (!room._basePowerKw) room._basePowerKw = room.powerKw > 0.8 ? room.powerKw : 4.8;
  if (newMode === 'Off') return 0.3;
  const base = room._basePowerKw;
  const tempFactor = Math.max(0.62, Math.min(1.22, 1 + (22.0 - newTargetTemp) * 0.055));
  const modeMult = newMode === 'Eco' || newMode === 'Dry' ? 0.68 : 1.0;
  return Number((base * tempFactor * modeMult).toFixed(1));
}

function remoteControlRoomPower(clientId, buildingId, roomId, powerMode) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  room.mode = powerMode;
  if (room.status !== 'Error') {
    room.status = powerMode === 'Off' ? 'Standby' : 'Normal';
  }
  room.powerKw = computeRoomRemotePowerKw(room, powerMode, room.targetTemp);
  syncBuildingKwhFromRooms(bld);

  const acc = getCurrentAccount();
  const modeLabel = powerMode === 'Cool' ? 'ON (Cool)' : powerMode === 'Eco' ? 'Eco Mode' : 'Standby (OFF)';
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', client.city, `Two-Way IoT Command ke ${bld.gatewayId}: ${room.unitId} (${room.name}) diubah ke ${modeLabel}, daya ${room.powerKw} kW.`);
  saveState();
  renderDashboard();
  openRoomDetailModal(clientId, buildingId, roomId);
  showToast(`Perintah Two-Way ke ${room.unitId}: ${modeLabel} (${room.powerKw} kW) terkirim!`, 'success');
}

function remoteControlRoomTemp(clientId, buildingId, roomId, newTempVal) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  const clamped = Math.max(18, Math.min(26, Math.round(Number(newTempVal) * 2) / 2));
  room.targetTemp = clamped;
  if (room.mode === 'Off') {
    room.mode = 'Cool';
    if (room.status !== 'Error') room.status = 'Normal';
  }
  room.powerKw = computeRoomRemotePowerKw(room, room.mode, clamped);
  syncBuildingKwhFromRooms(bld);

  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', client.city, `Two-Way IoT Setpoint ke ${bld.gatewayId}: ${room.unitId} (${room.name}) diset ke ${clamped.toFixed(1)}°C (${room.powerKw} kW).`);
  saveState();
  renderDashboard();
  openRoomDetailModal(clientId, buildingId, roomId);
  showToast(`Target suhu ${room.unitId} diperbarui ke ${clamped.toFixed(1)}°C (Daya: ${room.powerKw} kW).`, 'info');
}

function exportClientEnergyCsv() {
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const rows = [['Gedung', 'Merek', 'Gateway', 'kWh Hari Ini', 'kWh Bulanan', 'Baseline Bulanan kWh', 'Estimasi Biaya Bulan Ini (Rp)']];
  client.buildings.forEach((b) => {
    const today = b.kwh7Days[b.kwh7Days.length - 1] || 0;
    rows.push([b.fullName, b.brand, b.gatewayId, today, b.kwhMonthly, b.baselineMonthlyKwh || b.kwhMonthly, Math.round(b.kwhMonthly * ELECTRIC_TARIFF_RP)]);
  });
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  downloadTextFile(`laporan-energi-${client.id}-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8');
  showToast('Laporan Konsumsi Energi CSV berhasil diunduh.', 'success');
}

function submitClientManualComplaint(e) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const bId = document.getElementById('cmp-building').value;
  const rId = document.getElementById('cmp-room').value;
  const symptom = document.getElementById('cmp-symptom').value;
  const notes = document.getElementById('cmp-notes').value.trim();
  const bld = client.buildings.find((b) => b.id === bId) || client.buildings[0];
  const room = bld.rooms.find((r) => r.id === rId) || bld.rooms[0];
  if (!room) return;

  const brandRule = state.errorDictionary.find((d) => d.brand === bld.brand) || state.errorDictionary[0];
  const code = symptom.includes('Bocor') ? 'A3' : (brandRule ? brandRule.code : 'E4');
  room.status = 'Error';
  room.errorCode = code;
  room.temp = Math.max(room.temp, Number((room.targetTemp + 4.5).toFixed(1)));
  room.tempHistory6h = [...(room.tempHistory6h || [22, 23, 24, 25, 26]).slice(1), room.temp];

  const woId = nextSeqId(state.tickets, 'WO-2026', 3, ['id']);
  const nowIso = new Date().toISOString();
  state.tickets.unshift({
    id: woId,
    ticketType: 'Corrective',
    slaTargetMinutes: room.zoneType === 'critical24' ? 30 : 120,
    clientId: client.id, clientName: client.name, clientUsername: acc.username, city: client.city,
    buildingId: bld.id, buildingName: bld.name, roomId: room.id, roomName: room.name, floor: room.floor,
    unitId: room.unitId, brand: bld.brand, errorCode: code,
    status: 'Menunggu Penugasan', assignedTo: null, techAccepted: false, checklistDone: {},
    createdAt: nowIso, updatedAt: nowIso, completedAt: null,
    repairNotes: `Keluhan Klien: ${symptom} — ${notes}`, partsUsed: ''
  });

  pushNotification('admin_eka', `Laporan Keluhan Manual ${woId} (${client.name})`, `${bld.name} (${room.roomName || room.name}): ${symptom}. ${notes}`, 'error', 'errors', { type: 'ticket', id: woId });
  addAuditLog(acc.username, 'client', client.city, `Melaporkan keluhan manual ${woId} di ${bld.name} (${room.name}): ${symptom}.`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Tiket keluhan ${woId} berhasil dikirim ke Admin Distributor!`, 'success');
}

function updateClientChatbotContext(acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const errRooms = getClientErrorRooms(client);
  const badge = document.getElementById('chatbot-error-badge');
  if (errRooms.length > 0) {
    badge.textContent = errRooms.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  document.getElementById('chatbot-context-sub').textContent = `${client.name} (${errRooms.length} gangguan aktif)`;

  if (chatbotInitializedForUser !== acc.username) {
    chatbotInitializedForUser = acc.username;
    if (errRooms.length > 0) {
      const first = errRooms[0];
      const rule = lookupErrorRule(first.building.brand, first.room.errorCode);
      chatbotMessages = [{
        sender: 'ai',
        text: `Halo tim ${client.name}! Saya mendeteksi ada gangguan pendinginan di **${first.room.name}** (${first.building.name} ${first.room.floor}, suhu saat ini ${first.room.temp}°C).\n\nPenyebab: ${rule.humanTranslation}\n\nAnda dapat memilih tombol cepat di bawah atau bertanya langsung kepada saya.`
      }];
    } else {
      chatbotMessages = [{
        sender: 'ai',
        text: `Halo tim ${client.name}! Seluruh ${client.buildings.length} gedung Anda (${client.buildings.map((b) => b.name).join(', ')}) terpantau sejuk dan normal. Ada yang bisa saya bantu hari ini?`
      }];
    }
    renderChatbotMessages();
  }
}

function toggleChatbot(forceState) {
  const panel = document.getElementById('chatbot-panel');
  const open = typeof forceState === 'boolean' ? forceState : panel.classList.contains('hidden');
  if (open) {
    panel.classList.remove('hidden');
    renderChatbotMessages();
  } else {
    panel.classList.add('hidden');
  }
}

function renderChatbotMessages() {
  const box = document.getElementById('chatbot-messages');
  if (!box) return;
  box.innerHTML = chatbotMessages.map((m) => `
    <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
      <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed whitespace-pre-line ${
        m.sender === 'user'
          ? 'bg-teal-600 text-white rounded-br-sm'
          : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm shadow-2xs'
      }">${escapeHtml(m.text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function handleChatbotQuickReply(type) {
  const acc = getCurrentAccount();
  if (!acc || acc.role !== 'client') return;
  const client = getClientRecordForAccount(acc);
  const errRooms = getClientErrorRooms(client);
  const activeTickets = state.tickets.filter((t) => t.clientId === client.id && t.status !== 'Selesai');

  if (type === 'emergency') {
    chatbotMessages.push({ sender: 'user', text: 'Panduan Tindakan Darurat' });
    if (errRooms.length > 0) {
      const e = errRooms[0];
      chatbotMessages.push({
        sender: 'ai',
        text: `Tindakan darurat aman untuk **${e.room.name} (${e.building.name})**:\n1. Jangan matikan MCB utama panel AC agar log sensor tetap terbaca.\n2. Atur unit ke mode **Fan Only** sementara untuk sirkulasi udara atau pindahkan aktivitas penting ke ruangan terdekat yang bersuhu normal.\n3. Pastikan pintu dan jendela ruangan tetap tertutup rapat agar suhu tidak naik drastis.`
      });
    } else {
      chatbotMessages.push({ sender: 'ai', text: 'Saat ini tidak ada kondisi darurat. Jika ruangan terasa kurang dingin, periksa apakah pintu ruangan tertutup rapat dan suhu target berada di kisaran 20–22°C.' });
    }
  } else if (type === 'status') {
    chatbotMessages.push({ sender: 'user', text: 'Cek Status Teknisi' });
    if (activeTickets.length > 0) {
      const t = activeTickets[0];
      const tech = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
      chatbotMessages.push({
        sender: 'ai',
        text: tech
          ? `Tiket **${t.id}** (${t.buildingName} — ${t.roomName}) saat ini berstatus **${t.status}**. Teknisi yang bertugas adalah **${tech.name}** (${tech.phone}).`
          : `Tiket **${t.id}** (${t.buildingName} — ${t.roomName}) sudah masuk ke antrean prioritas distributor (${t.city}) dengan status **Menunggu Penugasan**.`
      });
    } else {
      chatbotMessages.push({ sender: 'ai', text: 'Belum ada tiket teknisi yang sedang berjalan karena seluruh unit AC Anda dalam kondisi normal.' });
    }
  } else if (type === 'urgent') {
    requestUrgentTechnician(acc, client, errRooms);
    return;
  }
  renderChatbotMessages();
}

function requestUrgentTechnician(acc, client, errRooms) {
  chatbotMessages.push({ sender: 'user', text: 'Minta Teknisi Datang Sekarang' });
  const targetDetail = errRooms.length > 0 ? `${errRooms[0].building.name} - ${errRooms[0].room.name}` : `${client.buildings[0].name}`;
  pushNotification(
    'admin_eka',
    `URGENT REQUEST dari ${client.name} (${client.city})`,
    `Klien meminta teknisi segera datang ke lokasi (${targetDetail}) melalui Asisten AI CoolSync.`,
    'error',
    'errors'
  );
  addAuditLog(acc.username, 'client', client.city, `Mengirim permintaan kedatangan teknisi prioritas (URGENT) untuk ${targetDetail}.`);
  saveState();
  chatbotMessages.push({
    sender: 'ai',
    text: `Permintaan darurat telah dikirim dengan prioritas tinggi kepada **Admin Eka (Distributor Jatim)** untuk area **${client.city}** (${targetDetail}). Notifikasi lonceng Admin Eka sudah langsung berbunyi.`
  });
  renderChatbotMessages();
  showToast('Permintaan teknisi darurat berhasil dikirim ke Admin Eka!', 'success');
}

function handleChatbotSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('chatbot-input');
  const txt = input.value.trim();
  if (!txt) return;
  input.value = '';
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  const errRooms = getClientErrorRooms(client);
  chatbotMessages.push({ sender: 'user', text: txt });

  const lower = txt.toLowerCase();
  let reply = '';
  if (lower.includes('listrik') || lower.includes('kwh') || lower.includes('biaya')) {
    const kwhToday = client.buildings.reduce((s, b) => s + b.kwh7Days[b.kwh7Days.length - 1], 0);
    reply = `Total pemakaian listrik AC di **${client.name}** hari ini tercatat **${kwhToday.toLocaleString('id-ID')} kWh** (estimasi **${formatRp(kwhToday * ELECTRIC_TARIFF_RP)}**). Detail grafik ada di menu Konsumsi Listrik.`;
  } else if (lower.includes('teknisi') || lower.includes('datang') || lower.includes('perbaiki')) {
    const active = state.tickets.filter((t) => t.clientId === client.id && t.status !== 'Selesai');
    if (active.length > 0) {
      const t = active[0];
      const tech = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
      reply = tech
        ? `Teknisi **${tech.name}** sedang menangani tiket **${t.id}** dengan status **${t.status}**.`
        : `Tiket **${t.id}** sedang menunggu penugasan Admin Eka. Anda bisa klik tombol **"Minta Teknisi Datang Sekarang"** di bawah untuk eskalasi cepat.`;
    } else {
      reply = 'Saat ini tidak ada tiket gangguan aktif. Jika butuh inspeksi rutin, klik "Minta Teknisi Datang Sekarang".';
    }
  } else if (errRooms.length > 0) {
    const eRoom = errRooms[0];
    const rule = lookupErrorRule(eRoom.building.brand, eRoom.room.errorCode);
    reply = `Di gedung Anda saat ini ada 1 keluhan pendinginan pada **${eRoom.room.name}** (${eRoom.building.name}): ${rule.humanTranslation} Estimasi penanganan sekitar ${rule.estDuration}.`;
  } else {
    reply = `Terima kasih, tim **${client.name}**. Seluruh ${client.buildings.length} gedung Anda dalam kondisi aman. Anda dapat menanyakan status suhu ruangan, pemakaian kWh, atau status teknisi.`;
  }
  chatbotMessages.push({ sender: 'ai', text: reply });
  renderChatbotMessages();
}

function toggleChecklistItem(ticketId, idx) {

  if (!t.checklistDone) t.checklistDone = {};
  t.checklistDone[idx] = !t.checklistDone[idx];
  saveState();
}

  const acc = getCurrentAccount();

  t.techAccepted = true;
  t.updatedAt = new Date().toISOString();

function submitCompleteWo(e, ticketId) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const t = state.tickets.find((x) => x.id === ticketId && x.assignedTo === acc.username);
  if (!t) return;
  const notes = document.getElementById('wo-repair-notes').value.trim();
  const parts = document.getElementById('wo-parts-used').value.trim();
  const nowIso = new Date().toISOString();

  t.status = 'Selesai';
  t.completedAt = nowIso;
  t.updatedAt = nowIso;
  t.repairNotes = notes;
  t.partsUsed = parts;

  const client = state.clients.find((c) => c.id === t.clientId);
  const bld = client && client.buildings.find((b) => b.id === t.buildingId);
  const room = bld && bld.rooms.find((r) => r.id === t.roomId);

  if (t.ticketType === 'Commissioning' && bld) {
    bld.gatewayStatus = 'Online';
    (bld.rooms || []).forEach((rm) => {
      rm.status = 'Normal';
      rm.errorCode = null;
      rm.mode = 'Cool';
      rm.temp = rm.targetTemp;
    });
  } else if (t.ticketType === 'Preventive' && bld) {
    bld.lastPmDate = nowIso.slice(0, 10);
    const freqDays = String(bld.pmFrequency || '').toLowerCase().includes('triwulan') ? 90 : 30;
    bld.nextPmDate = new Date(Date.now() + freqDays * 86400000).toISOString().slice(0, 10);
    bld.pmStatus = computePmStatus(bld.nextPmDate);
  } else if (room) {
    room.status = 'Normal';
    room.errorCode = null;
    room.mode = 'Cool';
    room.temp = room.targetTemp;
    room.tempHistory6h = [...room.tempHistory6h.slice(1), room.targetTemp];
  }

  // Otomatis Available jika tidak ada WO aktif lain
  const otherActive = state.tickets.some((x) => x.assignedTo === acc.username && x.status !== 'Selesai');
  if (!otherActive) acc.techStatus = 'Available';

  // Jembatan 4: Otomatis catat biaya operasional & insentif SPK teknisi di Buku Kas Pengeluaran Keuangan
  if (!Array.isArray(state.expenses)) state.expenses = [];
  if (!state.expenses.some((ex) => ex.refId === t.id && ex.category === 'Operasional & Insentif SPK Teknisi')) {
    const spkCost = t.ticketType === 'Commissioning' ? 750000 : t.ticketType === 'Preventive' ? 175000 : 250000;
    state.expenses.unshift({
      id: nextSeqId(state.expenses, 'EXP-2026', 3, ['id']),
      date: nowIso.slice(0, 10),
      category: 'Operasional & Insentif SPK Teknisi',
      city: t.city,
      amount: spkCost,
      description: `Insentif & Uang Jalan SPK ${t.id} (${acc.name} - ${t.clientName})`,
      refId: t.id,
      recordedBy: 'system_bridge4'
    });
  }

  // Otomatis terbitkan Invoice & BAST Digital jika terdapat Quotation terkait WO ini
  const relInv = (state.invoices || []).find((inv) => inv.ticketId === t.id && inv.status !== 'Lunas' && inv.status !== 'Ditolak Klien' && !inv.invNumber);
  if (relInv) {
    const nextInv = nextSeqId(state.invoices, 'INV-2026', 3, ['invNumber']);
    const seqPart = nextInv.split('-').pop();
    relInv.invNumber = nextInv;
    relInv.bastNumber = `BAST-2026-${seqPart}`;
    if (!relInv.poNumber) relInv.poNumber = `PO-AUTO-2026-${seqPart}`;
    relInv.invoicedAt = nowIso;
    relInv.approvedAt = relInv.approvedAt || nowIso;
    relInv.status = 'Menunggu Pembayaran';
    deductCatalogStockForInvoice(relInv);
    pushNotification(t.clientUsername, `Invoice ${relInv.invNumber} & BAST Digital Terbit`, `Pekerjaan ${t.id} selesai. Invoice resmi ${relInv.invNumber} (${formatRp(relInv.grandTotal)}) & BAST Digital siap ditinjau.`, 'info', 'billing', { type: 'invoice', id: relInv.id });
    relInv.stockReleased = true;
    pushNotification('finance_maya', `Jembatan 3: BAST ${t.id} & Invoice ${relInv.invNumber} Terbit`, `WO selesai; Invoice ${relInv.invNumber} (${formatRp(relInv.grandTotal)}) siap verifikasi pembayaran.`, 'info', 'finance_billing', { type: 'invoice', id: relInv.id });
    pushNotification('admin_eka', `BAST & Invoice ${relInv.invNumber} Terbit`, `WO ${t.id} selesai; Invoice & BAST Digital diteruskan ke Admin Keuangan Maya.`, 'success', 'admin_bom', { type: 'invoice', id: relInv.id });
  }

  pushNotification('finance_maya', `Jembatan 4: Biaya Insentif SPK ${t.id} Tercatat`, `Biaya operasional SPK ${acc.name} (${t.city}) otomatis masuk Buku Kas Pengeluaran.`, 'info', 'finance_expenses');
  pushNotification('admin_eka', `WO ${t.id} Selesai oleh ${acc.name}`, `${t.clientName} (${t.buildingName} - ${t.roomName}) selesai ditangani. Catatan: ${parts}.`, 'success', 'errors', { type: 'ticket', id: t.id });
  pushNotification(t.clientUsername, `${t.ticketType === 'Preventive' ? 'Preventive Maintenance' : 'Perbaikan'} ${t.roomName} Selesai!`, `Teknisi ${acc.name} telah menyelesaikan ${t.ticketType === 'Preventive' ? 'inspeksi PM berkala' : 'perbaikan'}.`, 'success', 'tickets', { type: 'ticket', id: t.id });
  addAuditLog(acc.username, 'technician', acc.city, `Menyelesaikan ${t.id} (${t.clientName} - ${t.roomName}).`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Work Order ${t.id} selesai!${relInv ? ' Invoice & BAST otomatis terbit.' : ''}`, 'success');
}
