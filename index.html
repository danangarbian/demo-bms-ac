function recalcQuotationPreview() {
  const box = document.getElementById('qt-summary-box');
  if (!box) return;
  const catalog = getCatalog();
  let partsTotal = 0;
  let count = 0;
  document.querySelectorAll('.qt-part-check').forEach((chk) => {
    if (chk.checked) {
      const partId = chk.getAttribute('data-part-id');
      const part = catalog.find((p) => p.id === partId);
      const qtyEl = document.querySelector(`.qt-part-qty[data-part-id="${partId}"]`);
      const qty = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10) || 1);
      if (part) { partsTotal += part.price * qty; count++; }
    }
  });
  const customName = (document.getElementById('qt-custom-name')?.value || '').trim();
  const customPrice = Math.max(0, Number(document.getElementById('qt-custom-price')?.value) || 0);
  if (customName && customPrice > 0) { partsTotal += customPrice; count++; }

  const includeLabor = document.getElementById('qt-include-labor')?.checked;
  const labor = includeLabor ? SERVICE_LABOR_FEE : 0;
  const grossBeforeDisc = partsTotal + labor;
  const discType = document.getElementById('qt-discount-type')?.value || 'none';
  const discVal = Math.max(0, Number(document.getElementById('qt-discount-value')?.value) || 0);
  const discAmount = discType === 'pct'
    ? Math.min(grossBeforeDisc, Math.round(grossBeforeDisc * Math.min(100, discVal) / 100))
    : discType === 'rp'
      ? Math.min(grossBeforeDisc, Math.round(discVal))
      : 0;
  const subtotal = Math.max(0, grossBeforeDisc - discAmount);
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;

  box.innerHTML = `
    <div class="flex justify-between text-slate-300"><span>Sparepart &amp; Item Terpilih (${count} item)</span><span>${formatRp(partsTotal)}</span></div>
    <div class="flex justify-between text-slate-300"><span>Jasa Instalasi &amp; Kalibrasi</span><span>${formatRp(labor)}</span></div>
    ${discAmount > 0 ? `<div class="flex justify-between text-amber-300 font-semibold"><span>Diskon Komersial Distributor</span><span>- ${formatRp(discAmount)}</span></div>` : ''}
    <div class="flex justify-between text-slate-300"><span>PPN 11%</span><span>${formatRp(ppn)}</span></div>
    <div class="pt-2 border-t border-slate-700 flex justify-between text-sm font-extrabold text-teal-300"><span>Total Penawaran (RAB)</span><span>${formatRp(grandTotal)}</span></div>
  `;
}

function submitCreateQuotation(e, ticketId, editInvoiceId = null, isBomDraft = false) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const existingInv = editInvoiceId ? (state.invoices || []).find((x) => x.id === editInvoiceId) : null;
  const t = state.tickets.find((x) => x.id === (existingInv ? existingInv.ticketId : ticketId)) || (existingInv ? {
    id: existingInv.ticketId, clientId: existingInv.clientId, clientName: existingInv.clientName, clientUsername: existingInv.clientUsername,
    city: existingInv.city, buildingName: existingInv.buildingName, roomName: existingInv.roomName, unitId: existingInv.unitId, brand: existingInv.brand
  } : null);
  if (!t) return;

  const catalog = getCatalog();
  const items = [];
  document.querySelectorAll('.qt-part-check').forEach((chk) => {
    if (chk.checked) {
      const partId = chk.getAttribute('data-part-id');
      const part = catalog.find((p) => p.id === partId);
      const qtyEl = document.querySelector(`.qt-part-qty[data-part-id="${partId}"]`);
      const qty = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10) || 1);
      if (part) {
        const cogsU = Number(part.cogs) || Math.round(part.price * 0.68);
        items.push({ partId: part.id, name: part.name, qty, unitPrice: part.price, cogsUnit: cogsU, lineTotal: part.price * qty, lineCogs: cogsU * qty });
      }
    }
  });
  const customName = (document.getElementById('qt-custom-name')?.value || '').trim();
  const customPrice = Math.max(0, Number(document.getElementById('qt-custom-price')?.value) || 0);
  if (customName && customPrice > 0) {
    const customCogs = Math.round(customPrice * 0.6);
    items.push({ partId: 'CUSTOM-ITEM', name: customName, qty: 1, unitPrice: customPrice, cogsUnit: customCogs, lineTotal: customPrice, lineCogs: customCogs, isCustom: true });
  }
  if (items.length === 0) { showToast('Pilih minimal 1 sparepart atau masukkan item custom untuk Quotation RAB.', 'warning'); return; }

  const includeLabor = document.getElementById('qt-include-labor')?.checked;
  const laborFee = includeLabor ? SERVICE_LABOR_FEE : 0;
  const partsSum = items.reduce((s, it) => s + it.lineTotal, 0);
  const grossBeforeDisc = partsSum + laborFee;
  const discType = document.getElementById('qt-discount-type')?.value || 'none';
  const discVal = Math.max(0, Number(document.getElementById('qt-discount-value')?.value) || 0);
  const discountAmount = discType === 'pct'
    ? Math.min(grossBeforeDisc, Math.round(grossBeforeDisc * Math.min(100, discVal) / 100))
    : discType === 'rp'
      ? Math.min(grossBeforeDisc, Math.round(discVal))
      : 0;
  const effectiveDiscPct = grossBeforeDisc > 0 ? Math.round((discountAmount / grossBeforeDisc) * 1000) / 10 : 0;
  const subtotal = Math.max(0, grossBeforeDisc - discountAmount);
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;
  const notes = document.getElementById('qt-notes').value.trim();

  // Owner Approval Gate otomatis bila diskon > 10% dan belum diotorisasi Owner
  const needsOwnerAuth = effectiveDiscPct > 10 && !(existingInv && existingInv.ownerApprovedDiscount);

  if (existingInv) {
    const wasDraft = existingInv.status === 'Draf BoM Teknis';
    existingInv.items = items;
    existingInv.laborFee = laborFee;
    existingInv.discountType = discType;
    existingInv.discountValue = discVal;
    existingInv.discountAmount = discountAmount;
    existingInv.subtotal = subtotal;
    existingInv.ppn = ppn;
    existingInv.grandTotal = grandTotal;
    existingInv.notes = notes;
    if (!Array.isArray(existingInv.revisionNotes)) existingInv.revisionNotes = [];

    if (needsOwnerAuth) {
      existingInv.status = 'Menunggu Otorisasi Owner';
      existingInv.requiresOwnerApproval = true;
      existingInv.ownerApprovalStatus = 'Menunggu';
      if (!Array.isArray(state.ownerApprovals)) state.ownerApprovals = [];
      const existApr = state.ownerApprovals.find((ap) => ap.refId === existingInv.id && ap.status === 'Pending');
      if (!existApr) {
        state.ownerApprovals.unshift({
          id: nextSeqId(state.ownerApprovals, 'APR-2026', 3, ['id']),
          type: 'DISCOUNT_RAB',
          refId: existingInv.id,
          city: existingInv.city,
          title: `Persetujuan Diskon RAB ${effectiveDiscPct}% — ${existingInv.clientName}`,
          detail: `${acc ? acc.name : 'Finance Maya'} mengajukan diskon ${effectiveDiscPct}% (${formatRp(discountAmount)}) untuk ${existingInv.id} (${existingInv.roomName}).`,
          amount: grandTotal,
          discountPct: effectiveDiscPct,
          requestedBy: acc ? acc.username : 'finance_maya',
          status: 'Pending',
          createdAt: new Date().toISOString(),
          decidedAt: null
        });
      }
      pushNotification('owner_dist', `Otorisasi Diskon RAB ${effectiveDiscPct}% (${existingInv.id})`, `Diskon >10% untuk ${existingInv.clientName} (${formatRp(grandTotal)}) membutuhkan persetujuan Owner.`, 'warning', 'owner_finance');
      addAuditLog(acc ? acc.username : 'finance_maya', acc ? acc.role : 'finance', existingInv.city, `Mengajukan otorisasi Owner untuk diskon ${effectiveDiscPct}% pada ${existingInv.id}.`);
      saveState();
      closeModal();
      renderDashboard();
      showToast(`Diskon ${effectiveDiscPct}% (>10%) dikirim ke Owner Hendra untuk otorisasi!`, 'warning');
      return;
    }

    existingInv.status = wasDraft ? 'Menunggu Persetujuan Klien' : 'Revisi RAB Dikirim';
    existingInv.revisionNotes.push({
      by: acc ? acc.name : 'Admin Keuangan',
      at: new Date().toISOString(),
      note: `${wasDraft ? 'RAB Resmi Diterbitkan dari BoM' : 'Revisi RAB dikirim'} (${formatRp(grandTotal)}${discountAmount > 0 ? ', Diskon ' + formatRp(discountAmount) : ''}): ${notes}`
    });
    pushNotification(existingInv.clientUsername, `${wasDraft ? 'Quotation RAB Resmi' : 'Revisi RAB Dikirim'} (${existingInv.id})`, `Penawaran senilai ${formatRp(grandTotal)} untuk ${existingInv.roomName} siap ditinjau & disetujui.`, 'info', 'billing', { type: 'invoice', id: existingInv.id });
    pushNotification('admin_eka', `Jembatan 1: RAB ${existingInv.id} Diterbitkan Keuangan`, `RAB untuk ${existingInv.clientName} (${formatRp(grandTotal)}) sudah dikirim ke klien.`, 'info', 'admin_bom', { type: 'invoice', id: existingInv.id });
    addAuditLog(acc ? acc.username : 'finance_maya', acc ? acc.role : 'finance', existingInv.city, `Menerbitkan/revisi RAB ${existingInv.id} menjadi ${formatRp(grandTotal)}.`);
    saveState();
    closeModal();
    renderDashboard();
    showToast(`${existingInv.id} (${formatRp(grandTotal)}) berhasil dikirim ke klien!`, 'success');
    return;
  }

  if (!Array.isArray(state.invoices)) state.invoices = [];
  const qtId = nextSeqId(state.invoices, 'QT-2026', 3, ['id']);
  const techAcc = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
  const saveAsBom = isBomDraft || (acc && (acc.role === 'admin' || acc.role === 'technician') && acc.role !== 'finance');
  const initialStatus = saveAsBom ? 'Draf BoM Teknis' : (needsOwnerAuth ? 'Menunggu Otorisasi Owner' : 'Menunggu Persetujuan Klien');

  state.invoices.unshift({
    id: qtId, invNumber: null, bastNumber: null, poNumber: null,
    ticketId: t.id, revenueCategory: t.ticketType === 'Commissioning' ? 'Proyek Turnkey' : t.ticketType === 'Preventive' ? 'Kontrak AMC/PM' : 'Sparepart & Jasa',
    clientId: t.clientId, clientName: t.clientName, clientUsername: t.clientUsername,
    city: t.city, buildingName: t.buildingName, roomName: t.roomName, unitId: t.unitId, brand: t.brand,
    createdBy: acc ? acc.username : 'admin_eka',
    technicianName: techAcc ? techAcc.name : (acc ? acc.name : 'Tim Teknisi'),
    items, laborFee, discountType: discType, discountValue: discVal, discountAmount,
    subtotal, ppn, grandTotal, notes,
    requiresOwnerApproval: needsOwnerAuth, ownerApprovalStatus: needsOwnerAuth ? 'Menunggu' : null,
    revisionNotes: [], rejectionReason: null, stockDeducted: false, stockReleased: false,
    status: initialStatus, clientPaymentConfirmed: false,
    createdAt: new Date().toISOString(), approvedAt: null, invoicedAt: null, paidAt: null
  });

  if (saveAsBom) {
    pushNotification('finance_maya', `Jembatan 1: Draf BoM Teknis ${qtId} (${t.city})`, `${acc ? acc.name : 'Tim Teknis'} mengajukan Draf BoM komponen untuk ${t.clientName} (${formatRp(grandTotal)}).`, 'warning', 'finance_overview', { type: 'invoice', id: qtId });
    addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', t.city, `Mengajukan Draf BoM Teknis ${qtId} (${formatRp(grandTotal)}) ke Keuangan.`);
  } else if (needsOwnerAuth) {
    if (!Array.isArray(state.ownerApprovals)) state.ownerApprovals = [];
    state.ownerApprovals.unshift({
      id: nextSeqId(state.ownerApprovals, 'APR-2026', 3, ['id']),
      type: 'DISCOUNT_RAB', refId: qtId, city: t.city,
      title: `Persetujuan Diskon RAB ${effectiveDiscPct}% — ${t.clientName}`,
      detail: `Pengajuan diskon ${effectiveDiscPct}% pada ${qtId} senilai ${formatRp(grandTotal)}.`,
      amount: grandTotal, discountPct: effectiveDiscPct, requestedBy: acc ? acc.username : 'finance_maya', status: 'Pending',
      createdAt: new Date().toISOString(), decidedAt: null
    });
    pushNotification('owner_dist', `Otorisasi Diskon RAB ${effectiveDiscPct}% (${qtId})`, `RAB ${qtId} memerlukan persetujuan Owner sebelum dikirim ke ${t.clientName}.`, 'warning', 'owner_finance');
  } else {
    pushNotification(t.clientUsername, `Quotation Sparepart Baru (${qtId})`, `RAB penggantian sparepart ${t.roomName} senilai ${formatRp(grandTotal)} menunggu persetujuan PO Anda.`, 'warning', 'billing', { type: 'invoice', id: qtId });
    addAuditLog(acc ? acc.username : 'finance_maya', acc ? acc.role : 'finance', t.city, `Membuat Quotation RAB ${qtId} (${formatRp(grandTotal)}) untuk ${t.id}.`);
  }

  saveState();
  closeModal();
  renderDashboard();
  showToast(saveAsBom ? `Draf BoM ${qtId} dikirim ke Admin Keuangan (Maya)!` : needsOwnerAuth ? `RAB ${qtId} (Diskon >10%) dikirim ke Owner untuk otorisasi!` : `Quotation ${qtId} (${formatRp(grandTotal)}) dikirim ke ${t.clientName}!`, 'success');
}

function approveQuotationPO(invoiceId) {
  const acc = getCurrentAccount();
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  const nowIso = new Date().toISOString();
  inv.poNumber = inv.poNumber || nextSeqId(state.invoices, 'PO-KLIEN-2026', 3, ['poNumber']);
  inv.approvedAt = nowIso;
  deductCatalogStockForInvoice(inv);

  const relTicket = state.tickets.find((t) => t.id === inv.ticketId);
  if (relTicket && relTicket.status === 'Selesai') {
    const nextInv = nextSeqId(state.invoices, 'INV-2026', 3, ['invNumber']);
    const seqPart = nextInv.split('-').pop();
    inv.invNumber = nextInv;
    inv.bastNumber = `BAST-2026-${seqPart}`;
    inv.invoicedAt = nowIso;
    inv.status = 'Menunggu Pembayaran';
    inv.stockReleased = true;
  } else {
    inv.status = 'PO Disetujui (Proses Pasang)';
  }

  pushNotification('finance_maya', `Jembatan 2: PO ${inv.poNumber} Disetujui Klien`, `${inv.clientName} (${inv.city}) menyetujui RAB ${inv.id} (${formatRp(inv.grandTotal)}). Stok gudang ${inv.city} teralokasi, silakan Release ke tim teknis.`, 'success', 'finance_overview', { type: 'invoice', id: inv.id });
  pushNotification('admin_eka', `PO Disetujui Klien: ${inv.poNumber}`, `${inv.clientName} menyetujui RAB ${inv.id} (${formatRp(inv.grandTotal)}).`, 'success', 'admin_bom', { type: 'invoice', id: inv.id });
  if (relTicket && relTicket.assignedTo) {
    pushNotification(relTicket.assignedTo, `PO ${inv.poNumber} Disetujui Klien`, `Klien ${inv.clientName} menyetujui penggantian sparepart untuk ${inv.ticketId}.`, 'success', 'workorders', { type: 'ticket', id: relTicket.id });
  }
  addAuditLog(acc ? acc.username : inv.clientUsername, 'client', inv.city, `Menyetujui RAB ${inv.id} dan menerbitkan ${inv.poNumber}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`RAB disetujui! Nomor PO ${inv.poNumber} berhasil diterbitkan.`, 'success');
}

function submitSparepartForm(e, editId = null) {
  e.preventDefault();
  if (!Array.isArray(state.sparepartCatalog)) state.sparepartCatalog = JSON.parse(JSON.stringify(DEFAULT_SPAREPART_CATALOG));
  const acc = getCurrentAccount();
  const id = document.getElementById('sp-id').value.trim().toUpperCase();
  const brand = document.getElementById('sp-brand').value;
  const name = document.getElementById('sp-name').value.trim();
  const category = document.getElementById('sp-category').value.trim();
  const cogs = Math.max(0, Number(document.getElementById('sp-cogs').value) || 0);
  const price = Math.max(0, Number(document.getElementById('sp-price').value) || 0);
  const unit = document.getElementById('sp-unit').value.trim() || 'Unit';
  const readIntField = (id1, id2, def) => {
    const v1 = document.getElementById(id1)?.value;
    const v2 = id2 ? document.getElementById(id2)?.value : undefined;
    const chosen = (v1 !== undefined && v1 !== null && String(v1).trim() !== '') ? v1 : (v2 !== undefined && v2 !== null && String(v2).trim() !== '' ? v2 : def);
    return Math.max(0, parseInt(chosen, 10) || 0);
  };
  const stockJkt = readIntField('sp-stk-jkt', null, 10);
  const stockJog = readIntField('sp-stk-jog', null, 6);
  const stockSby = readIntField('sp-stk-sby', 'sp-sby', 6);
  const stockMlg = readIntField('sp-stk-mlg', 'sp-mlg', 4);
  const stockDps = readIntField('sp-stk-dps', null, 8);

  if (editId) {
    const part = state.sparepartCatalog.find((p) => p.id === editId);
    if (!part) return;
    Object.assign(part, { brand, name, category, cogs, price, unit, stockJkt, stockJog, stockSby, stockMlg, stockDps });
    addAuditLog(acc ? acc.username : 'finance_maya', acc ? acc.role : 'finance', 'Nasional (5 Kota)', `Memperbarui katalog sparepart ${part.id} (Jual ${formatRp(price)}, Total Stok ${getTotalCatalogStock(part)}).`);
    showToast(`Sparepart ${part.id} berhasil diperbarui.`, 'success');
  } else {
    if (state.sparepartCatalog.some((p) => p.id === id)) { showToast(`Kode SKU ${id} sudah terdaftar.`, 'error'); return; }
    state.sparepartCatalog.unshift({ id, name, brand, category, cogs, price, stockJkt, stockJog, stockSby, stockMlg, stockDps, unit });
    addAuditLog(acc ? acc.username : 'finance_maya', acc ? acc.role : 'finance', 'Nasional (5 Kota)', `Menambahkan sparepart baru ${id} (${name}) ke katalog 5 kota.`);
    showToast(`Sparepart baru ${id} ditambahkan ke katalog!`, 'success');
  }
  saveState();
  closeModal();
  renderDashboard();
}

function computeOwnerFinancialMetrics(cityFilter = 'all') {
  const scopedClients = state.clients.filter((c) => cityFilter === 'all' || c.city === cityFilter);
  const scopedInvs = (state.invoices || []).filter((inv) => (cityFilter === 'all' || inv.city === cityFilter) && inv.status !== 'Ditolak Klien');
  const paidInvs = scopedInvs.filter((x) => x.status === 'Lunas');
  const outstandingInvs = scopedInvs.filter((x) => x.status === 'Menunggu Pembayaran');

  let incSparepart = 0;
  let incService = 0;
  let incAmc = 0;
  let incTurnkey = 0;
  let cogsRealized = 0;

  paidInvs.forEach((inv) => {
    const revCat = inv.revenueCategory || 'Sparepart & Jasa';
    const dpp = Number(inv.subtotal) || 0;
    const labor = Number(inv.laborFee) || 0;
    const invCogs = (inv.items || []).reduce((s, it) => s + (Number(it.lineCogs) || Math.round((it.lineTotal || 0) * 0.68)), 0);
    cogsRealized += invCogs;
    if (revCat === 'Kontrak AMC/PM') incAmc += dpp;
    else if (revCat === 'Proyek Turnkey') incTurnkey += dpp;
    else {
      incService += labor;
      incSparepart += Math.max(0, dpp - labor);
    }
  });

  const totalIncomeRp = incSparepart + incService + incAmc + incTurnkey;
  const scopedExpenses = (state.expenses || []).filter((ex) => cityFilter === 'all' || ex.city === cityFilter);
  const expRestock = scopedExpenses.filter((x) => x.category === 'PO Restock Gudang').reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const expSpk = scopedExpenses.filter((x) => x.category === 'Operasional & Insentif SPK Teknisi').reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const expOverhead = scopedExpenses.filter((x) => x.category === 'Overhead Cabang 5 Kota').reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const expManualOther = scopedExpenses.filter((x) => !['PO Restock Gudang', 'Operasional & Insentif SPK Teknisi', 'Overhead Cabang 5 Kota'].includes(x.category)).reduce((s, x) => s + (Number(x.amount) || 0), 0);

  const totalExpenseRp = cogsRealized + expRestock + expSpk + expOverhead + expManualOther;
  const netProfitRp = totalIncomeRp - totalExpenseRp;
  const netMarginPct = totalIncomeRp > 0 ? Number(((netProfitRp / totalIncomeRp) * 100).toFixed(1)) : 0;
  const scopedTickets = state.tickets.filter((t) => cityFilter === 'all' || t.city === cityFilter);
  const slaMetrics = computeSlaAndMttrMetrics(scopedTickets);
  const allBlds = scopedClients.flatMap((c) => c.buildings);
  const roi = computeScopeROI(allBlds);

  return {
    scopedClients, allBlds, paidInvs, outstandingInvs,
    incSparepart, incService, incAmc, incTurnkey, totalIncomeRp,
    cogsRealized, expRestock, expSpk, expOverhead: expOverhead + expManualOther, totalExpenseRp,
    netProfitRp, netMarginPct,
    outstandingRp: outstandingInvs.reduce((s, x) => s + (Number(x.grandTotal) || 0), 0),
    slaMetrics, roi,
    activeErrorCount: scopedTickets.filter((t) => t.status !== 'Selesai').length
  };
}

function getClientOwnerSummary(client) {
  const blds = client.buildings || [];
  const totalIdu = blds.reduce((s, b) => s + (b.iduCount || 0), 0);
  const activeErrs = state.tickets.filter((t) => t.clientId === client.id && t.status !== 'Selesai');
  const overRooms = blds.flatMap((b) => (b.rooms || []).filter((r) => isRoomOverusage(r)));
  const pmDue = blds.some((b) => computePmStatus(b.nextPmDate) !== 'Terjadwal Aman');
  const clientInvs = (state.invoices || []).filter((inv) => inv.clientId === client.id && inv.status !== 'Ditolak Klien');
  const paidDpp = clientInvs.filter((x) => x.status === 'Lunas').reduce((s, x) => s + (Number(x.subtotal) || 0), 0);
  const paidCogs = clientInvs.filter((x) => x.status === 'Lunas').reduce((s, x) => s + (x.items || []).reduce((si, it) => si + (Number(it.lineCogs) || 0), 0), 0);
  const piutangRp = clientInvs.filter((x) => x.status === 'Menunggu Pembayaran').reduce((s, x) => s + (Number(x.grandTotal) || 0), 0);
  const roi = computeScopeROI(blds);
  const health = activeErrs.length > 0 ? 'error' : (pmDue || overRooms.length > 0) ? 'warn' : 'ok';
  return { totalIdu, activeErrs, overRooms, pmDue, paidDpp, estProfitRp: Math.max(0, paidDpp - paidCogs), piutangRp, roi, health };

function approveOwnerRequest(reqId) {
  const req = (state.ownerApprovals || []).find((x) => x.id === reqId);
  if (!req || req.status !== 'Pending') return;
  const nowIso = new Date().toISOString();
  req.status = 'Approved';
  req.decidedAt = nowIso;

  if (req.type === 'DISCOUNT_RAB') {
    const inv = (state.invoices || []).find((x) => x.id === req.refId);
    if (inv) {
      inv.ownerApprovedDiscount = true;
      inv.ownerApprovalStatus = 'Disetujui Owner';
      inv.status = 'Menunggu Persetujuan Klien';
      if (!Array.isArray(inv.revisionNotes)) inv.revisionNotes = [];
      inv.revisionNotes.push({ by: 'Owner Hendra Wijaya', at: nowIso, note: `Otorisasi Diskon ${req.discountPct || ''}% disetujui Owner.` });
      pushNotification(inv.clientUsername, `Penawaran RAB ${inv.id} Siap Ditinjau`, `Penawaran dengan diskon khusus ${req.discountPct || ''}% telah disetujui manajemen dan siap Anda terbitkan PO.`, 'info', 'billing', { type: 'invoice', id: inv.id });
    }
    pushNotification('finance_maya', `Owner Menyetujui Diskon RAB ${req.refId}`, `Hendra Wijaya menyetujui ${req.title}. RAB otomatis dikirim ke klien.`, 'success', 'finance_billing');
  } else if (req.type === 'RESTOCK_PO') {
    const part = getCatalog().find((p) => p.id === req.partId);
    const qty = Math.max(1, Number(req.qty) || 5);
    const targetCity = req.targetCity || req.city || 'Jakarta';
    if (part) {
      adjustCityStock(part, targetCity, qty);
      if (!Array.isArray(state.stockMovements)) state.stockMovements = [];
      state.stockMovements.unshift({
        id: nextSeqId(state.stockMovements, 'STK-2026', 3, ['id']),
        date: nowIso, type: 'IN', city: targetCity, partId: part.id, partName: part.name, qty,
        ref: `${req.refId} (Owner Approved)`, actor: 'owner_dist'
      });
    }
    if (!Array.isArray(state.expenses)) state.expenses = [];
    state.expenses.unshift({
      id: nextSeqId(state.expenses, 'EXP-2026', 3, ['id']),
      date: nowIso.slice(0, 10), category: 'PO Restock Gudang', city: targetCity,
      amount: Number(req.amount) || 0,
      description: `${req.title} (Disetujui Owner Hendra)`,
      refId: req.refId, recordedBy: 'owner_dist'
    });
    pushNotification('finance_maya', `Owner Menyetujui PO Restock ${req.refId}`, `Stok gudang ${targetCity} bertambah & pengeluaran PO Restock tercatat.`, 'success', 'finance_inventory');
  }

  addAuditLog('owner_dist', 'owner', req.city || 'Nasional', `Menyetujui otorisasi Owner ${req.id} (${req.title}).`);
  saveState();
  renderDashboard();
  showToast(`Otorisasi ${req.id} disetujui Owner!`, 'success');
}

function rejectOwnerRequest(reqId) {
  const req = (state.ownerApprovals || []).find((x) => x.id === reqId);
  if (!req || req.status !== 'Pending') return;
  req.status = 'Rejected';
  req.decidedAt = new Date().toISOString();
  if (req.type === 'DISCOUNT_RAB') {
    const inv = (state.invoices || []).find((x) => x.id === req.refId);
    if (inv) { inv.ownerApprovalStatus = 'Ditolak Owner'; inv.status = 'Minta Revisi Klien'; }
  }
  pushNotification('finance_maya', `Owner Menolak Pengajuan ${req.id}`, `${req.title} ditolak oleh Owner. Silakan sesuaikan kembali.`, 'error', 'finance_overview');
  addAuditLog('owner_dist', 'owner', req.city || 'Nasional', `Menolak otorisasi Owner ${req.id} (${req.title}).`);
  saveState();
  renderDashboard();
  showToast(`Pengajuan ${req.id} ditolak.`, 'warning');
}

function exportOwnerMonthlyCsv() {
  const rows = [['Klien', 'Kota', 'Gedung', 'IDU', 'Baseline Listrik/Thn (Rp)', 'Estimasi Hemat/Thn (Rp)', 'Overhead Turun (%)', 'Kontrak AMC', 'Status Tagihan AMC']];
  state.clients.forEach((c) => {
    const r = computeScopeROI(c.buildings);
    const idus = c.buildings.reduce((s, b) => s + (b.iduCount || 0), 0);
    rows.push([c.name, c.city, c.buildings.length, idus, r.baseElecRpYear, r.totalSavedRpYear, r.overheadReductionPct, c.amcContractNo, c.amcBillingStatus]);
  });
  const csv = rows.map((row) => row.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  downloadTextFile(`laporan-bulanan-owner-12-klien-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8');
  showToast('Laporan Bulanan Owner (CSV) berhasil diunduh.', 'success');
}

function renderFinanceBilling(container) {
  const acc = getCurrentAccount();
  const activeCity = acc && acc.role === 'finance' ? financeCityFilter : adminCityFilter;
  const cityInvs = (state.invoices || []).filter((inv) => activeCity === 'all' || inv.city === activeCity);
  const q = (uiFilters.financeBillingQuery || uiFilters.adminBillingQuery || '').toLowerCase();
  const stFilter = uiFilters.financeBillingStatus !== 'all' ? uiFilters.financeBillingStatus : uiFilters.adminBillingStatus;
  const allInvs = cityInvs.filter((inv) => {
    const stOk = stFilter === 'all' || inv.status === stFilter;
    const qOk = !q || (inv.id || '').toLowerCase().includes(q) || (inv.invNumber || '').toLowerCase().includes(q) || (inv.clientName || '').toLowerCase().includes(q) || (inv.roomName || '').toLowerCase().includes(q);
    return stOk && qOk;
  });

  const activeSalesInvs = cityInvs.filter((x) => x.status !== 'Ditolak Klien');
  const totalSales = activeSalesInvs.reduce((s, x) => s + x.grandTotal, 0);
  const totalDpp = activeSalesInvs.reduce((s, x) => s + (x.subtotal || 0), 0);
  const totalCogs = activeSalesInvs.reduce((s, x) => s + (x.items || []).reduce((si, it) => si + (Number(it.lineCogs) || Math.round((it.lineTotal || 0) * 0.68)), 0), 0);
  const grossMarginRp = Math.max(0, totalDpp - totalCogs);
  const grossMarginPct = totalDpp > 0 ? Number(((grossMarginRp / totalDpp) * 100).toFixed(1)) : 0;

  const paidList = cityInvs.filter((x) => x.status === 'Lunas');
  const outList = cityInvs.filter((x) => x.status === 'Menunggu Pembayaran');
  const revOrWaitList = cityInvs.filter((x) => ['Draf BoM Teknis', 'Menunggu Otorisasi Owner', 'Menunggu Persetujuan Klien', 'Minta Revisi Klien', 'Revisi RAB Dikirim', 'PO Disetujui (Proses Pasang)'].includes(x.status));

  const rows = allInvs.length === 0
    ? `<tr><td colspan="6" class="px-4 py-8 text-center text-xs text-slate-500">Tidak ada dokumen Quotation atau Invoice yang cocok dengan filter saat ini.</td></tr>`
    : allInvs.map((inv) => {
      const canEditRab = ['Draf BoM Teknis', 'Menunggu Persetujuan Klien', 'Minta Revisi Klien', 'Revisi RAB Dikirim'].includes(inv.status);
      const invCogs = (inv.items || []).reduce((s, it) => s + (Number(it.lineCogs) || Math.round((it.lineTotal || 0) * 0.68)), 0);
      const invMargin = Math.max(0, (inv.subtotal || 0) - invCogs);
      return `
      <tr class="hover:bg-slate-50/80 transition">
        <td class="px-4 py-3">
          <div class="font-mono text-xs font-bold text-slate-900">${escapeHtml(inv.invNumber || inv.id)}</div>
          <div class="text-[10px] font-mono text-slate-500">${inv.poNumber ? 'PO: ' + escapeHtml(inv.poNumber) : 'WO: ' + escapeHtml(inv.ticketId)}</div>
        </td>
        <td class="px-4 py-3">
          <div class="text-xs font-bold text-slate-900">${escapeHtml(inv.clientName)}</div>
          <div class="text-[11px] text-slate-500">${escapeHtml(inv.buildingName)} &bull; ${escapeHtml(inv.roomName)} ${getCityBadge(inv.city)}</div>
        </td>
        <td class="px-4 py-3 text-xs text-slate-700">
          ${inv.items.map((it) => `<div>${escapeHtml(it.name)} (${it.qty}x)</div>`).join('')}
          <div class="text-[10px] text-slate-400">${inv.laborFee > 0 ? '+ Jasa & ' : ''}PPN 11%${inv.discountAmount > 0 ? ` &bull; Diskon ${formatRp(inv.discountAmount)}` : ''}</div>
        </td>
        <td class="px-4 py-3 font-mono text-xs">
          <div class="font-bold text-slate-900">${formatRp(inv.grandTotal)}</div>
          <div class="text-[10px] text-emerald-700 font-semibold">Margin: ${formatRp(invMargin)}</div>
        </td>
        <td class="px-4 py-3">
          ${getInvoiceStatusBadge(inv.status)}
          ${inv.stockReleased && inv.status === 'PO Disetujui (Proses Pasang)' ? '<div class="text-[10px] text-emerald-700 font-bold mt-1">🟢 Stok Released ke Teknis</div>' : ''}
          ${inv.clientPaymentConfirmed && inv.status === 'Menunggu Pembayaran' ? '<div class="text-[10px] text-emerald-700 font-semibold mt-1">Klien sudah konfirmasi bayar</div>' : ''}
        </td>
        <td class="px-4 py-3 text-right">
          <div class="inline-flex flex-wrap items-center justify-end gap-1.5">
            <button type="button" onclick="openInvoiceBastModal('${inv.id}')" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-[11px] font-semibold text-slate-700">Lihat &amp; Cetak</button>
            ${canEditRab ? `<button type="button" onclick="openEditQuotationModal('${inv.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 text-[11px] font-bold">${inv.status === 'Draf BoM Teknis' ? '✅ Terbitkan RAB' : '✏️ Edit / Diskon RAB'}</button>` : ''}
            ${inv.status === 'PO Disetujui (Proses Pasang)' && !inv.stockReleased ? `<button type="button" onclick="releaseStockForPo('${inv.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold">📦 Release Stok</button>` : ''}
            ${inv.status === 'PO Disetujui (Proses Pasang)' ? `<button type="button" onclick="issueInvoiceFromPo('${inv.id}')" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-semibold">Terbitkan Invoice</button>` : ''}
            ${inv.status === 'Menunggu Pembayaran' ? `<button type="button" onclick="markInvoicePaid('${inv.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold">Tandai Lunas</button>` : ''}
          </div>
        </td>
      </tr>
    `; }).join('');

  container.innerHTML = `
    ${acc && acc.role === 'finance' ? renderFinanceCityFilterBar() : renderAdminCityFilterBar()}
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
      <button type="button" onclick="updateFilterAndRender('financeBillingStatus', 'all')" class="text-left bg-white rounded-2xl border border-slate-200 hover:border-teal-500 transition p-4">
        <div class="text-xs text-slate-500 mb-1">Total Pipeline &amp; Penjualan</div>
        <div class="text-xl font-extrabold text-slate-900">${formatRp(totalSales)}</div>
        <div class="text-[11px] text-slate-500 mt-1">${activeSalesInvs.length} dokumen aktif</div>
      </button>
      <div class="bg-gradient-to-br from-emerald-900 to-teal-900 text-white rounded-2xl p-4">
        <div class="text-xs text-emerald-200 mb-1">Laba Kotor / Margin Bersih (COGS)</div>
        <div class="text-xl font-extrabold text-emerald-300">${formatRp(grossMarginRp)}</div>
        <div class="text-[11px] text-emerald-100 mt-1">Margin ${grossMarginPct}% &bull; HPP ${formatRpShort(totalCogs)}</div>
      </div>
      <button type="button" onclick="updateFilterAndRender('financeBillingStatus', 'Lunas')" class="text-left bg-white rounded-2xl border border-emerald-200 hover:border-emerald-500 transition p-4">
        <div class="text-xs text-emerald-700 mb-1">Sudah Lunas (Paid)</div>
        <div class="text-xl font-extrabold text-emerald-700">${formatRp(paidList.reduce((s, x) => s + x.grandTotal, 0))}</div>
        <div class="text-[11px] text-slate-500 mt-1">${paidList.length} Invoice Lunas &rarr;</div>
      </button>
      <button type="button" onclick="updateFilterAndRender('financeBillingStatus', 'Menunggu Pembayaran')" class="text-left bg-white rounded-2xl border border-indigo-200 hover:border-indigo-500 transition p-4">
        <div class="text-xs text-indigo-700 mb-1">Piutang AR (Outstanding)</div>
        <div class="text-xl font-extrabold text-indigo-700">${formatRp(outList.reduce((s, x) => s + x.grandTotal, 0))}</div>
        <div class="text-[11px] text-slate-500 mt-1">${outList.length} Invoice Terbit &rarr;</div>
      </button>
      <button type="button" onclick="updateFilterAndRender('financeBillingStatus', 'Minta Revisi Klien')" class="text-left bg-white rounded-2xl border border-amber-200 hover:border-amber-500 transition p-4">
        <div class="text-xs text-amber-800 mb-1">Antrean BoM / Negosiasi / PO</div>
        <div class="text-xl font-extrabold text-amber-700">${formatRp(revOrWaitList.reduce((s, x) => s + x.grandTotal, 0))}</div>
        <div class="text-[11px] text-slate-500 mt-1">${revOrWaitList.length} dokumen berjalan &rarr;</div>
      </button>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-sm font-bold text-slate-900">Manajemen RAB, Negosiasi Diskon, Pelepasan Stok &amp; Invoice (AR)</h2>
          <p class="text-xs text-slate-500">Diskon &gt; 10% otomatis melalui Otorisasi Owner; Approval PO melepas stok gudang kota terkait</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <input id="finance-billing-search" type="text" value="${escapeHtml(uiFilters.financeBillingQuery)}" oninput="updateFilterAndRender('financeBillingQuery', this.value, 'finance-billing-search')" placeholder="Cari no. dokumen / klien..." class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs w-52" />
          <select onchange="updateFilterAndRender('financeBillingStatus', this.value)" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs bg-white">
            <option value="all" ${stFilter === 'all' ? 'selected' : ''}>Semua Status</option>
            <option value="Draf BoM Teknis" ${stFilter === 'Draf BoM Teknis' ? 'selected' : ''}>Draf BoM Teknis</option>
            <option value="Menunggu Otorisasi Owner" ${stFilter === 'Menunggu Otorisasi Owner' ? 'selected' : ''}>Menunggu Otorisasi Owner</option>
            <option value="Minta Revisi Klien" ${stFilter === 'Minta Revisi Klien' ? 'selected' : ''}>Minta Revisi Klien</option>
            <option value="Menunggu Persetujuan Klien" ${stFilter === 'Menunggu Persetujuan Klien' ? 'selected' : ''}>Menunggu PO Klien</option>
            <option value="PO Disetujui (Proses Pasang)" ${stFilter === 'PO Disetujui (Proses Pasang)' ? 'selected' : ''}>PO Disetujui</option>
            <option value="Menunggu Pembayaran" ${stFilter === 'Menunggu Pembayaran' ? 'selected' : ''}>Menunggu Pembayaran</option>
            <option value="Lunas" ${stFilter === 'Lunas' ? 'selected' : ''}>Lunas</option>
          </select>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
            <tr><th class="px-4 py-3">Dokumen / PO</th><th class="px-4 py-3">Klien &amp; Ruangan</th><th class="px-4 py-3">Item &amp; Pajak</th><th class="px-4 py-3">Total &amp; Margin</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Aksi</th></tr>
          </thead>
          <tbody class="divide-y divide-slate-100">${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function submitAddExpense(e) {
  e.preventDefault();
  if (!Array.isArray(state.expenses)) state.expenses = [];
  const acc = getCurrentAccount();
  const category = document.getElementById('exp-cat').value;
  const city = document.getElementById('exp-city').value;
  const amount = Math.max(0, Number(document.getElementById('exp-amount').value) || 0);
  const refId = document.getElementById('exp-ref').value.trim();
  const description = document.getElementById('exp-desc').value.trim();
  const id = nextSeqId(state.expenses, 'EXP-2026', 3, ['id']);
  state.expenses.unshift({
    id, date: new Date().toISOString().slice(0, 10), category, city, amount, description, refId,
    recordedBy: acc ? acc.username : 'finance_maya'
  });
  pushNotification('owner_dist', `Pengeluaran Baru Dicatat: ${id}`, `${category} (${city}) senilai ${formatRp(amount)} oleh Finance Maya.`, 'info', 'owner_finance');
  addAuditLog(acc ? acc.username : 'finance_maya', 'finance', city, `Mencatat pengeluaran ${id} (${category}): ${formatRp(amount)}.`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Pengeluaran ${id} (${formatRp(amount)}) tercatat di Buku Kas!`, 'success');
}

function exportFinanceLedgerCsv() {
  const rows = [['Jenis', 'ID', 'Tanggal', 'Kategori', 'Kota', 'Nominal (Rp)', 'Keterangan']];
  (state.invoices || []).filter((x) => x.status === 'Lunas').forEach((inv) => {
    rows.push(['PEMASUKAN', inv.invNumber || inv.id, (inv.paidAt || inv.createdAt).slice(0, 10), inv.revenueCategory || 'Sparepart & Jasa', inv.city, inv.subtotal, `${inv.clientName} - ${inv.roomName}`]);
  });
  (state.expenses || []).forEach((ex) => {
    rows.push(['PENGELUARAN', ex.id, ex.date, ex.category, ex.city, -Math.abs(ex.amount), ex.description]);
  });
  const csv = rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  downloadTextFile(`buku-kas-laba-rugi-coolsync-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8');

}

function submitRestockOrder(e) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const partId = document.getElementById('rst-part').value;
  const targetCity = document.getElementById('rst-city').value;
  const qty = Math.max(1, parseInt(document.getElementById('rst-qty').value, 10) || 1);
  const part = getCatalog().find((p) => p.id === partId);
  if (!part) return;

  const totalCost = (Number(part.cogs) || 1000000) * qty;
  const poRef = `PO-RST-2026-${String(Date.now()).slice(-3)}`;
  const nowIso = new Date().toISOString();

  if (totalCost >= 15000000) {
    if (!Array.isArray(state.ownerApprovals)) state.ownerApprovals = [];
    const aprId = nextSeqId(state.ownerApprovals, 'APR-2026', 3, ['id']);
    state.ownerApprovals.unshift({
      id: aprId, type: 'RESTOCK_PO', refId: poRef, city: targetCity,
      title: `Persetujuan PO Restock ${qty}x ${part.id} (${targetCity}) — ${formatRp(totalCost)}`,
      detail: `${acc ? acc.name : 'Finance Maya'} mengajukan restock ${qty} ${part.unit} ${part.name} untuk Gudang ${targetCity}.`,
      amount: totalCost, partId: part.id, qty, targetCity, requestedBy: acc ? acc.username : 'finance_maya',
      status: 'Pending', createdAt: nowIso, decidedAt: null
    });
    pushNotification('owner_dist', `Otorisasi PO Restock ${poRef} (${formatRp(totalCost)})`, `Finance Maya mengajukan restock ${qty}x ${part.name} ke Gudang ${targetCity}.`, 'warning', 'owner_finance');
    addAuditLog(acc ? acc.username : 'finance_maya', 'finance', targetCity, `Mengajukan PO Restock ${poRef} (${formatRp(totalCost)}) ke Owner.`);
    saveState();
    closeModal();
    renderDashboard();
    showToast(`PO Restock ${formatRp(totalCost)} dikirim ke Owner Hendra untuk otorisasi!`, 'warning');
    return;
  }

  adjustCityStock(part, targetCity, qty);
  if (!Array.isArray(state.stockMovements)) state.stockMovements = [];
  state.stockMovements.unshift({
    id: nextSeqId(state.stockMovements, 'STK-2026', 3, ['id']),
    date: nowIso, type: 'IN', city: targetCity, partId: part.id, partName: part.name, qty, ref: poRef,
    actor: acc ? acc.username : 'finance_maya'
  });
  if (!Array.isArray(state.expenses)) state.expenses = [];
  state.expenses.unshift({
    id: nextSeqId(state.expenses, 'EXP-2026', 3, ['id']),
    date: nowIso.slice(0, 10), category: 'PO Restock Gudang', city: targetCity, amount: totalCost,
    description: `Pembelian PO Restock ${qty}x ${part.name} (Gudang ${targetCity})`,
    refId: poRef, recordedBy: acc ? acc.username : 'finance_maya'
  });
  addAuditLog(acc ? acc.username : 'finance_maya', 'finance', targetCity, `Eksekusi PO Restock ${poRef}: +${qty} ${part.id} ke Gudang ${targetCity}.`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Stok ${part.id} di ${targetCity} bertambah +${qty} & tercatat di Buku Kas!`, 'success');
}

function issueAmcTerminInvoice(clientId) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  if (!Array.isArray(state.invoices)) state.invoices = [];
  const qtId = nextSeqId(state.invoices, 'QT-2026', 3, ['id']);
  const nextInv = nextSeqId(state.invoices, 'INV-2026', 3, ['invNumber']);
  const seqPart = nextInv.split('-').pop();
  const terminSubtotal = Math.round((Number(client.amcAnnualValue) || 180000000) / 4);
  const ppn = Math.round(terminSubtotal * PPN_RATE);
  const grandTotal = terminSubtotal + ppn;
  const nowIso = new Date().toISOString();

  state.invoices.unshift({
    id: qtId, invNumber: nextInv, bastNumber: `BAST-2026-${seqPart}`, poNumber: `PO-${getCityHub(client.city).code}-AMC-${seqPart}`,
    ticketId: `AMC-2026-${client.id.toUpperCase()}`, revenueCategory: 'Kontrak AMC/PM',
    clientId: client.id, clientName: client.name, clientUsername: client.ownerUsername,
    city: client.city, buildingName: client.buildings.map((b) => b.name).join(', '),
    roomName: `Tagihan Termin Kontrak ${client.amcContractNo}`, unitId: client.amcContractNo, brand: (client.brands || []).join(', '),
    createdBy: 'finance_maya', technicianName: 'Tim Nasional',
    items: [{ partId: 'AMC-TERMIN', name: `Tagihan Termin Kontrak AMC (${client.amcTier})`, qty: 1, unitPrice: terminSubtotal, cogsUnit: Math.round(terminSubtotal * 0.25), lineTotal: terminSubtotal, lineCogs: Math.round(terminSubtotal * 0.25) }],
    laborFee: 0, discountType: 'none', discountValue: 0, discountAmount: 0,
    subtotal: terminSubtotal, ppn, grandTotal,
    notes: `Penagihan termin kontrak AMC ${client.amcContractNo} (${client.buildings.length} gedung).`,
    revisionNotes: [], rejectionReason: null, stockDeducted: true, stockReleased: true,
    status: 'Menunggu Pembayaran', clientPaymentConfirmed: false,
    createdAt: nowIso, approvedAt: nowIso, invoicedAt: nowIso, paidAt: null
  });
  client.amcBillingStatus = 'Menunggu Pembayaran Termin';
  pushNotification(client.ownerUsername, `Tagihan Kontrak AMC ${nextInv}`, `Invoice termin kontrak ${client.amcContractNo} senilai ${formatRp(grandTotal)} telah diterbitkan.`, 'info', 'billing');
  addAuditLog('finance_maya', 'finance', client.city, `Menerbitkan tagihan termin AMC ${nextInv} untuk ${client.name}.`);
  saveState();
  renderDashboard();
  showToast(`Invoice Termin AMC ${nextInv} (${formatRp(grandTotal)}) diterbitkan!`, 'success');
}

function updateAcModalBuildingOptions(preferredBldId = null) {
  const clientId = document.getElementById('ac-add-client')?.value;

  if (!clientId || !bldSel) return;
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  bldSel.innerHTML = client.buildings.map((b) => `<option value="${b.id}" ${preferredBldId === b.id ? 'selected' : ''}>${escapeHtml(b.name)} (${escapeHtml(b.gatewayId)})</option>`).join('');
  const refreshGw = () => {
    const b = client.buildings.find((x) => x.id === bldSel.value) || client.buildings[0];
    if (gwBadge && b) gwBadge.innerHTML = `Terhubung otomatis ke Edge Gateway <strong>${escapeHtml(b.gatewayId)}</strong> (${escapeHtml(b.protocol)}) &bull; Status: ${escapeHtml(b.gatewayStatus)}`;
  };

function submitAddAcUnit(e, prefillReqId = null) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const clientId = document.getElementById('ac-add-client').value;
  const buildingId = document.getElementById('ac-add-building').value;
  const floor = document.getElementById('ac-add-floor').value.trim();
  const roomName = document.getElementById('ac-add-room').value.trim();
  const unitId = document.getElementById('ac-add-unitid').value.trim().toUpperCase();
  const brand = document.getElementById('ac-add-brand').value;
  const capacity = document.getElementById('ac-add-capacity').value;
  const targetTemp = parseFloat(document.getElementById('ac-add-target').value) || 22.0;

  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!client || !bld) return;

  const kwMatch = capacity.match(/([\d.]+)\s*kW/i);
  const powerKw = kwMatch ? parseFloat(kwMatch[1]) : 4.5;
  const newRoom = {
    id: 'rm_new_' + Date.now(),
    unitId, floor, name: roomName,
    temp: targetTemp, targetTemp, mode: 'Cool', powerKw,
    status: 'Normal', errorCode: null, zoneType: 'officeOpd',
    tempHistory6h: [targetTemp + 0.3, targetTemp + 0.2, targetTemp + 0.1, targetTemp, targetTemp, targetTemp]
  };
  bld.rooms.unshift(newRoom);
  bld.iduCount += 1;
  if (!client.brands.includes(brand)) client.brands.push(brand);

  if (prefillReqId) {
    const req = (state.installRequests || []).find((r) => r.id === prefillReqId);
    if (req) { req.status = 'Terpasang & Aktif'; req.installedUnitId = unitId; }
  }

  pushNotification(client.ownerUsername, `Unit AC Baru Aktif: ${unitId}`, `${roomName} (${bld.name} ${floor}) — ${brand} ${capacity} berhasil diaktifkan ke Edge Gateway ${bld.gatewayId}.`, 'success', 'units');
  addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', client.city, `Menambahkan unit AC baru ${unitId} (${roomName}) di ${client.name} - ${bld.name}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Unit ${unitId} (${roomName}) berhasil ditambahkan & aktif di sistem!`, 'success');
}

function submitClientInstallRequest(e) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const buildingId = document.getElementById('req-ac-building').value;
  const bld = client.buildings.find((b) => b.id === buildingId) || client.buildings[0];
  const floor = document.getElementById('req-ac-floor').value.trim();
  const roomName = document.getElementById('req-ac-room').value.trim();
  const brand = document.getElementById('req-ac-brand').value;
  const capacity = document.getElementById('req-ac-capacity').value;
  const targetTemp = parseFloat(document.getElementById('req-ac-target').value) || 21;
  const notes = document.getElementById('req-ac-notes').value.trim();

  if (!Array.isArray(state.installRequests)) state.installRequests = [];
  const reqId = nextSeqId(state.installRequests, 'REQ-AC', 3, ['id']);
  state.installRequests.unshift({
    id: reqId, clientId: client.id, clientName: client.name, clientUsername: acc.username,
    city: client.city, buildingId: bld.id, buildingName: bld.name,
    floor, roomName, brand, capacity, targetTemp, notes,
    status: 'Menunggu Pemasangan', createdAt: new Date().toISOString(), installedUnitId: null
  });

  pushNotification('admin_eka', `Permohonan Unit AC Baru (${reqId})`, `${client.name} mengajukan pemasangan ${brand} (${capacity}) di ${bld.name} ${floor} - ${roomName}.`, 'info', 'clients');

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Permohonan ${reqId} berhasil dikirim ke Admin Eka!`, 'success');
}

function submitTurnkeyBuildingProject(e, mode = 'admin') {
  if (e && e.preventDefault) e.preventDefault();
  const acc = getCurrentAccount();
  const clientId = (acc && acc.role === 'client' && acc.clientId)
    ? acc.clientId
    : (document.getElementById('tk-client')?.value || state.clients[0].id);
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;

  const gatewayId = (document.getElementById('tk-gateway').value || 'GW-NEW-01').trim().toUpperCase();
  const name = (document.getElementById('tk-name').value || 'Gedung Baru').trim();
  const fullName = (document.getElementById('tk-fullname').value || name).trim();
  const brand = document.getElementById('tk-brand').value || 'Gree GMV';
  const floorCount = Math.max(2, Math.min(4, parseInt(document.getElementById('tk-floors').value || '3', 10)));
  const iduCount = Math.max(12, parseInt(document.getElementById('tk-idu').value || '90', 10));
  const pmFrequency = document.getElementById('tk-pmfreq').value || 'Bulanan';
  const packagePrice = Math.max(10000000, Number(document.getElementById('tk-price').value) || 145000000);

  const protocol = brand === 'Gree GMV' ? 'Eudemon DB -> HTTPS' : brand === 'Daikin VRV' ? 'Modbus TCP -> HTTPS' : 'BACnet IP -> HTTPS';
  const newBldId = 'bld_tk_' + Date.now();
  const codeTag = name.replace(/\W+/g, '').slice(0, 4).toUpperCase() || 'NEW';
  const nowIso = new Date().toISOString();
  const nextPmDate = new Date(Date.now() + (pmFrequency === 'Triwulan' ? 90 : 30) * 86400000).toISOString().slice(0, 10);

  const zoneTemplates = [
    { suffix: 'A', label: 'Zona Kritis / Operasional Utama', targetTemp: 19.5, zoneType: 'critical24', powerKw: 5.4 },
    { suffix: 'B', label: 'Zona Ruang Kerja / Poli / Suite', targetTemp: 23.0, zoneType: 'officeOpd', powerKw: 4.2 },
    { suffix: 'C', label: 'Zona Koridor & Lounge Publik', targetTemp: 23.5, zoneType: 'publicWbp', powerKw: 4.6 }
  ];
  const rooms = [];
  for (let fl = 1; fl <= floorCount; fl++) {
    zoneTemplates.forEach((zt, idx) => {
      const uid = `IDU-${codeTag}-${fl}0${idx + 1}`;
      rooms.push({
        id: `rm_tk_${Date.now()}_${fl}_${idx}`,
        unitId: uid,
        floor: `Lt. ${fl}`,
        name: `${zt.label} Lt. ${fl}`,
        temp: zt.targetTemp,
        targetTemp: zt.targetTemp,
        mode: 'Cool',
        powerKw: zt.powerKw,
        _lastSyncedPowerKw: zt.powerKw,
        status: 'Normal',
        errorCode: null,
        zoneType: zt.zoneType,
        tempHistory6h: [zt.targetTemp + 0.3, zt.targetTemp + 0.2, zt.targetTemp + 0.1, zt.targetTemp, zt.targetTemp, zt.targetTemp]
      });
    });
  }

  const estDailyKwh = Math.round(iduCount * 14.5);
  const newBuilding = {
    id: newBldId,
    name,
    fullName,
    brand,
    gatewayId,
    protocol,
    apiKey: 'cs_live_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36).slice(-4),
    gatewayStatus: 'Online',
    latencyMs: 31,
    iduCount,
    pmFrequency,
    lastPmDate: nowIso.slice(0, 10),
    nextPmDate,
    pmStatus: computePmStatus(nextPmDate),
    baselineMonthlyKwh: estDailyKwh * 38,
    kwh7Days: [estDailyKwh - 40, estDailyKwh - 25, estDailyKwh - 15, estDailyKwh, estDailyKwh + 10, estDailyKwh - 5, estDailyKwh],
    kwhMonthly: estDailyKwh * 30,
    baselineMonthlyMaintRp: 32000000,
    zones: {
      critical24: { label: 'Zona 1 — Kritis / Operasional 24/7', mode: '24 Jam Non-Stop', setpoint: 19.0, locked: true },
      officeOpd: { label: 'Zona 2 — Jam Kerja / Kantor', autoCutoff: true, onTime: '06:30', offTime: '16:30', setpoint: 23.0, weekendAutoOff: true },
      publicWbp: { label: 'Zona 3 — Area Publik & Komersial', setpointGuard: true, minSetpoint: 23.5, wbpLimiter: true }
    },
    rooms
  };
  client.buildings.push(newBuilding);
  if (!client.brands.includes(brand)) client.brands.push(brand);

  // 1. Otomatis terbitkan Work Order Commissioning Gedung Baru
  const commId = nextSeqId(state.tickets, 'WO-COMM-2026', 3, ['id']);
  const cityTech = state.accounts.find((a) => a.role === 'technician' && a.city === client.city && a.techStatus === 'Available')
    || state.accounts.find((a) => a.role === 'technician' && a.city === client.city);
  state.tickets.unshift({
    id: commId,
    ticketType: 'Commissioning',
    slaTargetMinutes: 1440,
    clientId: client.id,
    clientName: client.name,
    clientUsername: client.ownerUsername,
    city: client.city,
    buildingId: newBldId,
    buildingName: name,
    roomId: rooms[0].id,
    roomName: `Instalasi Massal ${floorCount} Lantai (${iduCount} IDU + ODU Rooftop)`,
    floor: `Lt. 1 - Lt. ${floorCount} & Rooftop`,
    unitId: gatewayId,
    brand,
    errorCode: 'COMM',
    status: cityTech ? 'Teknisi Ditugaskan' : 'Menunggu Penugasan',
    assignedTo: cityTech ? cityTech.username : null,
    techAccepted: false,
    checklistDone: {},
    createdAt: nowIso,
    updatedAt: nowIso,
    completedAt: null,
    repairNotes: `Proyek Turnkey Gedung Baru ${fullName}: instalasi ${iduCount} unit IDU ${brand} pada ${floorCount} lantai, integrasi ${gatewayId} (${protocol}), dan aktivasi 3 Zona Smart IoT.`,
    partsUsed: ''
  });
  if (cityTech) {
    cityTech.techStatus = 'On-Duty';
    pushNotification(cityTech.username, `SPK Proyek Gedung Baru [${commId}]`, `Commissioning ${fullName} (${iduCount} IDU ${brand}, ${floorCount} Lantai) di ${client.name}.`, 'info', 'workorders', { type: 'ticket', id: commId });
  }

  // 2. Otomatis terbitkan Quotation RAB Proyek Turnkey
  if (!Array.isArray(state.invoices)) state.invoices = [];
  const qtId = nextSeqId(state.invoices, 'QT-2026', 3, ['id']);
  const cogsTurnkey = Math.round(packagePrice * 0.72);
  const laborFee = 4500000;
  const subtotal = packagePrice + laborFee;
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;
  state.invoices.unshift({
    id: qtId,
    invNumber: null,
    bastNumber: null,
    poNumber: null,
    ticketId: commId,
    revenueCategory: 'Proyek Turnkey',
    clientId: client.id,
    clientName: client.name,
    clientUsername: client.ownerUsername,
    city: client.city,
    buildingName: name,
    roomName: `Paket Turnkey ${floorCount} Lantai (${iduCount} IDU + Gateway)`,
    unitId: gatewayId,
    brand,
    createdBy: acc ? acc.username : 'admin_eka',
    technicianName: cityTech ? cityTech.name : 'Tim Commissioning CoolSync',
    items: [
      {
        partId: 'TURNKEY-PKG',
        name: `Paket Pengadaan, Piping & Edge Gateway ${fullName} (${iduCount} IDU ${brand})`,
        qty: 1,
        unitPrice: packagePrice,
        cogsUnit: cogsTurnkey,
        lineTotal: packagePrice,
        lineCogs: cogsTurnkey,
        isCustom: true
      }
    ],
    laborFee,
    discountType: 'none',
    discountValue: 0,
    discountAmount: 0,
    subtotal,
    ppn,
    grandTotal,
    notes: `RAB Proyek Turnkey Gedung Baru ${fullName} (${floorCount} lantai, ${rooms.length} zona blueprint, ${iduCount} unit IDU) + Kontrak AMC ${pmFrequency}.`,
    revisionNotes: [],
    rejectionReason: null,
    stockDeducted: false,
    stockReleased: false,
    status: 'Menunggu Persetujuan Klien',
    clientPaymentConfirmed: false,
    createdAt: nowIso,
    approvedAt: null,
    invoicedAt: null,
    paidAt: null
  });

  if (acc && acc.role === 'client') {
    clientSelectedBuildingId = newBldId;
  } else {
    floorplanSelectedClientId = client.id;
    floorplanSelectedBuildingId = newBldId;
  }

  pushNotification('admin_eka', `Proyek Gedung Baru: ${name} (${commId})`, `${client.name} — ${iduCount} IDU ${brand} (${floorCount} Lt), Gateway ${gatewayId}, SPK ${commId}, & RAB ${qtId} (${formatRp(grandTotal)}) aktif.`, 'success', 'clients', { type: 'invoice', id: qtId });
  pushNotification('finance_maya', `RAB Proyek Turnkey ${qtId}: ${name}`, `${client.name} (${client.city}) — Nilai proyek ${formatRp(grandTotal)} menunggu persetujuan PO klien.`, 'info', 'finance_billing', { type: 'invoice', id: qtId });
  pushNotification('owner_dist', `Proyek Gedung Baru: ${name} (${client.city})`, `Ekspansi ${iduCount} IDU ${brand} senilai ${formatRp(grandTotal)} untuk ${client.name} resmi terdaftar.`, 'success', 'owner_overview');
  pushNotification(client.ownerUsername, `Proyek Turnkey ${name} Terdaftar (${qtId})`, `Gedung baru & Denah ${floorCount} lantai aktif, SPK Commissioning ${commId} dibuat, serta RAB ${qtId} (${formatRp(grandTotal)}) siap ditinjau.`, 'info', 'billing', { type: 'invoice', id: qtId });
  addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : mode, client.city, `Membuat Proyek Turnkey Gedung Baru ${fullName} (${gatewayId}, ${iduCount} IDU, ${floorCount} lantai) -> SPK ${commId} & RAB ${qtId}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`🏗️ Gedung Baru ${name} (${iduCount} IDU, ${floorCount} Lt) aktif! SPK ${commId} & RAB ${qtId} diterbitkan.`, 'success');
}

/* =========================================================
   MODUL DENAH GEDUNG & LANTAI INTERAKTIF (2D SVG BLUEPRINT)
   ========================================================= */
function isRoomOverusage(room) {
  if (!room || room.status === 'Error' || room.status === 'Standby' || room.mode === 'Off') return false;
  if (room.mode === 'Eco' || room.mode === 'Dry') return false;
  return (room.zoneType !== 'critical24' && Number(room.targetTemp) <= 18.5) || room.isOverusage === true;
}

function getRoomOverusagePct(room) {
  const diff = Math.max(1, 23.5 - Number((room && room.targetTemp) || 18));
  return Math.min(32, Math.max(14, Math.round(diff * 3.3)));
}

function getRoomVisualStatus(room) {
  if (!room) return 'Normal';
  if (room.status === 'Error') return 'Error';
  if (room.status === 'Standby' || room.mode === 'Off') return 'Standby';
  if (isRoomOverusage(room)) return 'Over-Usage';
  return 'Normal';
}

function parseFloorWeight(floorName) {
  const f = String(floorName || '').trim().toUpperCase();
  if (f === 'ROOFTOP') return 1000;
  if (f === 'GF' || f === 'G') return 0.5;
  if (f.startsWith('B')) return -(parseInt(f.slice(1), 10) || 1);
  const m = f.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 1;
}

function getBuildingFloorsMeta(building) {
  const map = new Map();
  (building.rooms || []).forEach((r) => {
    const fk = r.floor || 'Lt. 1';
    if (!map.has(fk)) map.set(fk, []);
    map.get(fk).push(r);
  });
  const sortedKeys = Array.from(map.keys()).sort((a, b) => parseFloorWeight(b) - parseFloorWeight(a));
  const list = [
    {
      floorKey: 'ROOFTOP',
      label: 'Rooftop / Area ODU & Gateway',
      isRooftop: true,
      rooms: [],
      errorCount: building.gatewayStatus === 'Online' ? 0 : 1,
      overusageCount: 0,
      normalCount: building.gatewayStatus === 'Online' ? 1 : 0,
      standbyCount: 0
    }
  ];
  sortedKeys.forEach((fk) => {
    const rooms = map.get(fk) || [];
    let errorCount = 0, overusageCount = 0, normalCount = 0, standbyCount = 0;
    rooms.forEach((r) => {
      const vs = getRoomVisualStatus(r);
      if (vs === 'Error') errorCount++;
      else if (vs === 'Over-Usage') overusageCount++;
      else if (vs === 'Standby') standbyCount++;
      else normalCount++;
    });
    list.push({
      floorKey: fk,
      label: fk === 'GF' ? 'Lantai Dasar (GF)' : fk,
      isRooftop: false,
      rooms,
      errorCount,
      overusageCount,
      normalCount,
      standbyCount
    });
  });
  return list;
}

function jumpToFirstErrorFloor(scopeClientId = null) {
  const clientsPool = scopeClientId
    ? state.clients.filter((c) => c.id === scopeClientId)
    : getFilteredClientsForAdmin();

  for (const c of clientsPool) {
    for (const b of c.buildings) {
      const errRoom = b.rooms.find((r) => getRoomVisualStatus(r) === 'Error');
      if (errRoom) {
        floorplanSelectedClientId = c.id;
        floorplanSelectedBuildingId = b.id;
        clientSelectedBuildingId = b.id;
        floorplanSelectedFloor = errRoom.floor;
        floorplanStatusFilter = 'all';
        renderDashboard();
        showToast(`Lompat ke ${c.name} — ${b.name} (${errRoom.floor}): Unit ${errRoom.unitId} [${errRoom.errorCode}]!`, 'error');
        return;
      }
    }
  }
  showToast('Tidak ada unit AC yang sedang Error pada cakupan ini.', 'success');
}

function optimizeOverusageRoom(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  const oldKw = Number(room.powerKw) || 6.5;
  room.targetTemp = 23.5;
  room.mode = 'Eco';
  room.status = 'Normal';
  room.isOverusage = false;
  room.powerKw = computeRoomRemotePowerKw(room, 'Eco', 23.5);
  if (room.powerKw >= oldKw) room.powerKw = Number((oldKw * 0.64).toFixed(1));
  if (room.temp < 21.0) room.temp = 22.8;
  room.tempHistory6h = [...(room.tempHistory6h || [22.0, 22.0, 22.0, 22.0, 22.0]).slice(1), room.temp];
  syncBuildingKwhFromRooms(bld);

  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'admin', client.city, `Optimasi Eco 23.5°C pada Denah Interaktif: ${client.name} (${bld.name} ${room.floor} - ${room.unitId}) beban turun ${oldKw} kW -> ${room.powerKw} kW.`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`⚡ ${room.unitId} (${room.name}) dioptimalkan ke Eco 23.5°C! Beban turun ${oldKw} kW → ${room.powerKw} kW.`, 'success');
}

function bulkOptimizeOverusage(clientId, buildingId, floorKey = '') {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!client || !bld) return;
  const targets = (bld.rooms || []).filter((r) => (!floorKey || r.floor === floorKey) && getRoomVisualStatus(r) === 'Over-Usage');
  if (targets.length === 0) { showToast('Tidak ada unit Over-Usage pada cakupan ini.', 'info'); return; }

  let savedKw = 0;
  targets.forEach((room) => {
    const oldKw = Number(room.powerKw) || 6.5;
    room.targetTemp = 23.5;
    room.mode = 'Eco';
    room.status = 'Normal';
    room.isOverusage = false;
    room.powerKw = computeRoomRemotePowerKw(room, 'Eco', 23.5);
    if (room.powerKw >= oldKw) room.powerKw = Number((oldKw * 0.64).toFixed(1));
    if (room.temp < 21.0) room.temp = 22.8;
    room.tempHistory6h = [...(room.tempHistory6h || [22.0, 22.0, 22.0, 22.0, 22.0]).slice(1), room.temp];
    savedKw += Math.max(0, oldKw - room.powerKw);
  });
  syncBuildingKwhFromRooms(bld);

  const acc = getCurrentAccount();
  const scopeLbl = floorKey ? `${bld.name} (${floorKey})` : bld.name;
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'admin', client.city, `Bulk Optimasi Over-Usage di ${scopeLbl}: ${targets.length} unit diset Eco 23.5°C (-${savedKw.toFixed(1)} kW).`);
  saveState();
  renderDashboard();
  showToast(`⚡ ${targets.length} unit Over-Usage di ${scopeLbl} dioptimalkan! Total beban turun -${savedKw.toFixed(1)} kW.`, 'success');
}

function bulkEcoFloor(clientId, buildingId, floorKey = '') {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!client || !bld) return;
  const targets = (bld.rooms || []).filter((r) => (!floorKey || r.floor === floorKey) && r.zoneType !== 'critical24' && r.status !== 'Error' && r.status !== 'Standby' && r.mode !== 'Off');
  if (targets.length === 0) { showToast('Tidak ada unit zona non-kritis aktif pada cakupan ini.', 'info'); return; }

  let savedKw = 0;
  targets.forEach((room) => {
    const oldKw = Number(room.powerKw) || 4.5;
    room.targetTemp = Math.max(23.5, Number(room.targetTemp) || 23.5);
    room.mode = 'Eco';
    room.status = 'Normal';
    room.isOverusage = false;
    room.powerKw = computeRoomRemotePowerKw(room, 'Eco', room.targetTemp);
    savedKw += Math.max(0, oldKw - room.powerKw);
  });
  syncBuildingKwhFromRooms(bld);

  const acc = getCurrentAccount();
  const scopeLbl = floorKey ? `${bld.name} (${floorKey})` : bld.name;
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'admin', client.city, `Bulk Eco Mode di ${scopeLbl}: ${targets.length} unit zona non-kritis diaktifkan ke Eco Mode.`);
  saveState();
  renderDashboard();
  showToast(`🌱 ${targets.length} unit non-kritis di ${scopeLbl} beralih ke Eco Mode (hemat ${savedKw.toFixed(1)} kW).`, 'success');
}

  const statusFilter = options.statusFilter || 'all';

  const half = Math.ceil(rooms.length / 2);
  const northRooms = rooms.slice(0, half);
  const southRooms = rooms.slice(half);

  const areaX = 120;
  const areaW = 768;
  const northY = 74;
  const roomH = 148;
  const corridorY = 232;
  const corridorH = 74;
  const southY = 316;

  let roomSvgNodes = '';
  let conduitPaths = '';
  let targetNavPoint = null;

  const drawRow = (rowRooms, rowY, isNorth) => {
    if (!rowRooms.length) return;
    const gap = 12;
    const rw = Math.floor((areaW - gap * (rowRooms.length - 1)) / rowRooms.length);
    rowRooms.forEach((r, idx) => {
      const rx = areaX + idx * (rw + gap);
      const vs = getRoomVisualStatus(r);
      const isMatchFilter = statusFilter === 'all' || vs === statusFilter;
      const isTechTarget = highlightTicket && (highlightTicket.roomId === r.id || highlightTicket.unitId === r.unitId);
      const opacity = highlightTicket ? (isTechTarget ? 1 : 0.45) : (isMatchFilter ? 1 : 0.28);

      const colors = {
        'Error': { stroke: '#f43f5e', fill: '#2c0b16', badgeBg: '#e11d48', badgeText: '#ffffff', tag: `ERR ${r.errorCode || '!'}` },
        'Over-Usage': { stroke: '#f59e0b', fill: '#2a1b06', badgeBg: '#f59e0b', badgeText: '#0f172a', tag: `BOROS +${getRoomOverusagePct(r)}%` },
        'Normal': { stroke: '#10b981', fill: '#0b2429', badgeBg: '#059669', badgeText: '#ffffff', tag: 'NORMAL' },
        'Standby': { stroke: '#64748b', fill: '#131d2d', badgeBg: '#475569', badgeText: '#e2e8f0', tag: 'STANDBY' }
      }[vs];

      const isNarrow = rw < 155;
      const iduW = isNarrow ? 28 : 36;
      const iduH = isNarrow ? 16 : 20;
      const mhW = isNarrow ? 24 : 30;
      const mhH = isNarrow ? 16 : 20;
      const iduX = isNarrow ? rx + rw - 34 : rx + rw - 46;
      const iduY = isNarrow ? rowY + roomH - 22 : (isNorth ? rowY + 14 : rowY + roomH - 36);
      const mhX = isNarrow ? iduX - 28 : iduX - 38;
      const mhY = iduY;
      const doorX = rx + Math.round(rw / 2);
      const doorY = isNorth ? rowY + roomH : rowY;
      const conduitY = isNorth ? corridorY + 18 : corridorY + corridorH - 18;
      const lineStroke = vs === 'Error' ? '#f43f5e' : vs === 'Over-Usage' ? '#f59e0b' : '#2dd4bf';

      conduitPaths += `<path d="M 102 ${conduitY} L ${doorX} ${conduitY} L ${doorX} ${doorY}" fill="none" stroke="${lineStroke}" stroke-width="${isTechTarget ? 3 : 1.7}" stroke-dasharray="${vs === 'Standby' ? '4 4' : 'none'}" opacity="${opacity}"/>`;

      if (isTechTarget) {
        targetNavPoint = { doorX, doorY, iduX: iduX + Math.round(iduW / 2), iduY: iduY + Math.round(iduH / 2), mhX: mhX + Math.round(mhW / 2), mhY: mhY + Math.round(mhH / 2), roomName: r.name, unitId: r.unitId };
      }

      const maxNameChars = Math.max(8, Math.floor((rw - 24) / 6.8));
      const shortName = r.name.length > maxNameChars ? r.name.slice(0, maxNameChars - 1) + '…' : r.name;
      const zoneShort = r.zoneType === 'critical24' ? '24/7' : r.zoneType === 'publicWbp' ? 'Publik' : 'OPD';
      const badgeWidth = isNarrow ? Math.max(38, rw - 34) : Math.max(40, Math.min(108, rw - 115));
      const telemetryY = isNarrow ? rowY + 76 : rowY + 84;
      const telemetryH = isNarrow ? 38 : 50;
      const telemetryW = Math.max(40, rw - 20);

      roomSvgNodes += `
        <g class="cursor-pointer" opacity="${opacity}" onclick="handleBlueprintRoomClick('${client.id}', '${building.id}', '${r.id}')">
          <rect x="${rx}" y="${rowY}" width="${rw}" height="${roomH}" rx="8"
            fill="${colors.fill}" stroke="${isTechTarget ? '#38bdf8' : colors.stroke}"
            stroke-width="${isTechTarget ? 3.5 : vs === 'Error' || vs === 'Over-Usage' ? 2.4 : 1.6}"
            stroke-dasharray="${vs === 'Standby' ? '6 4' : 'none'}"/>

          <!-- Door opening marker -->
          <rect x="${doorX - 14}" y="${doorY - 3}" width="28" height="6" rx="2" fill="#081221" stroke="${colors.stroke}" stroke-width="1.2"/>

          <!-- IDU Indoor Unit + Service Manhole -->
          <rect x="${iduX}" y="${iduY}" width="${iduW}" height="${iduH}" rx="3" fill="#07131e" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="${iduX + Math.round(iduW / 2)}" y="${iduY + (isNarrow ? 11 : 13)}" text-anchor="middle" fill="#7dd3fc" font-size="${isNarrow ? '7.5' : '8.5'}" font-family="JetBrains Mono, monospace" font-weight="700">IDU</text>
          <rect x="${mhX}" y="${mhY}" width="${mhW}" height="${mhH}" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="${mhX + Math.round(mhW / 2)}" y="${mhY + (isNarrow ? 11 : 13)}" text-anchor="middle" fill="#cbd5e1" font-size="${isNarrow ? '7' : '8'}" font-family="JetBrains Mono, monospace">MH</text>

          <!-- Status Pin -->
          <circle cx="${rx + 16}" cy="${rowY + 20}" r="6" fill="${colors.badgeBg}" class="${vs === 'Error' ? 'animate-bp-blink' : ''}"/>
          ${vs === 'Error' ? `<circle cx="${rx + 16}" cy="${rowY + 20}" r="11" fill="none" stroke="#fb7185" stroke-width="1.5" class="animate-bp-blink"/>` : ''}
          <rect x="${rx + 28}" y="${rowY + 11}" width="${badgeWidth}" height="18" rx="4" fill="${colors.badgeBg}"/>
          <text x="${rx + 33}" y="${rowY + 23}" fill="${colors.badgeText}" font-size="${isNarrow ? '8' : '9.5'}" font-family="JetBrains Mono, monospace" font-weight="700">${escapeHtml(colors.tag)}</text>

          <!-- Room Info -->
          <text x="${rx + 12}" y="${rowY + (isNarrow ? 48 : 54)}" fill="#f8fafc" font-size="${isNarrow ? '10.5' : '12'}" font-family="Inter, sans-serif" font-weight="700">${escapeHtml(shortName)}</text>
          <text x="${rx + 12}" y="${rowY + (isNarrow ? 64 : 72)}" fill="#94a3b8" font-size="${isNarrow ? '8.5' : '10'}" font-family="JetBrains Mono, monospace">${escapeHtml(r.unitId)} &bull; ${zoneShort}</text>

          <!-- Telemetry Readout -->
          <rect x="${rx + 10}" y="${telemetryY}" width="${telemetryW}" height="${telemetryH}" rx="6" fill="#060f1a" stroke="#1e293b"/>
          <text x="${rx + 16}" y="${telemetryY + (isNarrow ? 16 : 21)}" fill="${vs === 'Error' ? '#fda4af' : vs === 'Over-Usage' ? '#fcd34d' : '#5eead4'}" font-size="${isNarrow ? '10.5' : '13'}" font-family="JetBrains Mono, monospace" font-weight="700">${r.temp}°C &rarr; ${Number(r.targetTemp).toFixed(1)}°C</text>
          <text x="${rx + 16}" y="${telemetryY + (isNarrow ? 30 : 39)}" fill="#cbd5e1" font-size="${isNarrow ? '8.5' : '10'}" font-family="Inter, sans-serif">${escapeHtml(r.mode)} &bull; ${r.powerKw} kW ${!isNarrow && vs === 'Error' ? '&bull; Cek Manhole' : ''}</text>
        </g>
      `;
    });
  };

  drawRow(northRooms, northY, true);
  drawRow(southRooms, southY, false);

  let navRouteOverlay = '';
  if (highlightTicket && targetNavPoint) {
    const midY = corridorY + Math.round(corridorH / 2);
    navRouteOverlay = `
      <path d="M 65 ${midY} L ${targetNavPoint.doorX} ${midY} L ${targetNavPoint.doorX} ${targetNavPoint.doorY} L ${targetNavPoint.mhX} ${targetNavPoint.mhY}"
        fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8 6" class="animate-dash-march"/>
      <circle cx="65" cy="${midY}" r="8" fill="#22d3ee" stroke="#081221" stroke-width="2"/>
      <circle cx="${targetNavPoint.mhX}" cy="${targetNavPoint.mhY}" r="9" fill="#f43f5e" stroke="#facc15" stroke-width="2.5" class="animate-bp-blink"/>
      <rect x="${Math.min(680, Math.max(130, targetNavPoint.doorX - 85))}" y="${midY - 14}" width="175" height="22" rx="6" fill="#facc15"/>
      <text x="${Math.min(680, Math.max(130, targetNavPoint.doorX - 85)) + 87}" y="${midY + 1}" text-anchor="middle" fill="#0f172a" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">RUTE TEKNISI &rarr; ${escapeHtml(targetNavPoint.unitId)}</text>
    `;
  }

  return `
    <svg viewBox="0 0 920 512" class="w-full h-auto block select-none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="bpGridFloor" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#132944" stroke-width="0.75"/>
        </pattern>
      </defs>
      <rect width="920" height="512" fill="#081221"/>
      <rect width="920" height="512" fill="url(#bpGridFloor)"/>

      <!-- Outer Architectural Wall & Reference Grid -->
      <rect x="18" y="18" width="884" height="476" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
      <text x="30" y="42" fill="#7dd3fc" font-size="11" font-family="JetBrains Mono, monospace" font-weight="700">DENAH ARSITEKTUR &mdash; ${escapeHtml(building.name.toUpperCase())} (${escapeHtml(floorMeta.label.toUpperCase())})</text>
      <text x="30" y="58" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">GATEWAY: ${escapeHtml(building.gatewayId)} (${escapeHtml(building.protocol)}) &bull; WING UTARA / KORIDOR / WING SELATAN</text>
      <text x="886" y="42" text-anchor="end" fill="#5eead4" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">N &#8593; &bull; SKALA 1:150</text>

      <!-- Left Riser Column: Shaft Pipa, Service Entrance, MCB -->
      <rect x="28" y="74" width="76" height="148" rx="8" fill="#0c1d30" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="66" y="112" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">SHAFT</text>
      <text x="66" y="128" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Inter, sans-serif">Pipa Freon</text>
      <text x="66" y="142" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Inter, sans-serif">&amp; CAN Bus</text>
      <text x="66" y="160" text-anchor="middle" fill="#2dd4bf" font-size="8.5" font-family="JetBrains Mono, monospace">Modbus</text>

      <rect x="28" y="232" width="76" height="74" rx="8" fill="#0d2532" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="66" y="258" text-anchor="middle" fill="#22d3ee" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="700">ENTRANCE</text>
      <text x="66" y="274" text-anchor="middle" fill="#e2e8f0" font-size="8" font-family="Inter, sans-serif">Tangga / Akses</text>
      <text x="66" y="287" text-anchor="middle" fill="#e2e8f0" font-size="8" font-family="Inter, sans-serif">Servis Teknisi</text>

      <rect x="28" y="316" width="76" height="148" rx="8" fill="#131c2e" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="66" y="366" text-anchor="middle" fill="#fbbf24" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">PANEL MCB</text>
      <text x="66" y="382" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-family="Inter, sans-serif">Sub-Distribusi</text>
      <text x="66" y="396" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-family="Inter, sans-serif">${escapeHtml(floorMeta.floorKey)}</text>

      <!-- Central Corridor -->
      <rect x="114" y="232" width="778" height="74" rx="8" fill="#0b1728" stroke="#1e3a5f" stroke-width="1.5"/>
      <line x1="126" y1="269" x2="880" y2="269" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="10 6"/>
      <text x="500" y="273" text-anchor="middle" fill="#475569" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">KORIDOR UTAMA &bull; JALUR KABEL CAN BUS / MODBUS &amp; PIPA REFRIGERANT</text>

      <!-- Conduit Paths -->
      ${conduitPaths}

      <!-- Rooms -->
      ${roomSvgNodes}

      <!-- Technician Navigation Overlay -->
      ${navRouteOverlay}

      <!-- Footer Legend -->
      <text x="30" y="484" fill="#94a3b8" font-size="9.5" font-family="Inter, sans-serif">Keterangan: IDU = Unit Indoor AC &bull; MH = Service Manhole Plafon &bull; Klik ruangan mana saja untuk inspeksi / kontrol IoT / optimasi Eco</text>
    </svg>
  `;
}

function handleBlueprintRoomClick(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const vs = getRoomVisualStatus(room);
  if (vs === 'Error') openBlueprintErrorModal(clientId, buildingId, roomId);
  else if (vs === 'Over-Usage') openBlueprintOverusageModal(clientId, buildingId, roomId);
  else openRoomDetailModal(clientId, buildingId, roomId);
}

              ${sameCityTechs.map((t) => {
                const certMatch = (t.brands || []).includes(bld.brand);

                return `<option value="${t.username}" ${ticket.assignedTo === t.username ? 'selected' : ''}>${escapeHtml(t.name)} [${escapeHtml(t.techStatus)}] &bull; ${certMatch ? '✓ Sertifikasi ' + escapeHtml(bld.brand) : '⚠ Lintas Merek'} &bull; ${activeCount} WO</option>`;

function assignTechnicianFromBlueprint(ticketId) {
  const sel = document.getElementById('bp-dispatch-tech');
  if (!sel || !sel.value) return;
  closeModal();
  assignTechnician(ticketId, sel.value);
}

function openBlueprintOverusageModal(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const overPct = getRoomOverusagePct(room);
  const ecoKw = computeRoomRemotePowerKw(room, 'Eco', 23.5);

      <div class="rounded-xl bg-amber-50 border border-amber-200 p-4 text-xs text-amber-950 leading-relaxed">

        <div class="rounded-xl bg-slate-50 border border-slate-200 p-3">
          <div class="text-[10px] text-slate-500">Kondisi Saat Ini (Boros)</div>
          <div class="text-base font-extrabold text-amber-700 mt-0.5">${Number(room.targetTemp).toFixed(1)}°C &bull; ${room.powerKw} kW</div>

        <div class="rounded-xl bg-emerald-50 border border-emerald-200 p-3">
          <div class="text-[10px] text-emerald-700">Target Optimasi Eco Mode</div>
          <div class="text-base font-extrabold text-emerald-700 mt-0.5">23.5°C &bull; ${ecoKw} kW</div>
          <div class="text-[10px] text-emerald-700 font-semibold mt-0.5">Hemat ~${formatRp(savedRpMonth)}/bln</div>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="openRoomDetailModal('${client.id}', '${bld.id}', '${room.id}')" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Kontrol Manual &amp; Grafik</button>
        <button type="button" onclick="optimizeOverusageRoom('${client.id}', '${bld.id}', '${room.id}')" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold shadow-sm transition">⚡ Optimalkan Suhu / Aktifkan Eco 23.5°C</button>
      </div>
    </div>
  `, 'max-w-lg');
