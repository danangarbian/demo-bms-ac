let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.clients)) {
        const seed = createSeedState();
        if (!Array.isArray(parsed.invoices)) parsed.invoices = seed.invoices;
        if (!Array.isArray(parsed.installRequests)) parsed.installRequests = seed.installRequests;
        if (!parsed.roiSim) parsed.roiSim = seed.roiSim;
        parsed.clients.forEach((c) => {
          const seedC = seed.clients.find((sc) => sc.id === c.id);
          (c.buildings || []).forEach((b) => {
            const seedB = seedC && seedC.buildings.find((sb) => sb.id === b.id);
            if (!b.baselineMonthlyKwh) b.baselineMonthlyKwh = seedB ? seedB.baselineMonthlyKwh : Math.round((b.kwhMonthly || 35000) / 0.75);
            if (!b.baselineMonthlyMaintRp) b.baselineMonthlyMaintRp = seedB ? seedB.baselineMonthlyMaintRp : 28000000;
            if (!b.zones) {
              b.zones = seedB ? JSON.parse(JSON.stringify(seedB.zones)) : {
                critical24: { label: 'Zona 1 — Kritis / Operasional 24/7 (IGD, OK, ICU, Server)', mode: '24 Jam Non-Stop', setpoint: 19.0, locked: true },
                officeOpd: { label: 'Zona 2 — Jam Kerja / Rawat Jalan (Poli, Admin, Rapat)', autoCutoff: true, onTime: '06:30', offTime: '16:30', setpoint: 23.0, weekendAutoOff: true },
                publicWbp: { label: 'Zona 3 — Area Publik & Komersial (Atrium, Ballroom, Lobby)', setpointGuard: true, minSetpoint: 23.5, wbpLimiter: true }
              };
            } else if (b.zones.officeOpd && b.zones.officeOpd.weekendAutoOff === undefined) {
              b.zones.officeOpd.weekendAutoOff = true;
              b.zones.officeOpd.onTime = b.zones.officeOpd.onTime || b.zones.officeOpd.preCoolTime || '06:30';
              b.zones.officeOpd.offTime = b.zones.officeOpd.offTime || b.zones.officeOpd.cutoffTime || '16:30';
            }
            (b.rooms || []).forEach((r) => {
              const seedR = seedB && seedB.rooms.find((sr) => sr.id === r.id);
              if (!r.zoneType) r.zoneType = seedR ? seedR.zoneType : 'officeOpd';
            });
            if (!parsed.floorplanRoomsEnriched && seedB && Array.isArray(seedB.rooms)) {
              const existingIds = new Set((b.rooms || []).map((r) => r.id));
              seedB.rooms.forEach((sr) => {
                if (!existingIds.has(sr.id)) b.rooms.push(JSON.parse(JSON.stringify(sr)));
              });
            }
          });
        });
        parsed.floorplanRoomsEnriched = true;
        return parsed;
      }
    }
  } catch (e) {
    console.warn('Gagal membaca localStorage, memuat seed state:', e);
  }
  const seed = createSeedState();
  seed.floorplanRoomsEnriched = true;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
  return seed;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Gagal menyimpan state:', e);
  }
}

function resetDemoData() {
  state = createSeedState();
  state.floorplanRoomsEnriched = true;
  saveState();
  chatbotMessages = [];
  chatbotInitializedForUser = null;
  activeLoginRoleTab = 'all';
  floorplanSelectedClientId = '';
  floorplanSelectedBuildingId = '';
  floorplanSelectedFloor = '';
  floorplanStatusFilter = 'all';
  clientUnitsViewMode = 'blueprint';
  closeModal();
  renderLoginView();
  showToast('Data demo berhasil direset ke kondisi awal presentasi.', 'success');
}

function getCurrentAccount() {
  if (!state.currentUser) return null;
  return state.accounts.find((a) => a.username === state.currentUser) || null;
}

function addAuditLog(actor, role, city, action) {
  state.auditLogs.unshift({
    id: 'log_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    timestamp: new Date().toISOString(),
    actor, role, city, action
  });
  if (state.auditLogs.length > 60) state.auditLogs.length = 60;
}

function pushNotification(targetUser, title, message, severity, targetTab) {
  state.notifications.unshift({
    id: 'notif_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    targetUser,
    title,
    message,
    severity: severity || 'info',
    targetTab: targetTab || '',
    read: false,
    createdAt: new Date().toISOString()
  });
}

function lookupErrorRule(brand, code) {
  return state.errorDictionary.find((d) => d.brand === brand && d.code === code) || {
    brand, code,
    factoryMeaning: 'General System Fault (' + code + ')',
    humanTranslation: 'Unit AC central mengalami gangguan operasional dan memerlukan pengecekan teknisi.',

    estDuration: '60 menit',
    severity: 'Tinggi',
    checklist: ['Multimeter Digital', 'Manifold Gauge', 'Tool Kit Standar']
  };
}

function getAllBuildingsFlat() {
  const list = [];
  state.clients.forEach((c) => c.buildings.forEach((b) => list.push({ client: c, building: b })));
  return list;
}

function getUnreadCountForUser(username) {
  return state.notifications.filter((n) => n.targetUser === username && !n.read).length;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function formatRp(num) {
  return 'Rp ' + Math.round(num).toLocaleString('id-ID');
}

function formatRpShort(num) {
  const n = Math.round(num);
  if (n >= 1000000000) return 'Rp ' + (n / 1000000000).toFixed(2).replace('.', ',') + ' M';
  if (n >= 1000000) return 'Rp ' + (n / 1000000).toFixed(1).replace('.', ',') + ' Jt';
  return formatRp(n);
}

function computeBuildingSavings(building, simOverride) {
  const sim = simOverride || state.roiSim || { setpointBoostC: 2.0, cutHoursPerDay: 3.0, wbpMode: true };
  const z = building.zones || {
    critical24: { mode: '24 Jam Non-Stop', setpoint: 19.0, locked: true },
    officeOpd: { autoCutoff: true, onTime: '06:30', offTime: '16:30', setpoint: 23.0, weekendAutoOff: true },
    publicWbp: { setpointGuard: true, minSetpoint: 23.5, wbpLimiter: true }
  };

  const baselineKwhMonth = building.baselineMonthlyKwh || Math.round((building.kwhMonthly || 35000) / 0.75);
  const baselineEnergyRpMonth = baselineKwhMonth * ELECTRIC_TARIFF_RP;
  const baselineMaintRpMonth = building.baselineMonthlyMaintRp || 28000000;
  const baselineTotalOverheadMonth = baselineEnergyRpMonth + baselineMaintRpMonth;

  const weekendBonus = (z.officeOpd.autoCutoff && z.officeOpd.weekendAutoOff) ? 0.015 : 0;
  const autoCutoffPct = z.officeOpd.autoCutoff ? (0.038 + 0.019 * sim.cutHoursPerDay + weekendBonus) : 0;
  const minSpBonus = Math.max(0, ((z.publicWbp.minSetpoint || 23.5) - 23.5) * 0.015);
  const setpointGuardPct = z.publicWbp.setpointGuard ? (0.030 + 0.030 * sim.setpointBoostC + minSpBonus) : 0;
  const wbpPct = (z.publicWbp.wbpLimiter && sim.wbpMode) ? 0.060 : 0;

  const totalEnergyReductionRatio = Math.min(0.36, autoCutoffPct + setpointGuardPct + wbpPct);
  const kwhReductionRatio = Math.min(0.32, autoCutoffPct + setpointGuardPct + wbpPct * 0.72);

  const savedKwhMonth = Math.round(baselineKwhMonth * kwhReductionRatio);
  const actualKwhMonth = Math.max(0, baselineKwhMonth - savedKwhMonth);
  const energySavedRpMonth = Math.round(baselineEnergyRpMonth * totalEnergyReductionRatio);

  const preventiveFactor = 0.115 + (z.officeOpd.autoCutoff ? 0.04 : 0) + (z.officeOpd.weekendAutoOff ? 0.01 : 0) + (z.publicWbp.setpointGuard ? 0.035 : 0) + (z.publicWbp.wbpLimiter ? 0.015 : 0);
  const avoidedCompressorOverhaulRpMonth = Math.round(baselineMaintRpMonth * preventiveFactor);
  const pmContractEfficiencyRpMonth = Math.round(baselineMaintRpMonth * 0.11);

  const totalSavedRpMonth = energySavedRpMonth + avoidedCompressorOverhaulRpMonth + pmContractEfficiencyRpMonth;
  const totalSavedRpYear = totalSavedRpMonth * 12;
  const overheadReductionPct = baselineTotalOverheadMonth > 0 ? Number(((totalSavedRpMonth / baselineTotalOverheadMonth) * 100).toFixed(1)) : 0;

  return {
    baselineKwhMonth,
    actualKwhMonth,
    savedKwhMonth,
    savedKwhYear: savedKwhMonth * 12,
    baselineEnergyRpMonth,
    baselineMaintRpMonth,
    baselineTotalOverheadMonth,
    energySavedRpMonth,
    avoidedCompressorOverhaulRpMonth,
    pmContractEfficiencyRpMonth,
    totalSavedRpMonth,
    totalSavedRpYear,
    postBmsOverheadMonth: Math.max(0, baselineTotalOverheadMonth - totalSavedRpMonth),
    overheadReductionPct,
    kwhReductionPct: Number((kwhReductionRatio * 100).toFixed(1))
  };
}

function computeScopeROI(buildings) {
  let baselineKwhMonth = 0, actualKwhMonth = 0, savedKwhMonth = 0;
  let baselineEnergyRpMonth = 0, baselineMaintRpMonth = 0, baselineTotalOverheadMonth = 0;
  let energySavedRpMonth = 0, avoidedCompressorOverhaulRpMonth = 0, pmContractEfficiencyRpMonth = 0;

  buildings.forEach((b) => {
    const s = computeBuildingSavings(b);
    baselineKwhMonth += s.baselineKwhMonth;
    actualKwhMonth += s.actualKwhMonth;
    savedKwhMonth += s.savedKwhMonth;
    baselineEnergyRpMonth += s.baselineEnergyRpMonth;
    baselineMaintRpMonth += s.baselineMaintRpMonth;
    baselineTotalOverheadMonth += s.baselineTotalOverheadMonth;
    energySavedRpMonth += s.energySavedRpMonth;
    avoidedCompressorOverhaulRpMonth += s.avoidedCompressorOverhaulRpMonth;
    pmContractEfficiencyRpMonth += s.pmContractEfficiencyRpMonth;
  });

  const totalSavedRpMonth = energySavedRpMonth + avoidedCompressorOverhaulRpMonth + pmContractEfficiencyRpMonth;
  const totalSavedRpYear = totalSavedRpMonth * 12;
  const overheadReductionPct = baselineTotalOverheadMonth > 0 ? Number(((totalSavedRpMonth / baselineTotalOverheadMonth) * 100).toFixed(1)) : 0;
  const estCapexRp = Math.max(1, buildings.length) * 42000000;
  const paybackMonths = totalSavedRpMonth > 0 ? Number((estCapexRp / totalSavedRpMonth).toFixed(1)) : 0;

  return {
    buildingCount: buildings.length,
    baselineKwhMonth,
    actualKwhMonth,
    savedKwhMonth,
    savedKwhYear: savedKwhMonth * 12,
    baselineEnergyRpMonth,
    baselineMaintRpMonth,
    baselineTotalOverheadMonth,
    energySavedRpMonth,
    avoidedCompressorOverhaulRpMonth,
    pmContractEfficiencyRpMonth,
    totalSavedRpMonth,
    totalSavedRpYear,
    postBmsOverheadMonth: Math.max(0, baselineTotalOverheadMonth - totalSavedRpMonth),
    overheadReductionPct,
    paybackMonths
  };
}

function formatTimeAgo(iso) {
  if (!iso) return '-';
  const diffSec = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (diffSec < 60) return 'Baru saja';
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + ' mnt lalu';
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return diffHour + ' jam lalu';
  return Math.floor(diffHour / 24) + ' hari lalu';
}

function formatDateTime(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const id = 'toast_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const styles = {
    success: 'bg-emerald-900 text-white border-emerald-700',
    error: 'bg-rose-900 text-white border-rose-700',
    warning: 'bg-amber-900 text-white border-amber-700',
    info: 'bg-slate-900 text-white border-slate-700'
  };
  const icons = { success: 'check-circle-2', error: 'alert-octagon', warning: 'alert-triangle', info: 'info' };
  const el = document.createElement('div');
  el.id = id;
  el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl border shadow-xl text-xs font-medium animate-slide-up ${styles[type] || styles.info}`;
  el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i><span class="flex-1 leading-relaxed">${escapeHtml(message)}</span>`;
  container.appendChild(el);
  if (window.lucide) lucide.createIcons({ root: el });
  setTimeout(() => { const t = document.getElementById(id); if (t) t.remove(); }, 3800);
}

function openModal(htmlContent, maxWidthClass = 'max-w-lg') {

  root.classList.add('flex');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
  if (window.lucide) lucide.createIcons({ root });
}

  root.classList.add('hidden');
  root.classList.remove('flex');
  root.innerHTML = '';
  destroyChart('modalRoomTempChart');
}

function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}

function destroyAllCharts() {
  Object.keys(chartInstances).forEach((k) => { if (chartInstances[k]) chartInstances[k].destroy(); });
  chartInstances = {};
}

function renderChart(canvasId, config) {
  destroyChart(canvasId);
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return null;
  chartInstances[canvasId] = new Chart(canvas.getContext('2d'), config);
  return chartInstances[canvasId];
}

function copyToClipboard(text, label = 'Teks') {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(`${label} berhasil disalin ke clipboard.`, 'success')).catch(() => fallbackCopy(text, label));
  } else {
    fallbackCopy(text, label);
  }
}

function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  showToast(`${label} berhasil disalin.`, 'success');
}

function handleLoginSubmit(e) {
  e.preventDefault();

  const password = document.getElementById('login-password').value;
  if (!username || !password) {
    showLoginError('Username dan password wajib diisi.');
    return;
  }
  const acc = state.accounts.find((a) => a.username === username && a.password === password);
  if (!acc) {
    showLoginError('Username atau password tidak sesuai. Klik "Lihat Panduan Akun Demo" di bawah untuk daftar kredensial.');

  document.getElementById('login-username').value = acc.username;
  document.getElementById('login-password').value = acc.password;
  clearLoginError();
  closeModal();
  showToast(`Kredensial ${acc.name} diisi ke form login.`, 'info');
}

function autoLoginAccount(username) {
  clearLoginError();
  closeModal();
  loginAs(username);
}

function loginAs(username) {
  const acc = state.accounts.find((a) => a.username === username);
  if (!acc) return;
  state.currentUser = acc.username;
  addAuditLog(acc.username, acc.role, acc.city, `Login ke dashboard sebagai ${acc.name} (${acc.role}).`);
  saveState();

  const defaultTabs = { superadmin: 'overview', admin: 'executive', client: 'overview', technician: 'workorders' };
  currentTab = defaultTabs[acc.role] || 'overview';
  clientSelectedBuildingId = '';
  clientRoomStatusFilter = 'all';
  floorplanSelectedClientId = '';
  floorplanSelectedBuildingId = '';
  floorplanSelectedFloor = '';
  floorplanStatusFilter = 'all';
  enterDashboard();
  showToast(`Selamat datang, ${acc.name}!`, 'success');
}

function logout() {
  const acc = getCurrentAccount();
  if (acc) addAuditLog(acc.username, acc.role, acc.city, 'Logout dari sesi dashboard.');
  state.currentUser = null;
  saveState();
  destroyAllCharts();
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('chatbot-container').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');

function submitSimulateError(e) {
  e.preventDefault();
  const targetClientId = document.getElementById('sim-client-select').value;
  let candidates = [];
  state.clients.forEach((c) => {
    if (targetClientId !== 'random' && c.id !== targetClientId) return;
    c.buildings.forEach((b) => b.rooms.forEach((r) => { if (r.status !== 'Error') candidates.push({ client: c, building: b, room: r }); }));
  });
  if (candidates.length === 0) { showToast('Semua ruangan pada target yang dipilih sudah berstatus Error.', 'warning'); return; }

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const brandRules = state.errorDictionary.filter((d) => d.brand === pick.building.brand);
  const rule = brandRules.length > 0 ? brandRules[Math.floor(Math.random() * brandRules.length)] : state.errorDictionary[0];

  pick.room.status = 'Error';
  pick.room.errorCode = rule.code;
  pick.room.mode = 'Cool';
  pick.room.temp = Number((pick.room.targetTemp + 5.8 + Math.random() * 2.2).toFixed(1));
  pick.room.tempHistory6h = [
    pick.room.targetTemp,
    Number((pick.room.targetTemp + 0.8).toFixed(1)),
    Number((pick.room.targetTemp + 2.1).toFixed(1)),
    Number((pick.room.targetTemp + 3.6).toFixed(1)),
    Number((pick.room.targetTemp + 4.9).toFixed(1)),
    pick.room.temp
  ];

  const woNum = 'WO-2026-' + String(state.tickets.length + 1).padStart(3, '0');
  const nowIso = new Date().toISOString();
  state.tickets.unshift({
    id: woNum, clientId: pick.client.id, clientName: pick.client.name, clientUsername: pick.client.ownerUsername,
    city: pick.client.city, buildingId: pick.building.id, buildingName: pick.building.name, roomId: pick.room.id,
    roomName: pick.room.name, floor: pick.room.floor, unitId: pick.room.unitId, brand: pick.building.brand,
    errorCode: rule.code, status: 'Menunggu Penugasan', assignedTo: null, techAccepted: false, checklistDone: {},
    createdAt: nowIso, updatedAt: nowIso, completedAt: null, repairNotes: '', partsUsed: ''
  });

  pushNotification(pick.client.ownerUsername, `Gangguan Pendinginan ${pick.room.name} (${pick.building.name} ${pick.room.floor})`, `${rule.humanTranslation} Tiket ${woNum} otomatis dikirim ke distributor.`, 'error', 'tickets');
  pushNotification('admin_eka', `Error Baru [${pick.client.city}]: ${pick.client.name} (${rule.code})`, `${pick.building.name} - ${pick.room.name} mengalami ${rule.factoryMeaning}. Siap ditugaskan ke teknisi ${pick.client.city}.`, 'error', 'errors');
  pushNotification('superadmin', `Alert Gateway ${pick.building.gatewayId} (${pick.building.brand})`, `Kode error ${rule.code} terdeteksi di ${pick.client.name} (${pick.client.city}).`, 'warning', 'overview');

  const actorAcc = getCurrentAccount();
  addAuditLog(actorAcc ? actorAcc.username : 'system', actorAcc ? actorAcc.role : 'System', pick.client.city, `Simulasi error baru ${woNum}: ${pick.client.name} (${pick.building.name} - ${pick.room.name}) [${pick.building.brand} ${rule.code}].`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Simulasi Error ${woNum} (${rule.code}) berhasil dipicu di ${pick.client.name}!`, 'error');
}

function pingAllGateways() {
  let onlineCount = 0;
  state.clients.forEach((c) => c.buildings.forEach((b) => {
    if (b.gatewayStatus === 'Online') {
      b.latencyMs = 24 + Math.floor(Math.random() * 35);
      onlineCount++;
    }
  }));
  addAuditLog('superadmin', 'superadmin', 'Global', `Melakukan Refresh Ping ke 11 Edge Gateway (${onlineCount}/11 merespons).`);
  saveState();
  renderDashboard();
  showToast(`Ping selesai: ${onlineCount}/11 Edge Gateway Online.`, 'success');
}

function toggleGatewayStatus(clientId, buildingId) {
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  const bld = client.buildings.find((b) => b.id === buildingId);
  if (!bld) return;
  if (bld.gatewayStatus === 'Online') {
    bld.gatewayStatus = 'Offline';
    bld.latencyMs = 0;
    addAuditLog('superadmin', 'superadmin', client.city, `Simulasi gateway ${bld.gatewayId} (${client.name} - ${bld.name}) menjadi Offline.`);
    showToast(`${bld.gatewayId} disimulasikan Offline.`, 'warning');
  } else {
    bld.gatewayStatus = 'Online';
    bld.latencyMs = 28 + Math.floor(Math.random() * 25);
    addAuditLog('superadmin', 'superadmin', client.city, `Gateway ${bld.gatewayId} (${client.name} - ${bld.name}) kembali Online (${bld.latencyMs} ms).`);
    showToast(`${bld.gatewayId} kembali Online.`, 'success');
  }
  saveState();
  renderDashboard();
}

function submitAddErrorRule(e) {
  e.preventDefault();
  const brand = document.getElementById('rule-brand').value;
  const code = document.getElementById('rule-code').value.trim().toUpperCase();
  const factoryMeaning = document.getElementById('rule-factory').value.trim();
  const humanTranslation = document.getElementById('rule-human').value.trim();
  const recommendedPart = document.getElementById('rule-part').value.trim();
  const estDuration = document.getElementById('rule-duration').value.trim();

  if (state.errorDictionary.some((d) => d.brand === brand && d.code === code)) {
    showToast(`Kode ${code} untuk ${brand} sudah ada di kamus.`, 'warning');
    return;
  }

  state.errorDictionary.unshift({
    id: 'err_' + Date.now(),
    brand, code, factoryMeaning, humanTranslation, recommendedPart, estDuration, severity: 'Tinggi',
    checklist: [recommendedPart, 'Multimeter Digital', 'Tool Kit Standar']
  });
  addAuditLog('superadmin', 'superadmin', 'Global', `Menambahkan aturan kamus error ${brand} [${code}] (${factoryMeaning}).`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Aturan kode error ${brand} [${code}] berhasil ditambahkan.`, 'success');
}

function deleteErrorRule(ruleId) {
  const idx = state.errorDictionary.findIndex((d) => d.id === ruleId);
  if (idx === -1) return;
  const removed = state.errorDictionary[idx];
  state.errorDictionary.splice(idx, 1);
  addAuditLog('superadmin', 'superadmin', 'Global', `Menghapus aturan kamus error ${removed.brand} [${removed.code}].`);
  saveState();
  renderDashboard();
  showToast(`Aturan ${removed.brand} [${removed.code}] dihapus.`, 'info');
}

function toggleBuildingZoneSetting(buildingId, zoneKey, fieldKey) {

}

function updateBuildingZoneScheduleField(buildingId, zoneKey, fieldKey, value) {
  let targetBld = null, targetClient = null;
  state.clients.forEach((c) => c.buildings.forEach((b) => { if (b.id === buildingId) { targetBld = b; targetClient = c; } }));
  if (!targetBld || !targetBld.zones || !targetBld.zones[zoneKey]) return;
  targetBld.zones[zoneKey][fieldKey] = (fieldKey === 'minSetpoint' || fieldKey === 'setpoint') ? Number(value) : value;
  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', targetClient ? targetClient.city : 'Global', `Memperbarui parameter jadwal ${targetBld.name} (${zoneKey}.${fieldKey} = ${value}).`);
  saveState();
  renderDashboard();
  showToast(`Parameter jadwal ${targetBld.name} disimpan ke Edge Gateway.`, 'info');
}

function updateRoiSimParam(key, val) {
  if (!state.roiSim) state.roiSim = { setpointBoostC: 2.0, cutHoursPerDay: 3.0, wbpMode: true };
  if (key === 'wbpMode') state.roiSim.wbpMode = !state.roiSim.wbpMode;
  else state.roiSim[key] = Number(val);
  saveState();
  renderDashboard();
}

function applyAllSmartZones(isAdminScope, enableAll) {
  const buildings = isAdminScope
    ? getFilteredClientsForAdmin().flatMap((c) => c.buildings)
    : (getClientRecordForAccount(getCurrentAccount())?.buildings || []);
  buildings.forEach((b) => {
    if (!b.zones) return;
    b.zones.officeOpd.autoCutoff = enableAll;
    b.zones.officeOpd.weekendAutoOff = enableAll;
    b.zones.publicWbp.setpointGuard = enableAll;
    b.zones.publicWbp.wbpLimiter = enableAll;
  });
  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', acc ? acc.city : 'Global', `${enableAll ? 'Mengaktifkan' : 'Menonaktifkan'} seluruh mode hemat Smart IoT Scheduling pada ${buildings.length} gedung.`);
  saveState();
  renderDashboard();
  showToast(enableAll ? 'Seluruh fitur Smart IoT Scheduling AC diaktifkan!' : 'Mode Smart IoT dinonaktifkan untuk perbandingan baseline.', enableAll ? 'success' : 'warning');
}

function assignTechnician(ticketId, forcedTechUsername = null) {
  const t = state.tickets.find((x) => x.id === ticketId);
  if (!t) return;
  const selectEl = document.getElementById('dispatch-select-' + ticketId);
  const techUsername = forcedTechUsername || (selectEl ? selectEl.value : null);
  if (!techUsername) return;
  const tech = state.accounts.find((a) => a.username === techUsername && a.role === 'technician');
  if (!tech) return;

  if (tech.city !== t.city) {
    showToast(`Penugasan ditolak: Teknisi ${tech.name} berada di ${tech.city}, sedangkan klien berada di ${t.city}.`, 'error');
    return;
  }

  t.assignedTo = tech.username;
  t.status = 'Teknisi Ditugaskan';
  t.techAccepted = false;
  t.updatedAt = new Date().toISOString();
  tech.techStatus = 'On-Duty';

  const rule = lookupErrorRule(t.brand, t.errorCode);
  pushNotification(tech.username, `Tugas Baru [${t.id}]: ${t.clientName}`, `${t.buildingName} ${t.floor} - ${t.roomName} (${t.brand} ${t.errorCode}). Segera konfirmasi Terima Tugas.`, 'warning', 'workorders');
  pushNotification(t.clientUsername, `Teknisi Ditugaskan untuk ${t.roomName}`, `Teknisi ${tech.name} (${tech.phone}) telah ditugaskan menangani keluhan pendinginan (${rule.estDuration}).`, 'info', 'tickets');
  addAuditLog('admin_eka', 'admin', t.city, `Menugaskan ${tech.name} (${tech.username}) untuk ${t.id} di ${t.clientName}.`);

  saveState();
  renderDashboard();
  showToast(`${tech.name} berhasil ditugaskan untuk ${t.id}!`, 'success');
}

function computeRoomRemotePowerKw(room, newMode, newTargetTemp) {
  if (!room._basePowerKw) room._basePowerKw = room.powerKw > 0.8 ? room.powerKw : 4.8;
  if (newMode === 'Off') return 0.3;
  const base = room._basePowerKw;
  const tempFactor = Math.max(0.62, Math.min(1.22, 1 + (22.0 - newTargetTemp) * 0.055));
  const modeMult = newMode === 'Eco' || newMode === 'Dry' ? 0.68 : 1.0;
  return Number((base * tempFactor * modeMult).toFixed(1));
}

function remoteControlRoomPower(clientId, buildingId, roomId, powerMode) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  room.mode = powerMode;
  if (room.status !== 'Error') {
    room.status = powerMode === 'Off' ? 'Standby' : 'Normal';
  }
  room.powerKw = computeRoomRemotePowerKw(room, powerMode, room.targetTemp);

  const acc = getCurrentAccount();
  const modeLabel = powerMode === 'Cool' ? 'ON (Cool)' : powerMode === 'Eco' ? 'Eco Mode' : 'Standby (OFF)';
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', client.city, `Two-Way IoT Command ke ${bld.gatewayId}: ${room.unitId} (${room.name}) diubah ke ${modeLabel}, daya ${room.powerKw} kW.`);
  saveState();
  renderDashboard();
  openRoomDetailModal(clientId, buildingId, roomId);
  showToast(`Perintah Two-Way ke ${room.unitId}: ${modeLabel} (${room.powerKw} kW) terkirim!`, 'success');
}

function remoteControlRoomTemp(clientId, buildingId, roomId, newTempVal) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  const clamped = Math.max(18, Math.min(26, Math.round(Number(newTempVal) * 2) / 2));
  room.targetTemp = clamped;
  if (room.mode === 'Off') {
    room.mode = 'Cool';
    if (room.status !== 'Error') room.status = 'Normal';
  }
  room.powerKw = computeRoomRemotePowerKw(room, room.mode, clamped);

  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', client.city, `Two-Way IoT Setpoint ke ${bld.gatewayId}: ${room.unitId} (${room.name}) diset ke ${clamped.toFixed(1)}°C (${room.powerKw} kW).`);
  saveState();
  renderDashboard();
  openRoomDetailModal(clientId, buildingId, roomId);
  showToast(`Target suhu ${room.unitId} diperbarui ke ${clamped.toFixed(1)}°C (Daya: ${room.powerKw} kW).`, 'info');
}

        <div class="divide-y divide-slate-100">

function updateClientChatbotContext(acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const errRooms = getClientErrorRooms(client);
  const badge = document.getElementById('chatbot-error-badge');
  if (errRooms.length > 0) {
    badge.textContent = errRooms.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  document.getElementById('chatbot-context-sub').textContent = `${client.name} (${errRooms.length} gangguan aktif)`;

  if (chatbotInitializedForUser !== acc.username) {
    chatbotInitializedForUser = acc.username;
    if (errRooms.length > 0) {
      const first = errRooms[0];
      const rule = lookupErrorRule(first.building.brand, first.room.errorCode);
      chatbotMessages = [{
        sender: 'ai',
        text: `Halo tim ${client.name}! Saya mendeteksi ada gangguan pendinginan di **${first.room.name}** (${first.building.name} ${first.room.floor}, suhu saat ini ${first.room.temp}°C).\n\nPenyebab: ${rule.humanTranslation}\n\nAnda dapat memilih tombol cepat di bawah atau bertanya langsung kepada saya.`
      }];
    } else {
      chatbotMessages = [{
        sender: 'ai',
        text: `Halo tim ${client.name}! Seluruh ${client.buildings.length} gedung Anda (${client.buildings.map((b) => b.name).join(', ')}) terpantau sejuk dan normal. Ada yang bisa saya bantu hari ini?`
      }];
    }
    renderChatbotMessages();
  }
}

function toggleChatbot(forceState) {
  const panel = document.getElementById('chatbot-panel');
  const open = typeof forceState === 'boolean' ? forceState : panel.classList.contains('hidden');
  if (open) {
    panel.classList.remove('hidden');
    renderChatbotMessages();
  } else {
    panel.classList.add('hidden');
  }
}

function renderChatbotMessages() {
  const box = document.getElementById('chatbot-messages');
  if (!box) return;
  box.innerHTML = chatbotMessages.map((m) => `
    <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
      <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed whitespace-pre-line ${
        m.sender === 'user'
          ? 'bg-teal-600 text-white rounded-br-sm'
          : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm shadow-2xs'
      }">${escapeHtml(m.text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function handleChatbotQuickReply(type) {
  const acc = getCurrentAccount();

  const client = getClientRecordForAccount(acc);
  const errRooms = getClientErrorRooms(client);
  const activeTickets = state.tickets.filter((t) => t.clientId === client.id && t.status !== 'Selesai');
  const pendingQuotes = (state.invoices || []).filter((inv) => inv.clientId === client.id && inv.status === 'Menunggu Persetujuan Klien');
  const unpaidInvs = (state.invoices || []).filter((inv) => inv.clientId === client.id && inv.status === 'Menunggu Pembayaran');

  const quoteBanner = pendingQuotes.length === 0 ? '' : pendingQuotes.map((q) => `
    <div class="rounded-2xl bg-amber-50 border-2 border-amber-300 p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center shrink-0">
          <i data-lucide="file-check-2" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-[11px] font-bold uppercase tracking-wider text-amber-800">Penawaran Sparepart Menunggu Persetujuan (${escapeHtml(q.id)})</div>
          <h3 class="text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">${escapeHtml(q.buildingName)} &mdash; ${escapeHtml(q.roomName)} (${escapeHtml(q.brand)})</h3>
          <p class="text-xs text-slate-700 mt-0.5">${q.items.map((it) => `${escapeHtml(it.name)} (${it.qty}x)`).join(', ')} + Jasa &amp; PPN 11% = <strong class="text-amber-900">${formatRp(q.grandTotal)}</strong></p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2 shrink-0">
        <button type="button" onclick="openInvoiceBastModal('${q.id}')" class="px-3 py-2 rounded-xl bg-white border border-amber-300 text-amber-900 hover:bg-amber-100 text-xs font-semibold transition">Lihat Rincian RAB</button>
        <button type="button" onclick="approveQuotationPO('${q.id}')" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow-sm transition flex items-center gap-1.5">
          <i data-lucide="check-circle" class="w-4 h-4"></i><span>Setujui RAB &amp; Terbitkan PO</span>
        </button>
      </div>
    </div>
  `).join('');

  const unpaidBanner = unpaidInvs.length === 0 ? '' : `
    <div class="rounded-2xl bg-indigo-50 border border-indigo-200 p-4 flex flex-wrap items-center justify-between gap-3">
      <div class="text-xs text-indigo-900">
        <strong>${unpaidInvs.length} Invoice Resmi Menunggu Pembayaran:</strong> Total ${formatRp(unpaidInvs.reduce((s, x) => s + x.grandTotal, 0))} (BAST Digital tersedia).
      </div>
      <button type="button" onclick="switchTab('billing')" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">Buka Invoice &amp; Sparepart</button>
    </div>
  `;

  if (type === 'emergency') {
    chatbotMessages.push({ sender: 'user', text: 'Panduan Tindakan Darurat' });
    if (errRooms.length > 0) {
      const e = errRooms[0];
      chatbotMessages.push({
        sender: 'ai',
        text: `Tindakan darurat aman untuk **${e.room.name} (${e.building.name})**:\n1. Jangan matikan MCB utama panel AC agar log sensor tetap terbaca.\n2. Atur unit ke mode **Fan Only** sementara untuk sirkulasi udara atau pindahkan aktivitas penting ke ruangan terdekat yang bersuhu normal.\n3. Pastikan pintu dan jendela ruangan tetap tertutup rapat agar suhu tidak naik drastis.`
      });
    } else {
      chatbotMessages.push({ sender: 'ai', text: 'Saat ini tidak ada kondisi darurat. Jika ruangan terasa kurang dingin, periksa apakah pintu ruangan tertutup rapat dan suhu target berada di kisaran 20–22°C.' });
    }
  } else if (type === 'status') {
    chatbotMessages.push({ sender: 'user', text: 'Cek Status Teknisi' });
    if (activeTickets.length > 0) {
      const t = activeTickets[0];
      const tech = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
      chatbotMessages.push({
        sender: 'ai',
        text: tech
          ? `Tiket **${t.id}** (${t.buildingName} — ${t.roomName}) saat ini berstatus **${t.status}**. Teknisi yang bertugas adalah **${tech.name}** (${tech.phone}).`
          : `Tiket **${t.id}** (${t.buildingName} — ${t.roomName}) sudah masuk ke antrean prioritas distributor (${t.city}) dengan status **Menunggu Penugasan**.`
      });
    } else {
      chatbotMessages.push({ sender: 'ai', text: 'Belum ada tiket teknisi yang sedang berjalan karena seluruh unit AC Anda dalam kondisi normal.' });
    }
  } else if (type === 'urgent') {
    requestUrgentTechnician(acc, client, errRooms);
    return;
  }
  renderChatbotMessages();
}

function requestUrgentTechnician(acc, client, errRooms) {
  chatbotMessages.push({ sender: 'user', text: 'Minta Teknisi Datang Sekarang' });
  const targetDetail = errRooms.length > 0 ? `${errRooms[0].building.name} - ${errRooms[0].room.name}` : `${client.buildings[0].name}`;
  pushNotification(
    'admin_eka',
    `URGENT REQUEST dari ${client.name} (${client.city})`,
    `Klien meminta teknisi segera datang ke lokasi (${targetDetail}) melalui Asisten AI CoolSync.`,
    'error',
    'errors'
  );
  addAuditLog(acc.username, 'client', client.city, `Mengirim permintaan kedatangan teknisi prioritas (URGENT) untuk ${targetDetail}.`);
  saveState();
  chatbotMessages.push({
    sender: 'ai',
    text: `Permintaan darurat telah dikirim dengan prioritas tinggi kepada **Admin Eka (Distributor Jatim)** untuk area **${client.city}** (${targetDetail}). Notifikasi lonceng Admin Eka sudah langsung berbunyi.`
  });
  renderChatbotMessages();
  showToast('Permintaan teknisi darurat berhasil dikirim ke Admin Eka!', 'success');
}

function handleChatbotSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('chatbot-input');
  const txt = input.value.trim();
  if (!txt) return;
  input.value = '';
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  const errRooms = getClientErrorRooms(client);
  chatbotMessages.push({ sender: 'user', text: txt });

  const lower = txt.toLowerCase();
  let reply = '';
  if (lower.includes('listrik') || lower.includes('kwh') || lower.includes('biaya')) {
    const kwhToday = client.buildings.reduce((s, b) => s + b.kwh7Days[b.kwh7Days.length - 1], 0);
    reply = `Total pemakaian listrik AC di **${client.name}** hari ini tercatat **${kwhToday.toLocaleString('id-ID')} kWh** (estimasi **${formatRp(kwhToday * ELECTRIC_TARIFF_RP)}**). Detail grafik ada di menu Konsumsi Listrik.`;
  } else if (lower.includes('teknisi') || lower.includes('datang') || lower.includes('perbaiki')) {
    const active = state.tickets.filter((t) => t.clientId === client.id && t.status !== 'Selesai');
    if (active.length > 0) {
      const t = active[0];
      const tech = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
      reply = tech
        ? `Teknisi **${tech.name}** sedang menangani tiket **${t.id}** dengan status **${t.status}**.`
        : `Tiket **${t.id}** sedang menunggu penugasan Admin Eka. Anda bisa klik tombol **"Minta Teknisi Datang Sekarang"** di bawah untuk eskalasi cepat.`;
    } else {
      reply = 'Saat ini tidak ada tiket gangguan aktif. Jika butuh inspeksi rutin, klik "Minta Teknisi Datang Sekarang".';
    }
  } else if (errRooms.length > 0) {
    const eRoom = errRooms[0];
    const rule = lookupErrorRule(eRoom.building.brand, eRoom.room.errorCode);

function submitCompleteWo(e, ticketId) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const t = state.tickets.find((x) => x.id === ticketId && x.assignedTo === acc.username);
  if (!t) return;
  const notes = document.getElementById('wo-repair-notes').value.trim();
  const parts = document.getElementById('wo-parts-used').value.trim();
  const nowIso = new Date().toISOString();

  t.status = 'Selesai';
  t.completedAt = nowIso;
  t.updatedAt = nowIso;
  t.repairNotes = notes;
  t.partsUsed = parts;

  // Kembalikan unit AC ruangan menjadi Normal & suhu kembali sejuk sesuai target
  const client = state.clients.find((c) => c.id === t.clientId);
  const bld = client && client.buildings.find((b) => b.id === t.buildingId);
  const room = bld && bld.rooms.find((r) => r.id === t.roomId);
  if (room) {
    room.status = 'Normal';
    room.errorCode = null;
    room.mode = 'Cool';
    room.temp = room.targetTemp;
    room.tempHistory6h = [...room.tempHistory6h.slice(1), room.targetTemp];
  }

  // Otomatis Available jika tidak ada WO aktif lain
  const otherActive = state.tickets.some((x) => x.assignedTo === acc.username && x.status !== 'Selesai');
  if (!otherActive) acc.techStatus = 'Available';

  // Otomatis terbitkan Invoice & BAST Digital jika terdapat Quotation terkait WO ini
  const relInv = (state.invoices || []).find((inv) => inv.ticketId === t.id && inv.status !== 'Lunas' && !inv.invNumber);
  if (relInv) {
    const seq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
    relInv.invNumber = `INV-2026-${seq}`;
    relInv.bastNumber = `BAST-2026-${seq}`;
    if (!relInv.poNumber) relInv.poNumber = `PO-AUTO-2026-${seq}`;
    relInv.invoicedAt = nowIso;
    relInv.approvedAt = relInv.approvedAt || nowIso;
    relInv.status = 'Menunggu Pembayaran';
    pushNotification(t.clientUsername, `Invoice ${relInv.invNumber} & BAST Digital Terbit`, `Pekerjaan ${t.id} selesai. Invoice resmi ${relInv.invNumber} (${formatRp(relInv.grandTotal)}) & BAST Digital siap ditinjau.`, 'info', 'billing');
    pushNotification('admin_eka', `Invoice ${relInv.invNumber} Otomatis Terbit`, `WO ${t.id} selesai; Invoice & BAST Digital untuk ${t.clientName} senilai ${formatRp(relInv.grandTotal)} diterbitkan.`, 'success', 'billing');
  }

  pushNotification('admin_eka', `WO ${t.id} Selesai oleh ${acc.name}`, `${t.clientName} (${t.buildingName} - ${t.roomName}) telah kembali Normal. Sparepart: ${parts}.`, 'success', 'errors');
  pushNotification(t.clientUsername, `Perbaikan ${t.roomName} Selesai!`, `Teknisi ${acc.name} telah menyelesaikan perbaikan. Suhu unit AC kembali sejuk sesuai target (${room ? room.targetTemp + '°C' : 'Normal'}).`, 'success', 'tickets');
  addAuditLog(acc.username, 'technician', acc.city, `Menyelesaikan ${t.id} (${t.clientName} - ${t.roomName}). Unit kembali Normal.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Work Order ${t.id} selesai! Unit AC kembali Normal.${relInv ? ' Invoice & BAST otomatis terbit.' : ''}`, 'success');
}

function recalcQuotationPreview() {
  const box = document.getElementById('qt-summary-box');
  if (!box) return;
  let partsTotal = 0;
  let count = 0;
  document.querySelectorAll('.qt-part-check').forEach((chk) => {
    if (chk.checked) {
      const partId = chk.getAttribute('data-part-id');
      const part = SPAREPART_CATALOG.find((p) => p.id === partId);
      const qtyEl = document.querySelector(`.qt-part-qty[data-part-id="${partId}"]`);
      const qty = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10) || 1);
      if (part) { partsTotal += part.price * qty; count++; }
    }
  });
  const includeLabor = document.getElementById('qt-include-labor')?.checked;
  const labor = includeLabor ? SERVICE_LABOR_FEE : 0;
  const subtotal = partsTotal + labor;
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;

  box.innerHTML = `
    <div class="flex justify-between text-slate-300"><span>Sparepart Terpilih (${count} item)</span><span>${formatRp(partsTotal)}</span></div>
    <div class="flex justify-between text-slate-300"><span>Jasa Instalasi &amp; Kalibrasi</span><span>${formatRp(labor)}</span></div>
    <div class="flex justify-between text-slate-300"><span>PPN 11%</span><span>${formatRp(ppn)}</span></div>
    <div class="pt-2 border-t border-slate-700 flex justify-between text-sm font-extrabold text-teal-300"><span>Total Penawaran (RAB)</span><span>${formatRp(grandTotal)}</span></div>
  `;
}

function submitCreateQuotation(e, ticketId) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const t = state.tickets.find((x) => x.id === ticketId);
  if (!t) return;
  const items = [];
  document.querySelectorAll('.qt-part-check').forEach((chk) => {
    if (chk.checked) {
      const partId = chk.getAttribute('data-part-id');
      const part = SPAREPART_CATALOG.find((p) => p.id === partId);
      const qtyEl = document.querySelector(`.qt-part-qty[data-part-id="${partId}"]`);
      const qty = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10) || 1);
      if (part) items.push({ partId: part.id, name: part.name, qty, unitPrice: part.price, lineTotal: part.price * qty });
    }
  });
  if (items.length === 0) { showToast('Pilih minimal 1 sparepart untuk Quotation RAB.', 'warning'); return; }

  const includeLabor = document.getElementById('qt-include-labor')?.checked;
  const laborFee = includeLabor ? SERVICE_LABOR_FEE : 0;
  const partsSum = items.reduce((s, it) => s + it.lineTotal, 0);
  const subtotal = partsSum + laborFee;
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;
  const notes = document.getElementById('qt-notes').value.trim();

  if (!Array.isArray(state.invoices)) state.invoices = [];
  const qtSeq = String(state.invoices.length + 1).padStart(3, '0');
  const qtId = `QT-2026-${qtSeq}`;
  const techAcc = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;

  state.invoices.unshift({
    id: qtId, invNumber: null, bastNumber: null, poNumber: null,
    ticketId: t.id, clientId: t.clientId, clientName: t.clientName, clientUsername: t.clientUsername,
    city: t.city, buildingName: t.buildingName, roomName: t.roomName, unitId: t.unitId, brand: t.brand,
    createdBy: acc ? acc.username : 'admin_eka',
    technicianName: techAcc ? techAcc.name : (acc ? acc.name : 'Tim Teknisi'),
    items, laborFee, subtotal, ppn, grandTotal, notes,
    status: 'Menunggu Persetujuan Klien', clientPaymentConfirmed: false,
    createdAt: new Date().toISOString(), approvedAt: null, invoicedAt: null, paidAt: null
  });

  pushNotification(t.clientUsername, `Quotation Sparepart Baru (${qtId})`, `RAB penggantian sparepart ${t.roomName} senilai ${formatRp(grandTotal)} menunggu persetujuan PO Anda.`, 'warning', 'billing');
  if (!acc || acc.username !== 'admin_eka') {
    pushNotification('admin_eka', `Quotation ${qtId} Diajukan untuk ${t.clientName}`, `Teknisi mengajukan RAB sparepart ${formatRp(grandTotal)} pada tiket ${t.id}.`, 'info', 'billing');
  }
  addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', t.city, `Membuat Quotation RAB ${qtId} (${formatRp(grandTotal)}) untuk ${t.id}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Quotation ${qtId} (${formatRp(grandTotal)}) berhasil dikirim ke ${t.clientName}!`, 'success');
}

function approveQuotationPO(invoiceId) {
  const acc = getCurrentAccount();
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  const nowIso = new Date().toISOString();
  const seq = String((state.invoices || []).filter((x) => x.poNumber).length + 42).padStart(3, '0');
  inv.poNumber = `PO-KLIEN-2026-${seq}`;
  inv.approvedAt = nowIso;

  const relTicket = state.tickets.find((t) => t.id === inv.ticketId);
  if (relTicket && relTicket.status === 'Selesai') {
    const invSeq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
    inv.invNumber = `INV-2026-${invSeq}`;
    inv.bastNumber = `BAST-2026-${invSeq}`;
    inv.invoicedAt = nowIso;
    inv.status = 'Menunggu Pembayaran';
  } else {
    inv.status = 'PO Disetujui (Proses Pasang)';
  }

  pushNotification('admin_eka', `PO Disetujui Klien: ${inv.poNumber}`, `${inv.clientName} menyetujui RAB ${inv.id} (${formatRp(inv.grandTotal)}). Teknisi siap memasang sparepart.`, 'success', 'billing');
  if (relTicket && relTicket.assignedTo) {
    pushNotification(relTicket.assignedTo, `PO ${inv.poNumber} Disetujui Klien`, `Klien ${inv.clientName} menyetujui penggantian sparepart untuk ${inv.ticketId}. Silakan lanjutkan pemasangan.`, 'success', 'workorders');
  }
  addAuditLog(acc ? acc.username : inv.clientUsername, 'client', inv.city, `Menyetujui RAB ${inv.id} dan menerbitkan ${inv.poNumber}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`RAB disetujui! Nomor PO ${inv.poNumber} berhasil diterbitkan.`, 'success');
}

function issueInvoiceFromPo(invoiceId) {
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  const nowIso = new Date().toISOString();
  const seq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
  inv.invNumber = inv.invNumber || `INV-2026-${seq}`;
  inv.bastNumber = inv.bastNumber || `BAST-2026-${seq}`;

function markInvoicePaid(invoiceId) {
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);

function updateAcModalBuildingOptions(preferredBldId = null) {
  const clientId = document.getElementById('ac-add-client')?.value;
  const bldSel = document.getElementById('ac-add-building');
  const gwBadge = document.getElementById('ac-gateway-badge');
  if (!clientId || !bldSel) return;
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  bldSel.innerHTML = client.buildings.map((b) => `<option value="${b.id}" ${preferredBldId === b.id ? 'selected' : ''}>${escapeHtml(b.name)} (${escapeHtml(b.gatewayId)})</option>`).join('');
  const refreshGw = () => {
    const b = client.buildings.find((x) => x.id === bldSel.value) || client.buildings[0];
    if (gwBadge && b) gwBadge.innerHTML = `Terhubung otomatis ke Edge Gateway <strong>${escapeHtml(b.gatewayId)}</strong> (${escapeHtml(b.protocol)}) &bull; Status: ${escapeHtml(b.gatewayStatus)}`;
  };
  bldSel.onchange = refreshGw;
  refreshGw();
}

function submitAddAcUnit(e, prefillReqId = null) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const clientId = document.getElementById('ac-add-client').value;
  const buildingId = document.getElementById('ac-add-building').value;
  const floor = document.getElementById('ac-add-floor').value.trim();
  const roomName = document.getElementById('ac-add-room').value.trim();
  const unitId = document.getElementById('ac-add-unitid').value.trim().toUpperCase();
  const brand = document.getElementById('ac-add-brand').value;
  const capacity = document.getElementById('ac-add-capacity').value;
  const targetTemp = parseFloat(document.getElementById('ac-add-target').value) || 22.0;

  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!client || !bld) return;

  const kwMatch = capacity.match(/([\d.]+)\s*kW/i);
  const powerKw = kwMatch ? parseFloat(kwMatch[1]) : 4.5;
  const newRoom = {
    id: 'rm_new_' + Date.now(),
    unitId, floor, name: roomName,
    temp: targetTemp, targetTemp, mode: 'Cool', powerKw,
    status: 'Normal', errorCode: null, zoneType: 'officeOpd',
    tempHistory6h: [targetTemp + 0.3, targetTemp + 0.2, targetTemp + 0.1, targetTemp, targetTemp, targetTemp]
  };
  bld.rooms.unshift(newRoom);
  bld.iduCount += 1;
  if (!client.brands.includes(brand)) client.brands.push(brand);

  if (prefillReqId) {
    const req = (state.installRequests || []).find((r) => r.id === prefillReqId);
    if (req) { req.status = 'Terpasang & Aktif'; req.installedUnitId = unitId; }
  }

  pushNotification(client.ownerUsername, `Unit AC Baru Aktif: ${unitId}`, `${roomName} (${bld.name} ${floor}) — ${brand} ${capacity} berhasil diaktifkan ke Edge Gateway ${bld.gatewayId}.`, 'success', 'units');
  addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', client.city, `Menambahkan unit AC baru ${unitId} (${roomName}) di ${client.name} - ${bld.name}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Unit ${unitId} (${roomName}) berhasil ditambahkan & aktif di sistem!`, 'success');
}

/* =========================================================
   MODUL DENAH GEDUNG & LANTAI INTERAKTIF (2D SVG BLUEPRINT)
   ========================================================= */
function isRoomOverusage(room) {
  if (!room || room.status === 'Error' || room.status === 'Standby' || room.mode === 'Off') return false;
  if (room.mode === 'Eco' || room.mode === 'Dry') return false;
  return (room.zoneType !== 'critical24' && Number(room.targetTemp) <= 18.5) || room.isOverusage === true;
}

function getRoomOverusagePct(room) {
  const diff = Math.max(1, 23.5 - Number((room && room.targetTemp) || 18));
  return Math.min(32, Math.max(14, Math.round(diff * 3.3)));
}

function getRoomVisualStatus(room) {
  if (!room) return 'Normal';
  if (room.status === 'Error') return 'Error';
  if (room.status === 'Standby' || room.mode === 'Off') return 'Standby';
  if (isRoomOverusage(room)) return 'Over-Usage';
  return 'Normal';
}

function parseFloorWeight(floorName) {
  const f = String(floorName || '').trim().toUpperCase();
  if (f === 'ROOFTOP') return 1000;
  if (f === 'GF' || f === 'G') return 0.5;
  if (f.startsWith('B')) return -(parseInt(f.slice(1), 10) || 1);
  const m = f.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 1;
}

function getBuildingFloorsMeta(building) {
  const map = new Map();
  (building.rooms || []).forEach((r) => {
    const fk = r.floor || 'Lt. 1';
    if (!map.has(fk)) map.set(fk, []);
    map.get(fk).push(r);
  });
  const sortedKeys = Array.from(map.keys()).sort((a, b) => parseFloorWeight(b) - parseFloorWeight(a));
  const list = [
    {
      floorKey: 'ROOFTOP',
      label: 'Rooftop / Area ODU & Gateway',
      isRooftop: true,
      rooms: [],
      errorCount: building.gatewayStatus === 'Online' ? 0 : 1,
      overusageCount: 0,
      normalCount: building.gatewayStatus === 'Online' ? 1 : 0,
      standbyCount: 0
    }
  ];
  sortedKeys.forEach((fk) => {
    const rooms = map.get(fk) || [];
    let errorCount = 0, overusageCount = 0, normalCount = 0, standbyCount = 0;
    rooms.forEach((r) => {
      const vs = getRoomVisualStatus(r);
      if (vs === 'Error') errorCount++;
      else if (vs === 'Over-Usage') overusageCount++;
      else if (vs === 'Standby') standbyCount++;
      else normalCount++;
    });
    list.push({
      floorKey: fk,
      label: fk === 'GF' ? 'Lantai Dasar (GF)' : fk,
      isRooftop: false,
      rooms,
      errorCount,
      overusageCount,
      normalCount,
      standbyCount
    });
  });
  return list;
}

function jumpToFirstErrorFloor(scopeClientId = null) {
  const clientsPool = scopeClientId
    ? state.clients.filter((c) => c.id === scopeClientId)
    : getFilteredClientsForAdmin();

  for (const c of clientsPool) {
    for (const b of c.buildings) {
      const errRoom = b.rooms.find((r) => getRoomVisualStatus(r) === 'Error');
      if (errRoom) {
        floorplanSelectedClientId = c.id;
        floorplanSelectedBuildingId = b.id;
        clientSelectedBuildingId = b.id;
        floorplanSelectedFloor = errRoom.floor;
        floorplanStatusFilter = 'all';
        renderDashboard();
        showToast(`Lompat ke ${c.name} — ${b.name} (${errRoom.floor}): Unit ${errRoom.unitId} [${errRoom.errorCode}]!`, 'error');
        return;
      }
    }
  }
  showToast('Tidak ada unit AC yang sedang Error pada cakupan ini.', 'success');
}

function optimizeOverusageRoom(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  const oldKw = Number(room.powerKw) || 6.5;
  room.targetTemp = 23.5;
  room.mode = 'Eco';
  room.status = 'Normal';
  room.isOverusage = false;
  room.powerKw = computeRoomRemotePowerKw(room, 'Eco', 23.5);
  if (room.powerKw >= oldKw) room.powerKw = Number((oldKw * 0.64).toFixed(1));
  if (room.temp < 21.0) room.temp = 22.8;
  room.tempHistory6h = [...(room.tempHistory6h || [22.0, 22.0, 22.0, 22.0, 22.0]).slice(1), room.temp];

  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'admin', client.city, `Optimasi Eco 23.5°C pada Denah Interaktif: ${client.name} (${bld.name} ${room.floor} - ${room.unitId}) beban turun ${oldKw} kW -> ${room.powerKw} kW.`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`⚡ ${room.unitId} (${room.name}) dioptimalkan ke Eco 23.5°C! Beban turun ${oldKw} kW → ${room.powerKw} kW.`, 'success');
}

function buildFloorBlueprintSvg(client, building, floorMeta, options = {}) {
  const statusFilter = options.statusFilter || 'all';
  const highlightTicket = options.highlightTicket || null;
  const rooms = floorMeta.rooms || [];
  const half = Math.ceil(rooms.length / 2);
  const northRooms = rooms.slice(0, half);
  const southRooms = rooms.slice(half);

  const areaX = 120;
  const areaW = 768;
  const northY = 74;
  const roomH = 148;
  const corridorY = 232;
  const corridorH = 74;
  const southY = 316;

  let roomSvgNodes = '';
  let conduitPaths = '';
  let targetNavPoint = null;

  const drawRow = (rowRooms, rowY, isNorth) => {
    if (!rowRooms.length) return;
    const gap = 12;
    const rw = Math.floor((areaW - gap * (rowRooms.length - 1)) / rowRooms.length);
    rowRooms.forEach((r, idx) => {
      const rx = areaX + idx * (rw + gap);
      const vs = getRoomVisualStatus(r);
      const isMatchFilter = statusFilter === 'all' || vs === statusFilter;
      const isTechTarget = highlightTicket && (highlightTicket.roomId === r.id || highlightTicket.unitId === r.unitId);
      const opacity = highlightTicket ? (isTechTarget ? 1 : 0.45) : (isMatchFilter ? 1 : 0.28);

      const colors = {
        'Error': { stroke: '#f43f5e', fill: '#2c0b16', badgeBg: '#e11d48', badgeText: '#ffffff', tag: `ERR ${r.errorCode || '!'}` },
        'Over-Usage': { stroke: '#f59e0b', fill: '#2a1b06', badgeBg: '#f59e0b', badgeText: '#0f172a', tag: `BOROS +${getRoomOverusagePct(r)}%` },
        'Normal': { stroke: '#10b981', fill: '#0b2429', badgeBg: '#059669', badgeText: '#ffffff', tag: 'NORMAL' },
        'Standby': { stroke: '#64748b', fill: '#131d2d', badgeBg: '#475569', badgeText: '#e2e8f0', tag: 'STANDBY' }
      }[vs];

      const iduX = rx + rw - 46;
      const iduY = isNorth ? rowY + 14 : rowY + roomH - 36;
      const mhX = iduX - 38;
      const mhY = iduY;
      const doorX = rx + Math.round(rw / 2);
      const doorY = isNorth ? rowY + roomH : rowY;
      const conduitY = isNorth ? corridorY + 18 : corridorY + corridorH - 18;
      const lineStroke = vs === 'Error' ? '#f43f5e' : vs === 'Over-Usage' ? '#f59e0b' : '#2dd4bf';

      conduitPaths += `<path d="M 102 ${conduitY} L ${doorX} ${conduitY} L ${doorX} ${doorY}" fill="none" stroke="${lineStroke}" stroke-width="${isTechTarget ? 3 : 1.7}" stroke-dasharray="${vs === 'Standby' ? '4 4' : 'none'}" opacity="${opacity}"/>`;

      if (isTechTarget) {
        targetNavPoint = { doorX, doorY, iduX: iduX + 18, iduY: iduY + 11, mhX: mhX + 14, mhY: mhY + 11, roomName: r.name, unitId: r.unitId };
      }

      const shortName = r.name.length > (rw > 220 ? 28 : 20) ? r.name.slice(0, rw > 220 ? 27 : 19) + '…' : r.name;
      const zoneShort = r.zoneType === 'critical24' ? '24/7' : r.zoneType === 'publicWbp' ? 'Publik' : 'OPD';

      roomSvgNodes += `
        <g class="cursor-pointer" opacity="${opacity}" onclick="handleBlueprintRoomClick('${client.id}', '${building.id}', '${r.id}')">
          <rect x="${rx}" y="${rowY}" width="${rw}" height="${roomH}" rx="8"
            fill="${colors.fill}" stroke="${isTechTarget ? '#38bdf8' : colors.stroke}"
            stroke-width="${isTechTarget ? 3.5 : vs === 'Error' || vs === 'Over-Usage' ? 2.4 : 1.6}"
            stroke-dasharray="${vs === 'Standby' ? '6 4' : 'none'}"/>

          <!-- Door opening marker -->
          <rect x="${doorX - 14}" y="${doorY - 3}" width="28" height="6" rx="2" fill="#081221" stroke="${colors.stroke}" stroke-width="1.2"/>

          <!-- IDU Indoor Unit + Service Manhole -->
          <rect x="${iduX}" y="${iduY}" width="36" height="20" rx="3" fill="#07131e" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="${iduX + 18}" y="${iduY + 13}" text-anchor="middle" fill="#7dd3fc" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="700">IDU</text>
          <rect x="${mhX}" y="${mhY}" width="30" height="20" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="${mhX + 15}" y="${mhY + 13}" text-anchor="middle" fill="#cbd5e1" font-size="8" font-family="JetBrains Mono, monospace">MH</text>

          <!-- Status Pin -->
          <circle cx="${rx + 16}" cy="${rowY + 20}" r="6" fill="${colors.badgeBg}" class="${vs === 'Error' ? 'animate-bp-blink' : ''}"/>
          ${vs === 'Error' ? `<circle cx="${rx + 16}" cy="${rowY + 20}" r="11" fill="none" stroke="#fb7185" stroke-width="1.5" class="animate-bp-blink"/>` : ''}
          <rect x="${rx + 28}" y="${rowY + 11}" width="${Math.min(108, rw - 115)}" height="18" rx="4" fill="${colors.badgeBg}"/>
          <text x="${rx + 34}" y="${rowY + 23}" fill="${colors.badgeText}" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">${escapeHtml(colors.tag)}</text>

          <!-- Room Info -->
          <text x="${rx + 12}" y="${rowY + 54}" fill="#f8fafc" font-size="12" font-family="Inter, sans-serif" font-weight="700">${escapeHtml(shortName)}</text>
          <text x="${rx + 12}" y="${rowY + 72}" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">${escapeHtml(r.unitId)} &bull; ${zoneShort}</text>

          <!-- Telemetry Readout -->
          <rect x="${rx + 10}" y="${rowY + 84}" width="${rw - 20}" height="50" rx="6" fill="#060f1a" stroke="#1e293b"/>
          <text x="${rx + 20}" y="${rowY + 105}" fill="${vs === 'Error' ? '#fda4af' : vs === 'Over-Usage' ? '#fcd34d' : '#5eead4'}" font-size="13" font-family="JetBrains Mono, monospace" font-weight="700">${r.temp}°C &rarr; ${Number(r.targetTemp).toFixed(1)}°C</text>
          <text x="${rx + 20}" y="${rowY + 123}" fill="#cbd5e1" font-size="10" font-family="Inter, sans-serif">${escapeHtml(r.mode)} &bull; ${r.powerKw} kW ${vs === 'Error' ? '&bull; Cek Manhole' : ''}</text>
        </g>
      `;
    });
  };

  drawRow(northRooms, northY, true);
  drawRow(southRooms, southY, false);

  let navRouteOverlay = '';
  if (highlightTicket && targetNavPoint) {
    const midY = corridorY + Math.round(corridorH / 2);
    navRouteOverlay = `
      <path d="M 65 ${midY} L ${targetNavPoint.doorX} ${midY} L ${targetNavPoint.doorX} ${targetNavPoint.doorY} L ${targetNavPoint.mhX} ${targetNavPoint.mhY}"
        fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8 6" class="animate-dash-march"/>
      <circle cx="65" cy="${midY}" r="8" fill="#22d3ee" stroke="#081221" stroke-width="2"/>
      <circle cx="${targetNavPoint.mhX}" cy="${targetNavPoint.mhY}" r="9" fill="#f43f5e" stroke="#facc15" stroke-width="2.5" class="animate-bp-blink"/>
      <rect x="${Math.min(680, Math.max(130, targetNavPoint.doorX - 85))}" y="${midY - 14}" width="175" height="22" rx="6" fill="#facc15"/>
      <text x="${Math.min(680, Math.max(130, targetNavPoint.doorX - 85)) + 87}" y="${midY + 1}" text-anchor="middle" fill="#0f172a" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">RUTE TEKNISI &rarr; ${escapeHtml(targetNavPoint.unitId)}</text>
    `;
  }

  return `
    <svg viewBox="0 0 920 512" class="w-full h-auto block select-none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="bpGridFloor" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#132944" stroke-width="0.75"/>
        </pattern>
      </defs>
      <rect width="920" height="512" fill="#081221"/>
      <rect width="920" height="512" fill="url(#bpGridFloor)"/>

      <!-- Outer Architectural Wall & Reference Grid -->
      <rect x="18" y="18" width="884" height="476" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
      <text x="30" y="42" fill="#7dd3fc" font-size="11" font-family="JetBrains Mono, monospace" font-weight="700">DENAH ARSITEKTUR &mdash; ${escapeHtml(building.name.toUpperCase())} (${escapeHtml(floorMeta.label.toUpperCase())})</text>
      <text x="30" y="58" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">GATEWAY: ${escapeHtml(building.gatewayId)} (${escapeHtml(building.protocol)}) &bull; WING UTARA / KORIDOR / WING SELATAN</text>
      <text x="886" y="42" text-anchor="end" fill="#5eead4" font-size="10" font-family="JetBrains Mono, monospace" font-weight="700">N &#8593; &bull; SKALA 1:150</text>

      <!-- Left Riser Column: Shaft Pipa, Service Entrance, MCB -->
      <rect x="28" y="74" width="76" height="148" rx="8" fill="#0c1d30" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="66" y="112" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">SHAFT</text>
      <text x="66" y="128" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Inter, sans-serif">Pipa Freon</text>
      <text x="66" y="142" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Inter, sans-serif">&amp; CAN Bus</text>
      <text x="66" y="160" text-anchor="middle" fill="#2dd4bf" font-size="8.5" font-family="JetBrains Mono, monospace">Modbus</text>

      <rect x="28" y="232" width="76" height="74" rx="8" fill="#0d2532" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="66" y="258" text-anchor="middle" fill="#22d3ee" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="700">ENTRANCE</text>
      <text x="66" y="274" text-anchor="middle" fill="#e2e8f0" font-size="8" font-family="Inter, sans-serif">Tangga / Lift</text>
      <text x="66" y="287" text-anchor="middle" fill="#e2e8f0" font-size="8" font-family="Inter, sans-serif">Servis Teknisi</text>

      <rect x="28" y="316" width="76" height="148" rx="8" fill="#131c2e" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="66" y="366" text-anchor="middle" fill="#fbbf24" font-size="9.5" font-family="JetBrains Mono, monospace" font-weight="700">PANEL MCB</text>
      <text x="66" y="382" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-family="Inter, sans-serif">Sub-Distribusi</text>
      <text x="66" y="396" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-family="Inter, sans-serif">${escapeHtml(floorMeta.floorKey)}</text>

function handleBlueprintRoomClick(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const vs = getRoomVisualStatus(room);
  if (vs === 'Error') openBlueprintErrorModal(clientId, buildingId, roomId);
  else if (vs === 'Over-Usage') openBlueprintOverusageModal(clientId, buildingId, roomId);
  else openRoomDetailModal(clientId, buildingId, roomId);
}

function openBlueprintErrorModal(clientId, buildingId, roomId) {
  const acc = getCurrentAccount();
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;

  const rule = lookupErrorRule(bld.brand, room.errorCode || 'E4');
  const ticket = state.tickets.find((t) => t.roomId === room.id && t.status !== 'Selesai')
    || state.tickets.find((t) => t.unitId === room.unitId && t.status !== 'Selesai');
  const sameCityTechs = state.accounts.filter((a) => a.role === 'technician' && a.city === client.city);
  const isAdminOrSuper = acc && (acc.role === 'admin' || acc.role === 'superadmin');

  openModal(`
    <div class="px-5 py-4 bg-rose-700 text-white flex items-center justify-between">
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-rose-200">Unit Gangguan pada Denah &bull; ${escapeHtml(bld.name)} (${escapeHtml(room.floor)})</div>
        <h3 class="text-sm sm:text-base font-extrabold">${escapeHtml(room.name)} (${escapeHtml(room.unitId)})</h3>
      </div>
      <button type="button" onclick="closeModal()" class="p-1 text-rose-100 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 space-y-4 max-h-[82vh] overflow-y-auto custom-scroll">
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="rounded-xl bg-rose-50 border border-rose-200 p-2.5"><span class="text-[10px] text-rose-600 block">Kode Error</span><span class="font-mono text-base font-extrabold text-rose-700">${escapeHtml(room.errorCode || '-')}</span></div>
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-2.5"><span class="text-[10px] text-slate-500 block">Suhu Aktual</span><span class="text-base font-extrabold text-rose-600">${room.temp}°C</span></div>
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-2.5"><span class="text-[10px] text-slate-500 block">Target / Daya</span><span class="text-sm font-bold text-slate-800">${room.targetTemp}°C &bull; ${room.powerKw} kW</span></div>
      </div>

      <div class="rounded-xl bg-slate-50 border border-slate-200 p-4 space-y-2">
        <div class="text-[11px] font-bold uppercase tracking-wider text-teal-700">Smart Error Translator</div>
        <div class="text-xs font-bold text-slate-900">${escapeHtml(rule.factoryMeaning)}</div>
        <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(rule.humanTranslation)}</p>
        <div class="pt-2 border-t border-slate-200 text-xs text-teal-800"><strong>Rekomendasi Sparepart:</strong> ${escapeHtml(rule.recommendedPart)} (${escapeHtml(rule.estDuration)})</div>
      </div>

      ${isAdminOrSuper && ticket ? `
        <div class="rounded-xl bg-teal-50 border border-teal-200 p-4 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-teal-900">Tugaskan Teknisi Sekota (${escapeHtml(client.city)}) &mdash; Tiket ${escapeHtml(ticket.id)}</span>
            <span class="px-2 py-0.5 rounded-full bg-white text-teal-800 border border-teal-200 text-[10px] font-bold">${escapeHtml(ticket.status)}</span>
          </div>
          <div class="flex flex-col sm:flex-row gap-2">
            <select id="bp-dispatch-tech" class="flex-1 px-3 py-2 rounded-xl border border-teal-300 bg-white text-xs">
              ${sameCityTechs.map((t) => `<option value="${t.username}" ${ticket.assignedTo === t.username ? 'selected' : ''}>${escapeHtml(t.name)} [${escapeHtml(t.techStatus)}] &bull; ${escapeHtml(t.brands.join(', '))}</option>`).join('')}
            </select>
            <button type="button" onclick="assignTechnicianFromBlueprint('${ticket.id}')" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold transition">Tugaskan Teknisi Sekota</button>
          </div>
        </div>
      ` : ''}

      <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">
        ${ticket ? `<button type="button" onclick="openTechFloorplanModal('${ticket.id}')" class="px-3.5 py-2 rounded-xl bg-slate-900 text-teal-300 text-xs font-bold">🗺️ Peta Rute Teknisi</button>` : ''}
        ${acc && acc.role === 'client' ? `<button type="button" onclick="closeModal(); toggleChatbot(true);" class="px-3.5 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">Tanya Asisten AI</button>` : ''}
        <button type="button" onclick="openRoomDetailModal('${client.id}', '${bld.id}', '${room.id}')" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Grafik &amp; Kontrol IoT</button>
        <button type="button" onclick="closeModal()" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Tutup</button>
      </div>
    </div>
  `, 'max-w-xl');
}

function assignTechnicianFromBlueprint(ticketId) {
  const sel = document.getElementById('bp-dispatch-tech');
  if (!sel || !sel.value) return;
  closeModal();
  assignTechnician(ticketId, sel.value);
}

function openBlueprintOverusageModal(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const overPct = getRoomOverusagePct(room);
  const ecoKw = computeRoomRemotePowerKw(room, 'Eco', 23.5);
  const savedKw = Math.max(1.2, Number((room.powerKw - ecoKw).toFixed(1)));
  const savedRpMonth = Math.round(savedKw * 10 * 30 * ELECTRIC_TARIFF_RP);

  openModal(`
    <div class="px-5 py-4 bg-amber-500 text-slate-950 flex items-center justify-between">
      <div>
        <div class="text-[10px] font-extrabold uppercase tracking-wider">Peringatan Over-Usage / Overhead Energi</div>
        <h3 class="text-sm sm:text-base font-extrabold">${escapeHtml(room.name)} (${escapeHtml(room.unitId)})</h3>
      </div>
      <button type="button" onclick="closeModal()" class="p-1 text-slate-900 hover:text-black"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div class="rounded-xl bg-amber-50 border border-amber-200 p-4 text-xs text-amber-950 leading-relaxed">
        <strong>Pemakaian Berlebih / Suhu Terlalu Rendah (Boros +${overPct}% kWh):</strong> Unit zona non-medis disetel terlalu dingin di <strong>${Number(room.targetTemp).toFixed(1)}°C</strong> dengan konsumsi <strong>${room.powerKw} kW</strong>.
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-3">
          <div class="text-[10px] text-slate-500">Kondisi Saat Ini (Boros)</div>
          <div class="text-base font-extrabold text-amber-700 mt-0.5">${Number(room.targetTemp).toFixed(1)}°C &bull; ${room.powerKw} kW</div>
        </div>
        <div class="rounded-xl bg-emerald-50 border border-emerald-200 p-3">
          <div class="text-[10px] text-emerald-700">Target Optimasi Eco Mode</div>
          <div class="text-base font-extrabold text-emerald-700 mt-0.5">23.5°C &bull; ${ecoKw} kW</div>
          <div class="text-[10px] text-emerald-700 font-semibold mt-0.5">Hemat ~${formatRp(savedRpMonth)}/bln</div>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="openRoomDetailModal('${client.id}', '${bld.id}', '${room.id}')" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Kontrol Manual &amp; Grafik</button>
        <button type="button" onclick="optimizeOverusageRoom('${client.id}', '${bld.id}', '${room.id}')" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold shadow-sm transition">⚡ Optimalkan Suhu / Aktifkan Eco 23.5°C</button>
      </div>
    </div>
  `, 'max-w-lg');
}

function openTechFloorplanModal(ticketId) {
  const t = state.tickets.find((x) => x.id === ticketId);
  if (!t) return;
  const client = state.clients.find((c) => c.id === t.clientId);
  const bld = client && client.buildings.find((b) => b.id === t.buildingId);
  if (!client || !bld) { showToast('Data denah gedung untuk tiket ini tidak ditemukan.', 'warning'); return; }

  const floors = getBuildingFloorsMeta(bld);
  const floorMeta = floors.find((f) => f.floorKey === t.floor) || floors.find((f) => !f.isRooftop) || floors[0];
  const rule = lookupErrorRule(t.brand, t.errorCode);
  const checklist = rule.checklist || ['Multimeter Digital', 'Manifold Gauge', 'Tool Kit Standar'];
  const portNum = ((t.unitId || '').replace(/\D/g, '').slice(-2) || '04');

  const svgNav = buildFloorBlueprintSvg(client, bld, floorMeta, { highlightTicket: t });

  openModal(`
    <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-300">Denah Navigasi Teknisi (Pinpoint Floor Blueprint)</div>
        <h3 class="text-sm sm:text-base font-extrabold">${escapeHtml(t.id)} &mdash; ${escapeHtml(t.clientName)} (${escapeHtml(bld.name)} ${escapeHtml(t.floor)})</h3>
      </div>
      <button type="button" onclick="closeModal()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 space-y-4 max-h-[84vh] overflow-y-auto custom-scroll">
      <div class="rounded-2xl overflow-hidden border border-slate-800 bg-[#081221] shadow-md">
        ${svgNav}
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-3.5 space-y-1">
          <div class="text-[10px] font-bold uppercase text-slate-400">Jalur Pipa &amp; Port Gateway</div>
          <div class="font-bold text-slate-900 font-mono">${escapeHtml(bld.gatewayId)} &bull; Port #${escapeHtml(portNum)}</div>
          <div class="text-[11px] text-slate-600">Protokol: ${escapeHtml(bld.protocol)} &bull; Riser Shaft Utama Sisi Barat</div>
        </div>
        <div class="rounded-xl bg-amber-50 border border-amber-200 p-3.5 space-y-1">
          <div class="text-[10px] font-bold uppercase text-amber-800">Posisi Panel MCB Lokal</div>
          <div class="font-bold text-slate-900">Panel Sub-Distribusi ${escapeHtml(t.floor)}</div>
          <div class="text-[11px] text-amber-900">Terletak di sisi koridor dekat Lift Servis &bull; Manhole (MH) tepat di plafon ${escapeHtml(t.roomName)}</div>
        </div>
        <div class="rounded-xl bg-rose-50 border border-rose-200 p-3.5 space-y-1">
          <div class="text-[10px] font-bold uppercase text-rose-700">Kode Error &amp; Sparepart Wajib</div>
          <div class="font-bold text-rose-800 font-mono">${escapeHtml(t.brand)} [${escapeHtml(t.errorCode)}]</div>
          <div class="text-[11px] text-slate-700">${escapeHtml(rule.recommendedPart)}</div>
        </div>
      </div>
      <div class="rounded-xl bg-slate-50 border border-slate-200 p-3.5">
        <div class="text-[11px] font-bold uppercase text-slate-500 mb-2">Checklist Alat &amp; Sparepart yang Harus Dibawa</div>
        <div class="flex flex-wrap gap-2">
          ${checklist.map((item) => `<span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-medium text-slate-700">&#10003; ${escapeHtml(item)}</span>`).join('')}
        </div>
      </div>
      <div class="flex items-center justify-end gap-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Tutup Denah Navigasi</button>
      </div>
    </div>
  `, 'max-w-5xl');
}

/* =========================================================
   BOOTSTRAP APPLICATION ON DOMContentLoaded
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  const acc = getCurrentAccount();
  if (acc) {
    const defaultTabs = { superadmin: 'overview', admin: 'executive', client: 'overview', technician: 'workorders' };
    currentTab = defaultTabs[acc.role] || 'overview';
    enterDashboard();
  } else {
    renderLoginView();
  }
});
</script>
</body>
</html>
