function openTechFloorplanModal(ticketId) {
  const t = state.tickets.find((x) => x.id === ticketId);
  if (!t) return;
  const client = state.clients.find((c) => c.id === t.clientId);
  const bld = client && client.buildings.find((b) => b.id === t.buildingId);
  if (!client || !bld) { showToast('Data denah gedung untuk tiket ini tidak ditemukan.', 'warning'); return; }

  const floors = getBuildingFloorsMeta(bld);
  const floorMeta = floors.find((f) => f.floorKey === t.floor) || floors.find((f) => !f.isRooftop) || floors[0];
  const rule = lookupErrorRule(t.brand, t.errorCode);
  const checklist = rule.checklist || ['Multimeter Digital', 'Manifold Gauge', 'Tool Kit Standar'];
  const portNum = ((t.unitId || '').replace(/\D/g, '').slice(-2) || '04');

  const svgNav = buildFloorBlueprintSvg(client, bld, floorMeta, { highlightTicket: t });

  openModal(`
    <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-teal-300">Denah Navigasi Teknisi (Pinpoint Floor Blueprint)</div>
        <h3 class="text-sm sm:text-base font-extrabold">${escapeHtml(t.id)} &mdash; ${escapeHtml(t.clientName)} (${escapeHtml(bld.name)} ${escapeHtml(t.floor)})</h3>
      </div>
      <button type="button" onclick="closeModal()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 space-y-4 max-h-[84vh] overflow-y-auto custom-scroll">
      <div class="rounded-2xl overflow-hidden border border-slate-800 bg-[#081221] shadow-md">
        ${svgNav}
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-3.5 space-y-1">
          <div class="text-[10px] font-bold uppercase text-slate-400">Jalur Pipa &amp; Port Gateway</div>
          <div class="font-bold text-slate-900 font-mono">${escapeHtml(bld.gatewayId)} &bull; Port #${escapeHtml(portNum)}</div>
          <div class="text-[11px] text-slate-600">Protokol: ${escapeHtml(bld.protocol)} &bull; Riser Shaft Utama Sisi Barat</div>
        </div>
        <div class="rounded-xl bg-amber-50 border border-amber-200 p-3.5 space-y-1">
          <div class="text-[10px] font-bold uppercase text-amber-800">Posisi Panel MCB Lokal</div>
          <div class="font-bold text-slate-900">Panel Sub-Distribusi ${escapeHtml(t.floor)}</div>
          <div class="text-[11px] text-amber-900">Terletak di sisi koridor dekat Tangga Servis &bull; Manhole (MH) tepat di plafon ${escapeHtml(t.roomName)}</div>
        </div>
        <div class="rounded-xl bg-rose-50 border border-rose-200 p-3.5 space-y-1">
          <div class="text-[10px] font-bold uppercase text-rose-700">Kode Error &amp; Sparepart Wajib</div>
          <div class="font-bold text-rose-800 font-mono">${escapeHtml(t.brand)} [${escapeHtml(t.errorCode)}]</div>
          <div class="text-[11px] text-slate-700">${escapeHtml(rule.recommendedPart)}</div>
        </div>
      </div>
      <div class="rounded-xl bg-slate-50 border border-slate-200 p-3.5">
        <div class="text-[11px] font-bold uppercase text-slate-500 mb-2">Checklist Alat &amp; Sparepart yang Harus Dibawa</div>
        <div class="flex flex-wrap gap-2">
          ${checklist.map((item) => `<span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-medium text-slate-700">&#10003; ${escapeHtml(item)}</span>`).join('')}
        </div>
      </div>
      <div class="flex items-center justify-end gap-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Tutup Denah Navigasi</button>
      </div>
    </div>
  `, 'max-w-5xl');
}

/* =========================================================
   BOOTSTRAP APPLICATION ON DOMContentLoaded
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  const acc = getCurrentAccount();
  if (acc) {
    const defaultTabs = { superadmin: 'overview', admin: 'executive', client: 'overview', technician: 'workorders' };
    currentTab = defaultTabs[acc.role] || 'overview';
    enterDashboard();
  } else {
    renderLoginView();
  }
});
</script>
</body>
</html>
